        geminiSecret: { type: string }
        minNetUsd: { type: number, nullable: true, description: "Configurable positive profit floor; default $0.01 net after all costs; never accepted below $0.01" }
        bufferUsd: { type: number, nullable: true }
    MmScanRow:
      type: object
      properties:
        asset: { type: string }
        structure: { type: string, description: "cbMaker (Coinbase maker + Kraken hedge) | kMaker (reverse) | takerKtoC (buy Kraken, sell Coinbase, taker both) | takerCtoK | venueMaker (venue-generic maker→hedge, includes any Gemini leg)" }
        structureLabel: { type: string, description: "human-readable structure, e.g. 'gemini(maker)→kraken(hedge)'" }
        direction: { type: string }
        available: { type: boolean }
        makerVenue: { type: string, description: "kraken | coinbase | gemini" }
        hedgeVenue: { type: string, description: "kraken | coinbase | gemini" }
        makerFeePct: { type: number, nullable: true, description: "null = fee tier NOT detected for the maker venue (shown as ASSUMED)" }
        hedgeFeePct: { type: number, nullable: true, description: "null = fee tier NOT detected for the hedge venue (shown as ASSUMED)" }
        makerPrice: { type: number }
        makerQty: { type: number }
        hedgeVwapPx: { type: number }
        makerFeeUsd: { type: number }
        hedgeFeeUsd: { type: number }
        hedgeSlippageUsd: { type: number }
        grossEdgeUsd: { type: number, nullable: true, description: "Top-of-book edge before any fees/slippage" }
        projectedNetUsd: { type: number, nullable: true }
        quoteAgeMs: { type: number }
        inventoryReady: { type: boolean }
        inventoryReason: { type: string }
        requiredBalances: { type: string, description: "Exact balances both legs need (with 2% headroom)" }
        verdict: { type: string, description: "RUN | WAIT — mirrors the executor gate exactly" }
        fire: { type: string, description: "FIRE = full gate cleared | WATCH = positive net but blocked | SKIP = net ≤ 0 or unavailable" }
        reason: { type: string }
        autoExecutable: { type: boolean }
    MmScanResult:
