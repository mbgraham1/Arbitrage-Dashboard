openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: CAT Arbitrage Dashboard API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: exchange
    description: Exchange price and balance operations
  - name: trades
    description: Trade execution and history
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /prices:
    post:
      operationId: fetchPrices
      tags: [exchange]
      summary: Fetch live prices from both exchanges
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeCredentials"
      responses:
        "200":
          description: Current prices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceData"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Exchange fetch error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /balances:
    post:
      operationId: fetchBalances
      tags: [exchange]
      summary: Fetch balances from both exchanges
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeCredentials"
      responses:
        "200":
          description: Current balances
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceData"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Exchange fetch error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /credentials/preloaded:
    get:
      operationId: getPreloadedCredentials
      tags: [exchange]
      summary: Read API credentials from server environment variables (Replit Secrets)
      responses:
        "200":
          description: Credentials loaded from env vars (empty string if not set)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreloadedCredentials"

  /test-kraken:
    post:
      operationId: testKraken
      tags: [exchange]
      summary: Test Kraken connection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KrakenCredentials"
      responses:
        "200":
          description: Connection test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionTestResult"
        "400":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /test-coinbase:
    post:
      operationId: testCoinbase
      tags: [exchange]
      summary: Test Coinbase connection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoinbaseCredentials"
      responses:
        "200":
          description: Connection test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionTestResult"
        "400":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /execute-trade:
    post:
      operationId: executeTrade
      tags: [trades]
      summary: Execute an arbitrage trade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradeRequest"
      responses:
        "200":
          description: Trade result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Trade execution error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /trades:
    get:
      operationId: listTrades
      tags: [trades]
      summary: Get trade history
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Trade history list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TradeRecord"

  /prices/all-pairs:
    get:
      operationId: getAllPairSnapshots
      tags: [exchange]
      summary: Return cached bid/ask for all 10 pairs without REST fallbacks
      description: >
        Reads the in-memory price cache for all 10 configured pairs and returns
        every pair — including those with stale or missing data. Kraken and
        Coinbase bid/ask fields are null when no fresh data is available (> 30 s
        old), allowing the UI to render a "—" placeholder. Sorted by gross spread
        descending; no-data pairs go last.
      parameters:
        - name: enabledPairs
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            items: { type: string }
          description: "Optional allow-list of pair symbols to include (comma-separated). Returns all pairs when omitted."
      responses:
        "200":
          description: Snapshot for all 10 pairs (some fields may be null when data is stale)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AllPairSnapshot"

  /arb/scan:
    get:
      operationId: scanAllPairs
      tags: [exchange]
      summary: Scan all 10 pairs and rank by cross-exchange gross spread
      description: >
        Port of Python scan_all_coins(). Fetches bid/ask for all 10 configured
        pairs from Kraken and Coinbase and returns them sorted by gross spread
        (best direction per pair) descending. Net edge = grossSpreadPct minus
        the client's fee + slippage settings.
      parameters:
        - name: enabledPairs
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            items: { type: string }
          description: "Optional allow-list of pair symbols to scan (comma-separated). Scans all pairs when omitted."
      responses:
        "200":
          description: All pairs ranked by gross spread descending
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PairScanEntry"
        "500":
          description: Price fetch error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /arb/cointegration:
    get:
      operationId: scanCointegrationArb
      tags: [exchange]
      summary: Run Kalman-filter cointegration scan and return mean-reversion signals
      description: >
        Fetches mid-prices for SOL, ETH, BTC, AVAX, and DOT from the in-memory
        cache, updates each pair's Kalman-filter spread history, and returns any
        pairs whose |z-score| ≥ 2.0. Returns an empty signals array when
        observations are insufficient or no pair is out-of-range.
      responses:
        "200":
          description: Cointegration scan result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CointegrationScanResult"
        "500":
          description: Scan error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /arb/triangular:
    get:
      operationId: scanTriangularArb
      tags: [exchange]
      summary: Scan for triangular arbitrage opportunities within each exchange
      description: >
        Checks USDT→SOL→ETH→USDT and USDT→ETH→SOL→USDT loops on Kraken and
        Coinbase using live bid/ask prices. Returns opportunities where the
        loop product after fees exceeds the 0.1% profit threshold.
      responses:
        "200":
          description: Triangular arbitrage scan results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriangularScanResult"
        "500":
          description: Price fetch error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /arb/ob-scan:
    get:
      operationId: getObScan
      tags: [arb]
      summary: Scan triangular cycles across 34 assets using L2 order book depth (v18 port)
      description: >
        Port of Python v18 "Scaling Analyzer" (v17 wide-net scan plus a scaling
        table — the top-ranked route is re-simulated at $10/$50/$100/$500/$1,000
        with VIABLE / HIGH_SLIPPAGE / REJECTED statuses; the min-profit threshold
        scales with size/10). Fetches Kraken Depth API for all
        required pairs in parallel, then walks the book for each A→B permutation
        of 34 assets (only routes with a real Kraken cross pair
        are simulatable) to compute realistic fill prices at the given trade size.
        An optional volatility filter restricts the scan to assets that moved more
        than 1.5% in 24h (falls back to all assets when fewer than 3 qualify).
        All simulatable cycles (top 15) are returned ranked by estimated net
        profit, each with total execution slippage, a liquidity confidence score,
        and a READY / HIGH_SLIPPAGE / LOW_PROFIT status classification.
      parameters:
        - name: tradeSizeUsd
          in: query
          description: Simulated trade size in USD (default 10)
          schema: {type: number, default: 10}
        - name: feesPct
          in: query
          description: Estimated total fees % (default 0.5 — 3 legs × 0.16% maker)
          schema: {type: number, default: 0.5}
        - name: minProfitUsd
          in: query
          description: Minimum net profit ($) required for READY status at $10 (default 0.02 — v18; scaled by size/10 in the scaling table)
          schema: {type: number, default: 0.02}
        - name: maxSlippagePct
          in: query
          description: Maximum tolerated total slippage (%) for READY status (default 0.5)
          schema: {type: number, default: 0.5}
        - name: volatilityFilter
          in: query
          description: v17 — scan only assets with |24h change| > 1.5% (default true; falls back to all assets when fewer than 3 qualify)
          schema: {type: boolean, default: true}
        - name: maxLegs
          in: query
          description: v20 — 3 scans triangles only; 4 (default) also simulates 4-leg routes through the BTC/ETH cross (USD→A→BTC→ETH→USD and USD→A→ETH→BTC→USD)
          schema: {type: number, enum: [3, 4], default: 4}
      responses:
        "200":
          description: Ranked cycle list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObScanResult"
        "500":
          description: Scan error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /arb/ob-pairs-refresh:
    get:
      operationId: obPairsRefresh
      tags: [arb]
      summary: Force-refresh the discovered Kraken cross-pair list
      description: >
        Invalidates the cached AssetPairs discovery result and re-queries
        Kraken immediately, so new listings appear in ob-scan without a server
        restart. When the refresh fails but a previous discovered set exists,
        that set is kept (refreshed=false only when running on the hardcoded
        fallback).
      responses:
        "200":
          description: Refresh result
          content:
            application/json:
              schema:
                type: object
                required: [refreshed, crossPairsDiscovered, cachedAt]
                properties:
                  refreshed:
                    type: boolean
                    description: True when a real discovered set is active (fresh or previous good cache)
                  crossPairsDiscovered:
                    type: integer
                    description: Number of crypto cross pairs in the active discovered set (0 = hardcoded fallback)
                  cachedAt:
                    type: string
                    format: date-time
                    nullable: true
                    description: When the active discovered set was cached (null on hardcoded fallback)
        "500":
          description: Refresh error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /arb/ob-execute:
    post:
      operationId: obExecute
      tags: [trades]
      summary: Manually execute the top Order Book Hunter route (v18 port)
      description: >
        Port of the Python v18 MANUAL EXECUTION BUTTON. Re-fetches fresh order
        books for the route (cache bypassed), re-simulates the cycle
        (pre-flight), and only places 3 sequential Kraken market orders when
        the fresh profit exceeds minProfitUsd × (size/10). Dry-run records a
        ledger row without placing orders. Legs are sized from the pre-flight
        simulation with orientation-aware cross-pair sides.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObExecuteRequest"
      responses:
        "200":
          description: Execution (or pre-flight rejection) result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObExecuteResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /arb/execution-quality:
    get:
      operationId: getExecutionQuality
      tags: [trades]
      summary: Per-route execution quality aggregates (fill rate, expected vs realized profit)
      responses:
        "200":
          description: Aggregated execution-quality records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionQualityResult"
  /arb/execution-status:
    get:
      operationId: getExecutionStatus
      tags: [trades]
      summary: Live per-leg status of the currently executing triangle
      description: >
        In-memory snapshot updated by the maker-leg fill machinery — current
        leg, order ID, elapsed time, filled percent, per-leg fill timer, and
        retry attempt. Idle (active=false) when nothing is executing.
      responses:
        "200":
          description: Current execution status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionStatusResult"
  /arb/account-pnl:
    post:
      operationId: getAccountPnl
      tags: [trades]
      summary: Ground-truth P&L from actual exchange balances
      description: >
        Values the Kraken account (plus Coinbase when creds provided) at live
        tickers, stores a snapshot, and decomposes the equity change into
        external cash flows (Kraken Ledgers), trading P&L (sum of per-trade
        realized fills), and unrealized drift. Never estimated from scanner profit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountPnlRequest"
      responses:
        "200":
          description: Account P&L computed from balance snapshots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountPnlResult"
  /arb/inventory-imbalance:
    get:
      operationId: getInventoryImbalance
      tags: [trades]
      summary: Per-asset inventory imbalance from live cross-exchange trades
      description: >
        Aggregates completed LIVE cross-exchange inventory trades into per-asset
        venue deltas (base units): buying on one venue and selling
        pre-positioned inventory on the other shifts holdings between
        exchanges. Bookkeeping for later rebalancing — not P&L.
      responses:
        "200":
          description: Per-asset venue deltas
          content:
            application/json:
              schema:
                type: object
                required: [assets, note]
                properties:
                  assets:
                    type: array
                    items:
                      type: object
                      required: [asset, krakenDelta, coinbaseDelta, trades]
                      properties:
                        asset: { type: string }
                        krakenDelta: { type: number, description: "Base units accumulated (+) or drawn down (−) on Kraken" }
                        coinbaseDelta: { type: number }
                        trades: { type: integer }
                        lastTradeAt: { type: string, nullable: true }
                  note: { type: string }
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /arb/cross-mm-execute:
    post:
      operationId: executeCrossMm
      tags: [trades]
      summary: Run one maker-post + taker-hedge cross-exchange cycle
      description: >
        Rests a POST-ONLY limit order on Kraken sized for the given USD
        exposure, only when a confirmed fill could be hedged profitably at
        market on Coinbase against pre-positioned inventory. The hedge is
        never placed before the maker fill is confirmed; the resting order is
        cancelled if it does not fill inside the window or if the projected
        hedged net drops below the profit floor. Dry run returns the full
        projection without placing anything.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrossMmExecuteRequest"
      responses:
        "200":
          description: Cycle outcome (projection, fills, hedge, realized P&L)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrossMmExecuteResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /arb/cross-mm-stats:
    get:
      operationId: getCrossMmStats
      tags: [trades]
      summary: Maker-post/taker-hedge strategy scoreboard (separate from triangles)
      responses:
        "200":
          description: Attempts, fills, hedge outcomes, and realized P&L for the cross-mm strategy only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrossMmStats"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /arb/two-exchange-test:
    post:
      operationId: runTwoExchangeTest
      tags: [trades]
      summary: One-shot two-exchange live test (Kraken market buy → Coinbase sell)
      description: >
        Standalone diagnostic, fully separate from the arbitrage strategies.
        Buys ~$10 of ETH at market on Kraken, then sells the CONFIRMED filled
        quantity on Coinbase from pre-positioned ETH. Refuses to place any
        order when balances or credentials are insufficient. Records exact
        fills, fees, timestamps, order ids, and realized P&L. Never loops,
        never scales size.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoExchangeTestRequest"
      responses:
        "200":
          description: Test outcome with per-leg fills, fees, timestamps, and realized P&L
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoExchangeTestResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /arb/fee-tier:
    post:
      operationId: getFeeTier
      tags: [trades]
      summary: Look up the account's actual Kraken taker fee tier
      description: >
        Queries Kraken /0/private/TradeVolume for the caller's real taker fee
        on major pairs (max across pairs). Returns null when the query fails
        (bad keys, network) so callers can fall back to their configured
        assumption.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeeTierRequest"
      responses:
        "200":
          description: Actual taker fee (percent per leg) or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeeTierResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /arb/graph-scan:
    get:
      operationId: getGraphScan
      tags: [trades]
      summary: Multi-exchange graph opportunity scan
      description: >
        Builds a directed graph over Kraken (34 assets + verified cross pairs)
        and Coinbase (shared assets), DFS-searches all USD→…→USD cycles up to
        maxHops, and ranks routes by net profit after per-leg fees.
      parameters:
        - { name: tradeSizeUsd,    in: query, schema: { type: number, default: 10 } }
        - { name: krakenFeesPct,   in: query, schema: { type: number, default: 0.16 } }
        - { name: coinbaseFeesPct, in: query, schema: { type: number, default: 0.4 } }
        - { name: maxHops,         in: query, schema: { type: integer, default: 4 } }
        - { name: executionStyle,  in: query, schema: { type: string, enum: [taker, maker], default: taker } }
        - { name: accountId,       in: query, schema: { type: string }, description: "Optional non-reversible account scope (sha256-prefix of held keys) so fill-rate ranking only uses THIS account's execution history. Omitted → neutral prior for all routes." }
      responses:
        "200":
          description: Ranked routes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphScanResult"
        "500":
          description: Scan error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /arb/graph-execute:
    post:
      operationId: graphExecute
      tags: [trades]
      summary: Manually execute an Opportunity Engine route
      description: >
        Re-runs a fresh graph scan (pre-flight), locates the requested route
        (or the top route), and gates on fresh net profit > minProfitUsd.
        Kraken-only triangles reuse the ob-execute 3-leg post-only limit
        machinery (fill confirm + unwind); 2-leg cross-exchange inventory
        routes place both market orders in parallel (requires inventory on
        both venues). Other shapes execute as dry-run only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GraphExecuteRequest"
      responses:
        "200":
          description: Execution (or pre-flight rejection) result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphExecuteResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /arb/route-history/clear:
    post:
      operationId: clearRouteHistory
      tags: [trades]
      summary: Clear the route blacklist and consecutive-failure streaks
      description: >
        Instantly resets all in-memory route failure streaks, removes every
        route from the blacklist, and clears probe cool-downs.
      responses:
        "200":
          description: History cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteHistoryClearResult"

  /arb/exec-preview:
    post:
      operationId: execPreview
      tags: [trades]
      summary: Pre-fire execution breakdown for a Kraken triangle route
      description: >
        Fresh order-book breakdown of what a taker fire would look like right
        now — raw top-of-book edge, taker fees at the account's real tier,
        depth-walked slippage for this size, safety buffer, final executable
        net edge, and expected dollar profit — plus the maker-priced net and
        risk-adjusted maker EV, and which path adaptive mode would choose.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecPreviewRequest"
      responses:
        "200":
          description: Breakdown (ok=false when books unavailable or route unsupported)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecPreviewResult"

  /arb/exec-lock/clear:
    post:
      operationId: clearExecLock
      tags: [trades]
      summary: HARD RESET — force-release the live execution lock
      description: >
        Manually clears the shared live-execution lock (e.g. when a dead route
        appears to be holding it). Invalidates the current holder's generation
        token so a zombie execution can never release a newer run's lock.
        Use with care — if an execution is genuinely mid-order, clearing the
        lock allows a second execution to run concurrently. Requires valid
        Kraken credentials: the caller must prove account ownership before
        a concurrency control can be disabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecLockClearRequest"
      responses:
        "200":
          description: Lock cleared (or was already free)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecLockClearResult"

  /arb/execute-triangular:
    post:
      operationId: executeTriangular
      tags: [trades]
      summary: Execute a BTC/SOL/USD triangular loop on Kraken
      description: >
        Port of Python v13 FORCE TRIANGULAR. Places 3 sequential market orders on Kraken
        for either the USD→BTC→SOL→USD or USD→SOL→BTC→USD loop. In dry-run mode only
        computes the estimated profit without placing orders. Trade size defaults to 10 USD
        (dry/force) or 20% of USD balance capped at $50 (auto-loop).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriExecuteRequest"
      responses:
        "200":
          description: Execution result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriExecuteResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Execution error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /arb/inventory-scan:
    get:
      operationId: getInventoryScan
      tags: [trades]
      summary: Scan live bid/ask across Kraken and Coinbase for inventory arb opportunities
      description: >
        Fetches live best-bid/best-ask for each requested asset from both venues,
        computes gross and net spread (after per-leg fees), and flags any asset
        whose net spread exceeds 2× total fees. When credentials are supplied the
        response also includes rebalance alerts when one-side inventory drops
        below 20% of the target allocation.
      parameters:
        - { name: assets,          in: query, schema: { type: string, default: "BTC,ETH,SOL" }, description: "Comma-separated asset symbols" }
        - { name: krakenFeesPct,   in: query, schema: { type: number, default: 0.16 } }
        - { name: coinbaseFeesPct, in: query, schema: { type: number, default: 0.4 } }
        - { name: tradeSizeUsd,    in: query, schema: { type: number, default: 10 } }
        - { name: targetPct,       in: query, schema: { type: number, default: 50 }, description: "Target % of asset to hold on each exchange (0–100)" }
      responses:
        "200":
          description: Inventory scan result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryScanResult"
        "500":
          description: Scan error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /arb/inventory-execute:
    post:
      operationId: inventoryExecute
      tags: [trades]
      summary: Execute an inventory arb — buy on cheap venue, sell on expensive venue
      description: >
        Re-fetches live prices (pre-flight), confirms the spread still exceeds the
        minimum profit threshold, then places a buy on the cheaper exchange and a
        sell on the more expensive one using existing inventory. Acquires the
        process-wide live execution lock so it cannot run concurrently with graph
        or OB execute. Records the result to the trade ledger.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryExecuteRequest"
      responses:
        "200":
          description: Execution result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryExecuteResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Execution error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /trades/summary:
    get:
      operationId: getTradeSummary
      tags: [trades]
      summary: Get P&L summary and statistics
      responses:
        "200":
          description: P&L summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeSummary"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    KrakenCredentials:
      type: object
      required: [krakenKey, krakenSecret]
      properties:
        krakenKey:
          type: string
        krakenSecret:
          type: string

    CoinbaseCredentials:
      type: object
      required: [coinbaseKey, coinbaseSecret]
      properties:
        coinbaseKey:
          type: string
        coinbaseSecret:
          type: string

    ExchangeCredentials:
      type: object
      required: [krakenKey, krakenSecret, coinbaseKey, coinbaseSecret]
      properties:
        krakenKey:
          type: string
        krakenSecret:
          type: string
        coinbaseKey:
          type: string
        coinbaseSecret:
          type: string
        enabledPairs:
          type: array
          items:
            type: string
          description: "Optional allow-list of pair symbols to scan (e.g. ['SOL/USD', 'BTC/USD']). Scans all pairs when omitted."
        pair:
          type: string
          description: "Active trading pair (e.g. BTC/USD). When provided, base-asset balances for that pair are included in the response."

    WsStatus:
      type: object
      required: [kraken, coinbase]
      properties:
        kraken:
          type: boolean
        coinbase:
          type: boolean

    PriceData:
      type: object
      required: [krakenPrice, krakenBid, krakenAsk, coinbasePrice, coinbaseBid, coinbaseAsk, grossSpreadPct, route, timestamp, bestBuyExchange, bestSellExchange, buyPrice, sellPrice, executable, wsStatus]
      properties:
        pair:
          type: string
          description: "Canonical pair symbol with the best spread (e.g. SOL/USD, BTC/USD)"
        krakenPrice:
          type: number
        krakenBid:
          type: number
        krakenAsk:
          type: number
        coinbasePrice:
          type: number
        coinbaseBid:
          type: number
        coinbaseAsk:
          type: number
        binancePrice:
          type: number
          nullable: true
        kuCoinPrice:
          type: number
          nullable: true
        grossSpreadPct:
          type: number
          description: "Gross top-of-book spread, BEFORE fees/slippage. Net edge is computed client-side as gross − (totalFees + slippage) so it always matches the execution gate."
        route:
          type: string
        buyExchange:
          type: string
        sellExchange:
          type: string
        bestBuyExchange:
          type: string
        bestSellExchange:
          type: string
        buyPrice:
          type: number
        sellPrice:
          type: number
        executable:
          type: boolean
        wsStatus:
          $ref: "#/components/schemas/WsStatus"
        timestamp:
          type: string

    BalanceEntry:
      type: object
      required: [currency, amount]
      properties:
        currency:
          type: string
        amount:
          type: number

    BalanceData:
      type: object
      required: [kraken, coinbase]
      properties:
        kraken:
          type: array
          items:
            $ref: "#/components/schemas/BalanceEntry"
        coinbase:
          type: array
          items:
            $ref: "#/components/schemas/BalanceEntry"
        solOnKraken:
          type: number
        solOnCoinbase:
          type: number
        usdOnCoinbase:
          type: number
        suggestedVolume:
          type: number
        baseAsset:
          type: string
          description: "Base asset of the requested pair (e.g. BTC); SOL when no pair given"
        baseAssetOnKraken:
          type: number
        baseAssetOnCoinbase:
          type: number

    PreloadedCredentials:
      type: object
      required: [krakenKey, krakenSecret, coinbaseKey, coinbaseSecret, anyLoaded]
      properties:
        krakenKey:
          type: string
        krakenSecret:
          type: string
        coinbaseKey:
          type: string
        coinbaseSecret:
          type: string
        anyLoaded:
          type: boolean

    ConnectionTestResult:
      type: object
      required: [ok, message]
      properties:
        ok:
          type: boolean
        message:
          type: string
        balances:
          type: array
          items:
            $ref: "#/components/schemas/BalanceEntry"

    TradeRequest:
      type: object
      required: [krakenKey, krakenSecret, coinbaseKey, coinbaseSecret, buyExchange, sellExchange, volume, krakenPrice, coinbasePrice, liveMode]
      properties:
        krakenKey:
          type: string
        krakenSecret:
          type: string
        coinbaseKey:
          type: string
        coinbaseSecret:
          type: string
        buyExchange:
          type: string
        sellExchange:
          type: string
        volume:
          type: number
        krakenPrice:
          type: number
        coinbasePrice:
          type: number
        liveMode:
          type: boolean
        netEdgePct:
          type: number
        orderType:
          type: string
          enum: [market, limit]
          default: market
        pair:
          type: string
          description: "Trading pair symbol (e.g. SOL/USD, BTC/USD). Defaults to SOL/USD."

    TradeResult:
      type: object
      required: [success, isDryRun, estimatedProfitUsd, tradeNumber]
      properties:
        success:
          type: boolean
        isDryRun:
          type: boolean
        skipped:
          type: boolean
          description: "True when the trade was skipped (e.g. insufficient balance) rather than executed or failed"
        estimatedProfitUsd:
          type: number
        tradeNumber:
          type: integer
        buyOrderId:
          type: ["string", "null"]
        sellOrderId:
          type: ["string", "null"]
        error:
          type: ["string", "null"]

    TradeRecord:
      type: object
      required: [id, createdAt, buyExchange, sellExchange, volume, estimatedProfitUsd, netEdgePct, isDryRun, krakenPrice, coinbasePrice]
      properties:
        id:
          type: integer
        createdAt:
          type: string
        pair:
          type: ["string", "null"]
          description: "Trading pair symbol (e.g. SOL/USD, BTC/USD). Null for records before multi-pair support."
        buyExchange:
          type: string
        sellExchange:
          type: string
        volume:
          type: number
        estimatedProfitUsd:
          type: number
        netEdgePct:
          type: number
        isDryRun:
          type: boolean
        krakenPrice:
          type: number
        coinbasePrice:
          type: number
        buyOrderId:
          type: ["string", "null"]
        sellOrderId:
          type: ["string", "null"]
        status:
          type: ["string", "null"]
          description: >
            Ledger classification: verified (every leg has confirmed exchange
            fill data + order IDs; realizedProfitUsd is real), failed (live
            attempt that did not complete, incl. unwinds), simulated (dry
            runs / scanner estimates), estimated (legacy live rows without
            per-leg fill proof). Null on very old rows.
        realizedProfitUsd:
          type: ["number", "null"]
          description: Realized P&L from ACTUAL confirmed fills, fee-inclusive. Only on verified rows.
        legFills:
          type: ["array", "null"]
          description: Per-leg confirmed fill evidence (actual price, volume, fee, exchange order ID).
          items:
            type: object
            properties:
              leg: { type: integer }
              label: { type: string }
              pair: { type: string }
              side: { type: string }
              price: { type: ["number", "null"] }
              volume: { type: number }
              costUsd: { type: number }
              fee: { type: number }
              txid: { type: ["string", "null"] }
              taker: { type: boolean }
              unwind: { type: boolean }

    AllPairSnapshot:
      type: object
      required: [pair, coin, grossSpreadPct, buyExchange, krakenBid, krakenAsk, coinbaseBid, coinbaseAsk]
      properties:
        pair:
          type: string
          description: "Canonical pair, e.g. BTC/USD"
        coin:
          type: string
          description: "Short coin symbol, e.g. BTC"
        krakenBid:
          type: ["number", "null"]
          description: "Kraken best bid; null when cache data is stale (> 30 s)"
        krakenAsk:
          type: ["number", "null"]
          description: "Kraken best ask; null when cache data is stale (> 30 s)"
        coinbaseBid:
          type: ["number", "null"]
          description: "Coinbase best bid; null when cache data is stale (> 30 s)"
        coinbaseAsk:
          type: ["number", "null"]
          description: "Coinbase best ask; null when cache data is stale (> 30 s)"
        grossSpreadPct:
          type: ["number", "null"]
          description: "Gross cross-exchange spread % (best direction); null when either side is missing"
        buyExchange:
          type: ["string", "null"]
          description: "Exchange to buy on for best spread; null when spread cannot be computed"

    PairScanEntry:
      type: object
      required: [coin, pair, krakenPrice, coinbasePrice, krakenBid, krakenAsk, coinbaseBid, coinbaseAsk, grossSpreadPct, buyExchange, sellExchange, scannedAt]
      properties:
        coin:
          type: string
          description: "Short coin symbol, e.g. BTC, ETH, SOL"
        pair:
          type: string
          description: "Canonical pair, e.g. BTC/USD"
        krakenPrice:
          type: number
        coinbasePrice:
          type: number
        krakenBid:
          type: number
        krakenAsk:
          type: number
        coinbaseBid:
          type: number
        coinbaseAsk:
          type: number
        grossSpreadPct:
          type: number
          description: "Gross cross-exchange spread % using bid/ask (best direction)"
        buyExchange:
          type: string
        sellExchange:
          type: string
        scannedAt:
          type: string

    ObCycleEntry:
      type: object
      required: [route, assetA, assetB, estimatedProfitUsd, profitPct, grossProfitUsd, feeUsd, avgPriceA, avgCrossRate, avgPriceB, volumeA, slippagePct, status, confidencePct, legs]
      properties:
        route: {type: string, description: "e.g. USD→SOL→ETH→USD"}
        assetA: {type: string}
        assetB: {type: string}
        estimatedProfitUsd: {type: number}
        grossProfitUsd: {type: number, description: "raw triangle edge ($) before fees, slippage included"}
        feeUsd: {type: number, description: "total 3-leg fee drag ($) at the scan's per-leg fee rate"}
        profitPct: {type: number, description: "profit as % of tradeSizeUsd"}
        avgPriceA: {type: number, description: "average USD fill price for leg 1"}
        avgCrossRate: {type: number, description: "average B-per-A cross rate"}
        avgPriceB: {type: number, description: "average USD fill price for leg 3"}
        volumeA: {type: number, description: "amount of A acquired in leg 1"}
        slippagePct: {type: number, description: "total execution slippage across 3 legs (%)"}
        status:
          type: string
          enum: [READY, HIGH_SLIPPAGE, LOW_PROFIT]
          description: "v15 conservative classification"
        confidencePct: {type: number, description: "v17 liquidity confidence 0-100 — avg top-of-book coverage across all legs"}
        legs: {type: number, description: "v20 — number of legs in the route: 3 (USD→A→B→USD) or 4 (USD→A→M→B→USD via the BTC/ETH cross)"}

    ObScalingRow:
      type: object
      required: [sizeUsd, profitUsd, slippagePct, confidencePct, status]
      properties:
        sizeUsd: {type: number}
        profitUsd: {type: number}
        slippagePct: {type: number}
        confidencePct: {type: number}
        status:
          type: string
          enum: [VIABLE, HIGH_SLIPPAGE, REJECTED]
          description: "v18 — VIABLE when profit > minProfitUsd×(size/10) and slippage within limit"

    ObScanResult:
      type: object
      required: [cycles, tradeSizeUsd, feesPct, minProfitUsd, maxSlippagePct, readyCount, pairsScanned, pairsRequested, volatilityFilter, activeAssets, scalingRoute, scaling, scannedAt, crossPairsDiscovered]
      properties:
        cycles:
          type: array
          items:
            $ref: "#/components/schemas/ObCycleEntry"
        tradeSizeUsd: {type: number}
        feesPct: {type: number}
        minProfitUsd: {type: number, description: "min net profit ($) for READY status"}
        maxSlippagePct: {type: number, description: "max tolerated total slippage (%) for READY status"}
        readyCount: {type: number, description: "number of READY cycles"}
        pairsScanned: {type: number, description: "pairs whose order book fetch succeeded"}
        pairsRequested: {type: number, description: "pairs the scan attempted to fetch"}
        volatilityFilter: {type: boolean, description: "v17 — whether the volatility filter was requested"}
        activeAssets:
          type: array
          items: {type: string}
          description: "v17 — assets actually scanned after the volatility filter"
        scalingRoute:
          type: string
          nullable: true
          description: "v18 — route of the top-ranked cycle the scaling table covers (null when no cycles)"
        scaling:
          type: array
          items:
            $ref: "#/components/schemas/ObScalingRow"
          description: "v18 — top route re-simulated at $10/$50/$100/$500/$1,000; unabsorbable sizes omitted"
        scannedAt: {type: string}
        crossPairsDiscovered: {type: number, description: "v19 — cross pairs discovered dynamically via Kraken AssetPairs (0 when using the hardcoded fallback)"}

    CointegrationSignal:
      type: object
      required: [pair, asset1, asset2, price1, price2, hedgeRatio, spread, zScore, direction, edgePct, observations, timestamp]
      properties:
        pair:
          type: string
          description: "Display label, e.g. SOL/ETH"
        asset1:
          type: string
          description: "Short symbol for asset 1, e.g. SOL"
        asset2:
          type: string
          description: "Short symbol for asset 2, e.g. ETH"
        price1:
          type: number
        price2:
          type: number
        hedgeRatio:
          type: number
          description: "Kalman-filter beta (hedge ratio)"
        spread:
          type: number
          description: "Latest Kalman spread value"
        zScore:
          type: number
          description: "Normalised z-score of the current spread"
        direction:
          type: string
          enum: [long_asset1, short_asset1]
        edgePct:
          type: number
          description: "Conservative edge estimate as a fraction (not %)"
        observations:
          type: integer
          description: "Number of spread observations in the Kalman history"
        timestamp:
          type: string

    CointegrationScanResult:
      type: object
      required: [signals, scannedAt]
      properties:
        signals:
          type: array
          items:
            $ref: "#/components/schemas/CointegrationSignal"
        scannedAt:
          type: string

    ObExecuteRequest:
      type: object
      required: [krakenKey, krakenSecret, assetA, assetB]
      properties:
        krakenKey:
          type: string
        krakenSecret:
          type: string
        assetA:
          type: string
          description: "Asset A of the displayed top route (server re-verifies via fresh pre-flight)"
        assetB:
          type: string
        tradeSizeUsd:
          type: number
          default: 10
        feesPct:
          type: number
          default: 0.5
        minProfitUsd:
          type: number
          default: 0.02
          description: "Min net profit ($) at $10; pre-flight gate scales it by size/10"
        isDryRun:
          type: boolean
          default: true

    CrossMmExecuteRequest:
      type: object
      required: [krakenKey, krakenSecret, coinbaseKey, coinbaseSecret, asset]
      properties:
        krakenKey: { type: string }
        krakenSecret: { type: string }
        coinbaseKey: { type: string }
        coinbaseSecret: { type: string }
        asset:
          type: string
          description: Base asset traded on both venues (e.g. ETH, BTC, SOL)
        tradeSizeUsd:
          type: number
          default: 10
          maximum: 10
          description: USD exposure of the maker order. Hard-capped at $10 until the strategy proves positive realized P&L.
        minProfitUsd:
          type: number
          default: 0.01
          description: Profit floor the projected hedged net must clear (clamped >= 0 for live runs)
        maxQuoteAgeMs:
          type: number
          default: 200
          description: Freshness window for both venues' books at placement and hedge time
        restWindowMs:
          type: number
          default: 30000
          maximum: 120000
          description: How long the post-only order may rest before cancel
        direction:
          type: string
          enum: [auto, buy, sell]
          default: auto
          description: Side of the Kraken maker order; auto picks the better projected direction
        coinbaseFeesPct:
          type: number
          default: 0.4
          description: Coinbase taker fee assumption (percent) for the hedge leg
        isDryRun:
          type: boolean
          default: true
    CrossMmProjection:
      type: object
      required: [direction, makerPrice, makerQty, projectedNetUsd, makerFeeUsd, hedgeFeeUsd, hedgeVwapPx, quoteAgeMs]
      properties:
        direction: { type: string, enum: [buy, sell] }
        makerPrice: { type: number }
        makerQty: { type: number }
        projectedNetUsd: { type: number }
        makerFeeUsd: { type: number }
        hedgeFeeUsd: { type: number }
        hedgeVwapPx: { type: number }
        hedgeTopPx: { type: number }
        hedgeSlippageUsd: { type: number }
        quoteAgeMs: { type: number }
        legAges: { type: string, description: "Human-readable per-leg book ages" }
    CrossMmExecuteResult:
      type: object
      required: [success, isDryRun, executed, outcome]
      properties:
        success: { type: boolean }
        isDryRun: { type: boolean }
        executed: { type: boolean, description: "True when a maker fill occurred (money moved)" }
        outcome:
          type: string
          description: >
            projection_only | gate_blocked | inventory_blocked | post_rejected |
            no_fill_cancel | gate_cancel | hedged | unhedged | indeterminate
        asset: { type: string }
        projection:
          allOf: [{ $ref: "#/components/schemas/CrossMmProjection" }]
          nullable: true
        makerOrderId: { type: string, nullable: true }
        makerFilledQty: { type: number, nullable: true }
        makerAvgPrice: { type: number, nullable: true }
        hedgeOrderId: { type: string, nullable: true }
        hedgeFilledUsd: { type: number, nullable: true }
        realizedProfitUsd:
          type: number
          nullable: true
          description: Fee-inclusive realized P&L from ACTUAL fills on both legs; null when nothing filled
        latency:
          type: object
          nullable: true
          additionalProperties: { type: number }
          description: Millisecond marks (decide→place→fill→hedge)
        error: { type: string, nullable: true }
    CrossMmStats:
      type: object
      required: [attempts, makerFills, hedged, unhedged, realizedTotalUsd]
      properties:
        attempts: { type: integer }
        postRejected: { type: integer }
        gateCancels: { type: integer }
        noFillCancels: { type: integer }
        makerFills: { type: integer }
        hedged: { type: integer }
        unhedged: { type: integer }
        realizedTotalUsd: { type: number }
        avgRealizedUsd: { type: number, nullable: true }
        fillRatePct: { type: number, nullable: true }
        recent:
          type: array
          items:
            type: object
            properties:
              route: { type: string }
              filled: { type: boolean }
              expectedProfitUsd: { type: number, nullable: true }
              realizedProfitUsd: { type: number, nullable: true }
              note: { type: string, nullable: true }
              createdAt: { type: string, nullable: true }
    TwoExchangeTestRequest:
      type: object
      required: [krakenKey, krakenSecret, coinbaseKey, coinbaseSecret]
      properties:
        krakenKey: { type: string }
        krakenSecret: { type: string }
        coinbaseKey: { type: string }
        coinbaseSecret: { type: string }
        sizeUsd:
          type: number
          default: 10
          maximum: 10
          description: USD size of the Kraken buy. Hard-capped at $10 — this is a diagnostic, not a strategy.
        isDryRun:
          type: boolean
          default: true
          description: When true, verifies balances and prices but places no orders.
    TwoExchangeTestLeg:
      type: object
      properties:
        exchange: { type: string }
        side: { type: string }
        orderId: { type: string, nullable: true }
        status: { type: string, nullable: true }
        filledQty: { type: number, nullable: true }
        avgPrice: { type: number, nullable: true }
        notionalUsd: { type: number, nullable: true }
        feeUsd: { type: number, nullable: true }
        placedAt: { type: string, nullable: true }
        terminalAt: { type: string, nullable: true }
        error: { type: string, nullable: true }
    TwoExchangeTestResult:
      type: object
      required: [success, isDryRun, outcome]
      properties:
        success: { type: boolean }
        isDryRun: { type: boolean }
        outcome:
          type: string
          description: dry_run_ok | blocked | buy_failed | sell_failed | partial_sell | completed | indeterminate
        blockReason: { type: string, nullable: true }
        buyLeg:
          allOf: [{ $ref: "#/components/schemas/TwoExchangeTestLeg" }]
          nullable: true
        sellLeg:
          allOf: [{ $ref: "#/components/schemas/TwoExchangeTestLeg" }]
          nullable: true
        realizedProfitUsd:
          type: number
          nullable: true
          description: (Coinbase proceeds − Coinbase fees) − (Kraken cost + Kraken fees); null unless BOTH legs fully filled
        residualEthOpen: { type: number, nullable: true }
        startedAt: { type: string, nullable: true }
        finishedAt: { type: string, nullable: true }
        error: { type: string, nullable: true }
    FeeTierRequest:
      type: object
      required: [krakenKey, krakenSecret]
      properties:
        krakenKey: { type: string }
        krakenSecret: { type: string }

    AccountPnlRequest:
      type: object
      required: [krakenKey, krakenSecret]
      properties:
        krakenKey: { type: string }
        krakenSecret: { type: string }
        coinbaseKey: { type: string }
        coinbaseSecret: { type: string }
    AccountPnlResult:
      type: object
      required: [startingValueUsd, startedAt, currentValueUsd, usdBalance, unrealizedHoldingsUsd, realizedTodayUsd, lifetimePnlUsd, cashFlowAdjusted, netCashFlowTodayUsd, equityChangeUsd, netCashFlowUsd, tradingPnlUsd, tradedFillCount, unrealizedPnlUsd, cashFlowNote, includesCoinbase, snapshotCount, unpricedAssets]
      properties:
        startingValueUsd: { type: number }
        startedAt: { type: string }
        currentValueUsd: { type: number }
        usdBalance: { type: number }
        unrealizedHoldingsUsd: { type: number }
        realizedTodayUsd:
          type: number
          description: "Equity change since today's baseline, minus external deposits/withdrawals when the ledger was fetchable (see cashFlowAdjusted)"
        lifetimePnlUsd:
          type: number
          description: "Equity change since the first baseline, minus external deposits/withdrawals when the ledger was fetchable (see cashFlowAdjusted)"
        cashFlowAdjusted:
          type: boolean
          description: "True when realizedTodayUsd and lifetimePnlUsd exclude external deposits/withdrawals; false when the ledger couldn't be verified and the numbers are raw equity changes"
        netCashFlowTodayUsd:
          type: number
          nullable: true
          description: "External deposits − withdrawals since today's baseline; null when unknowable"
        equityChangeUsd:
          type: number
          description: "Total change in everything owned since baseline (current − starting)"
        netCashFlowUsd:
          type: number
          nullable: true
          description: "External deposits − withdrawals since baseline (Kraken Ledgers); null when unknowable (ledger unavailable/incomplete, or Coinbase included) — attribution withheld"
        tradingPnlUsd:
          type: number
          description: "Sum of per-trade realized profits from live filled executions"
        tradedFillCount: { type: integer }
        unrealizedPnlUsd:
          type: number
          nullable: true
          description: "Residual: equityChange − cashFlow − tradingPnl ≈ price drift on held coins; null when cash flows are unknowable"
        cashFlowNote: { type: string, nullable: true }
        includesCoinbase: { type: boolean }
        snapshotCount: { type: integer }
        unpricedAssets:
          type: array
          items: { type: string }
    ExecutionQualityRoute:
      type: object
      required: [route, style, attempts, liveAttempts, liveFillRate, avgExpectedProfitUsd, avgRealizedProfitUsd, avgShortfallUsd, avgSlippagePct, totalRealizedProfitUsd, lastAttemptAt]
      properties:
        route: { type: string }
        style: { type: string, enum: [taker, maker] }
        attempts: { type: integer }
        liveAttempts: { type: integer }
        liveFillRate: { type: number, nullable: true }
        avgExpectedProfitUsd: { type: number, nullable: true }
        avgRealizedProfitUsd: { type: number, nullable: true }
        avgShortfallUsd: { type: number, nullable: true }
        avgSlippagePct: { type: number, nullable: true }
        totalRealizedProfitUsd: { type: number, nullable: true }
        lastAttemptAt: { type: string }
        legsTracked: { type: integer, description: "Live attempts with per-leg diagnostics recorded (denominator for the leg fill rates)." }
        leg1FillRate: { type: number, nullable: true, description: "Share of tracked live attempts where leg 1 confirmed filled; null when no per-leg data yet." }
        leg2FillRate: { type: number, nullable: true, description: "Share of tracked live attempts where legs 1–2 confirmed filled." }
        leg3FillRate: { type: number, nullable: true, description: "Share of tracked live attempts where the FULL 3-leg cycle confirmed filled." }
    ExecutionQualityResult:
      type: object
      required: [routes, totalRecords]
      properties:
        routes:
          type: array
          items: { $ref: "#/components/schemas/ExecutionQualityRoute" }
        totalRecords: { type: integer }
    ExecutionStatusResult:
      type: object
      required: [active, route, leg, legLabel, pair, orderId, attempt, maxAttempts, startedAtMs, timeoutMs, filledPct, phase, elapsedMs, updatedAtMs]
      properties:
        active: { type: boolean }
        route: { type: string, nullable: true }
        leg: { type: integer, nullable: true }
        legLabel: { type: string, nullable: true }
        pair: { type: string, nullable: true }
        orderId: { type: string, nullable: true }
        attempt: { type: integer, nullable: true }
        maxAttempts: { type: integer, nullable: true }
        startedAtMs: { type: number, nullable: true }
        timeoutMs: { type: number, nullable: true }
        filledPct: { type: number, nullable: true }
        phase: { type: string, nullable: true }
        orderPrice: { type: number, nullable: true }
        bestBid: { type: number, nullable: true }
        bestAsk: { type: number, nullable: true }
        queueAheadVol: { type: number, nullable: true }
        reprices: { type: integer, nullable: true }
        elapsedMs: { type: number, nullable: true }
        updatedAtMs: { type: number }
        nonceHealth: { $ref: "#/components/schemas/KrakenNonceHealth" }
    KrakenNonceHealth:
      type: object
      description: >
        Kraken API-key nonce health for THIS server process. Repeated
        "EAPI:Invalid nonce" errors mean another process (e.g. the published
        app and the dev workspace) is using the same Kraken API key — the two
        interleave nonces and share one rate budget. Run the bot from one
        environment at a time or use a separate key per environment.
      required: [concurrentUseSuspected, recentNonceErrors, totalNonceErrors, lastNonceErrorAtMs, hint]
      properties:
        concurrentUseSuspected: { type: boolean }
        recentNonceErrors: { type: integer }
        totalNonceErrors: { type: integer }
        lastNonceErrorAtMs: { type: number, nullable: true }
        hint: { type: string, nullable: true }
    FeeTierResult:
      type: object
      required: [takerFeePct, makerFeePct, source]
      properties:
        takerFeePct: { type: number, nullable: true }
        makerFeePct: { type: number, nullable: true }
        source: { type: string, enum: [account, unavailable] }

    GraphRouteHop:
      type: object
      required: [from, to, exchange, pair, side, amountIn, amountOut, feePct, limitPrice]
      properties:
        from: { type: string }
        to: { type: string }
        exchange: { type: string, enum: [kraken, coinbase, bridge] }
        pair: { type: string }
        side: { type: string, enum: [buy, sell, bridge] }
        amountIn: { type: number }
        amountOut: { type: number }
        feePct: { type: number }
        limitPrice: { type: number }

    GraphRoute:
      type: object
      required: [hops, description, startUsd, grossProfitUsd, feeUsd, netProfitUsd, profitPct, slippagePct, status, executable]
      properties:
        hops:
          type: array
          items: { $ref: "#/components/schemas/GraphRouteHop" }
        description: { type: string }
        startUsd: { type: number }
        grossProfitUsd: { type: number }
        feeUsd: { type: number }
        netProfitUsd: { type: number }
        profitPct: { type: number }
        slippagePct: { type: number }
        status: { type: string, enum: [VIABLE, REJECTED] }
        executable:
          type: boolean
          description: "True when the live executor supports this route shape (Kraken triangle or 2-leg cross-exchange). Unsupported shapes are dry-run only."
        histLiveAttempts:
          type: integer
          description: "Recent live execution attempts recorded for this route+style (max 20 considered)."
        histFillRate:
          type: number
          nullable: true
          description: "Historical live fill rate 0..1; null until the route has ≥10 live attempts (insufficient history to judge)."
        quoteAgeMs:
          type: number
          nullable: true
          description: "Age (ms) of the streamed book snapshot this route's netProfitUsd was priced from; null when stream pricing was unavailable"
        pricedFrom:
          type: string
          nullable: true
          description: "Pricing source for netProfitUsd: 'stream' = executor-grade simulator on live streamed books (matches the pre-fire math exactly); 'graph' = graph engine estimate (stream unavailable)"
        effectiveScoreUsd:
          type: number
          description: "Ranking score: net profit × historical fill rate (0.7 neutral prior when history is insufficient). Approximates expected realized profit."

    GraphScanResult:
      type: object
      required: [routes, tradeSizeUsd, krakenFeesPct, coinbaseFeesPct, executionStyle, assetsScanned, routesEvaluated, scannedAt]
      properties:
        executionStyle: { type: string, enum: [taker, maker] }
        routes:
          type: array
          items: { $ref: "#/components/schemas/GraphRoute" }
        tradeSizeUsd: { type: number }
        krakenFeesPct: { type: number }
        coinbaseFeesPct: { type: number }
        assetsScanned: { type: integer }
        routesEvaluated: { type: integer }
        scannedAt: { type: string, format: date-time }

    InventoryOpportunity:
      type: object
      required: [asset, pair, krakenBid, krakenAsk, coinbaseBid, coinbaseAsk, grossSpreadPct, netSpreadPct, buyExchange, sellExchange, buyPrice, sellPrice, tradeSizeUsd, estimatedNetProfitUsd, meetsThreshold, scannedAt]
      properties:
        asset: { type: string, description: "Asset symbol, e.g. BTC" }
        pair: { type: string, description: "Canonical pair, e.g. BTC/USD" }
        krakenBid: { type: number }
        krakenAsk: { type: number }
        coinbaseBid: { type: number }
        coinbaseAsk: { type: number }
        grossSpreadPct: { type: number, description: "Gross cross-exchange spread %" }
        netSpreadPct: { type: number, description: "Net spread after fees" }
        buyExchange: { type: string }
        sellExchange: { type: string }
        buyPrice: { type: number }
        sellPrice: { type: number }
        tradeSizeUsd: { type: number }
        estimatedNetProfitUsd: { type: number }
        meetsThreshold: { type: boolean, description: "True when gross spread > 2x fees" }
        scannedAt: { type: string }

    InventoryRebalanceAlert:
      type: object
      required: [asset, exchange, krakenPct, coinbasePct, targetPct, alertLevel, message]
      properties:
        asset: { type: string }
        exchange: { type: string }
        krakenPct: { type: number, description: "Current % of total held on Kraken" }
        coinbasePct: { type: number, description: "Current % of total held on Coinbase" }
        targetPct: { type: number, description: "Target % per exchange" }
        alertLevel: { type: string, enum: [info, warning, critical] }
        message: { type: string }

    InventoryScanResult:
      type: object
      required: [opportunities, rebalanceAlerts, scannedAt]
      properties:
        opportunities:
          type: array
          items: { $ref: "#/components/schemas/InventoryOpportunity" }
        rebalanceAlerts:
          type: array
          items: { $ref: "#/components/schemas/InventoryRebalanceAlert" }
        scannedAt: { type: string }

    InventoryExecuteRequest:
      type: object
      required: [krakenKey, krakenSecret, coinbaseKey, coinbaseSecret]
      properties:
        krakenKey: { type: string }
        krakenSecret: { type: string }
        coinbaseKey: { type: string }
        coinbaseSecret: { type: string }
        asset: { type: string, description: "Asset to trade, e.g. BTC", default: "BTC" }
        tradeSizeUsd: { type: number, default: 10 }
        minProfitUsd: { type: number, default: 0.01 }
        krakenFeesPct: { type: number, default: 0.16 }
        coinbaseFeesPct: { type: number, default: 0.40 }
        isDryRun: { type: boolean, default: true }

    InventoryExecuteResult:
      type: object
      required: [success, isDryRun, executed, asset, pair, buyExchange, sellExchange, grossSpreadPct, netSpreadPct, estimatedNetProfitUsd]
      properties:
        success: { type: boolean }
        isDryRun: { type: boolean }
        executed: { type: boolean }
        asset: { type: string }
        pair: { type: string }
        buyExchange: { type: string }
        sellExchange: { type: string }
        volume: { type: number, nullable: true }
        buyPrice: { type: number }
        sellPrice: { type: number }
        grossSpreadPct: { type: number }
        netSpreadPct: { type: number }
        estimatedNetProfitUsd: { type: number }
        realizedProfitUsd: { type: number, nullable: true }
        buyOrderId: { type: string, nullable: true }
        sellOrderId: { type: string, nullable: true }
        error: { type: string, nullable: true }

    GraphExecuteRequest:
      type: object
      required: [krakenKey, krakenSecret]
      properties:
        krakenKey: { type: string }
        krakenSecret: { type: string }
        coinbaseKey: { type: string }
        coinbaseSecret: { type: string }
        routeDescription:
          type: string
          description: Exact route description to execute; omitted = fresh top route
        tradeSizeUsd: { type: number, default: 10 }
        krakenFeesPct: { type: number, default: 0.16 }
        coinbaseFeesPct: { type: number, default: 0.4 }
        minProfitUsd: { type: number, default: 0.02 }
        isDryRun: { type: boolean, default: true }
        executionStyle:
          type: string
          enum: [taker, maker, adaptive]
          default: taker
          description: >
            maker = post-only limits with gated taker fallback. taker = market/IOC
            on all 3 legs, gated by a fresh taker-priced pre-flight (actual taker
            fees + depth-walked slippage + safety buffer must leave net > floor).
            adaptive = choose per fire whichever path has the higher expected
            realized P&L (maker EV uses per-route historical fill probabilities).
        forceMode:
          type: boolean
          default: false
          description: >
            FORCE MODE — skip the fill-rate feedback gate, historical-shortfall
            penalty, and consecutive-failure blacklist entirely. Fresh pre-flight
            profit gates (net profit minus slippage buffer > minProfitUsd) still
            apply; this never authorizes a trade the live re-quote says is unprofitable.
        maxReprices:
          type: number
          default: 4
          description: >
            Max leg-1 maker reprices (cancel + re-place at the freshest
            aggressive maker price, pre-flight re-run each time) before the
            route is abandoned so execution falls through to the next-best one.
        makerTimeoutMs:
          type: number
          description: >
            Per-leg maker fill window in ms (clamped 1000–30000 server-side).
            Lower = faster taker fallback; default derives from maxReprices.
        partialFillTolerancePct:
          type: number
          description: >
            Partial-fill acceptance in percent (server clamps to 50–100;
            default 99.9). A leg filled to at least this fraction counts as
            complete — the cycle proceeds sized to the actual fill and any
            residual inventory is swept back to USD at market instead of the
            whole cycle unwinding.
        alwaysTakerFallback:
          type: boolean
          default: false
          description: >
            Trader-directed — when the leg-1 maker order doesn't fill in its
            window, fire the taker fallback immediately WITHOUT the
            taker-priced profit-floor gate. A decayed edge will execute at the
            fresh taker price, possibly at a loss. Still requires a readable
            fresh order book.
        maxQuoteAgeMs:
          type: number
          default: 200
          description: >
            Micro-check freshness threshold (ms, clamped 50–5000): the cached
            in-memory book snapshot used for the adaptive pre-fire decision
            must be at most this old, otherwise the fire is SKIPPED (stale
            data never executes blind).

    RouteHistoryClearResult:
      type: object
      required: [clearedRoutes]
      properties:
        clearedRoutes:
          type: number
          description: Route streak/blacklist entries removed

    ExecLockClearRequest:
      type: object
      required: [krakenKey, krakenSecret]
      properties:
        krakenKey: { type: string }
        krakenSecret: { type: string }
        cancelOrders:
          type: boolean
          description: Also cancel ALL open Kraken orders (kill switch).

    ExecLockClearResult:
      type: object
      required: [cleared, wasHeld]
      properties:
        cleared: { type: boolean }
        wasHeld:
          type: boolean
          description: True when a live execution was actually holding the lock
        cancelledOrders:
          type: number
          description: Open Kraken orders cancelled (when cancelOrders was set)

    GraphExecuteResult:
      type: object
      required: [success, isDryRun, executed, route]
      properties:
        success: { type: boolean }
        isDryRun: { type: boolean }
        executed: { type: boolean }
        route: { type: string }
        preflightProfitUsd: { type: number, nullable: true }
        realizedProfitUsd:
          type: number
          nullable: true
          description: "Actual USD profit from confirmed fills (cost/fee accounting); null when unknown"
        orderIds:
          type: array
          items: { type: string }
          nullable: true
        error: { type: string, nullable: true }
        chosenMode:
          type: string
          nullable: true
          description: "Execution path actually used for this fire: maker or taker (set when executionStyle=adaptive or taker)"
        latency:
          type: object
          nullable: true
          description: "Execution pipeline latency breakdown (ms): market update → decision → order submitted → exchange acknowledgement"
          properties:
            quoteAgeMs: { type: number, nullable: true, description: "Age of the cached book snapshot when the decision was made" }
            marketToDecisionMs: { type: number, nullable: true, description: "Last relevant book update → all gates passed" }
            requestToDecisionMs: { type: number, nullable: true, description: "Execute request received → decision" }
            decisionToSubmitMs: { type: number, nullable: true, description: "Decision → first order request sent to Kraken" }
            submitToAckMs: { type: number, nullable: true, description: "Order sent → Kraken acknowledgement (accept or reject)" }
            totalMs: { type: number, nullable: true, description: "Market update → exchange acknowledgement" }

    ExecPreviewRequest:
      type: object
      required: [routeDescription]
      properties:
        routeDescription: { type: string, description: "Kraken triangle route, e.g. USD[K]→ETH[K]→BCH[K]→USD[K]" }
        tradeSizeUsd: { type: number, default: 10 }
        minProfitUsd: { type: number, default: 0, description: "Trader's profit floor — adaptiveChoice mirrors the live decision against this floor" }
        krakenKey: { type: string, description: "Optional — used only to fetch the account's real fee tiers" }
        krakenSecret: { type: string }
        executionStyle: { type: string, enum: [taker, maker, adaptive], default: adaptive }

    ExecPreviewResult:
      type: object
      required: [route, ok]
      properties:
        route: { type: string }
        ok: { type: boolean, description: "False when books couldn't be fetched or the route isn't a Kraken triangle" }
        rawEdgeUsd: { type: number, nullable: true, description: "Gross edge at top-of-book taker prices, before fees and slippage" }
        takerFeesUsd: { type: number, nullable: true, description: "Total taker fees across all 3 legs at the actual (or assumed) tier" }
        takerFeePct: { type: number, nullable: true, description: "Per-leg taker fee percent used" }
        slippageUsd: { type: number, nullable: true, description: "Depth-walk cost: top-of-book edge minus executable VWAP edge for this size" }
        safetyBufferUsd: { type: number, nullable: true, description: "Extra buffer subtracted before the floor comparison" }
        netEdgeUsd: { type: number, nullable: true, description: "Final executable net edge = raw − slippage − fees − buffer" }
        expectedProfitUsd: { type: number, nullable: true, description: "Expected dollar profit if fired as taker (net of fees+slippage, before buffer)" }
        makerNetUsd: { type: number, nullable: true, description: "Maker-priced net edge (post-only joins, maker fees, zero slippage)" }
        makerEvUsd: { type: number, nullable: true, description: "Maker expected realized P&L = maker net × historical full-cycle fill probability − expected unwind cost" }
        makerFillProbability: { type: number, nullable: true, description: "Historical full-cycle fill probability used in the maker EV (0-1); conservative default when history is thin" }
        adaptiveChoice: { type: string, nullable: true, description: "Which path adaptive mode would fire right now: taker (fresh taker net ≥ floor), maker (maker expected realized ≥ floor), or skip" }
        quoteAgeMs: { type: number, nullable: true, description: "Age (ms) of the streamed book snapshot this preview was computed from; null when REST books were used" }
        asOf: { type: string, nullable: true, description: "ISO timestamp of the snapshot used for this preview (scanner timestamp)" }
        error: { type: string, nullable: true }

    ObExecuteResult:
      type: object
      required: [success, isDryRun, executed, route]
      properties:
        success:
          type: boolean
        isDryRun:
          type: boolean
        executed:
          type: boolean
          description: "True when orders were placed (or dry-run recorded); false when pre-flight rejected"
        route:
          type: string
        preflightProfitUsd:
          type: ["number", "null"]
          description: "Fresh pre-flight net profit ($); null when books couldn't be fetched"
        leg1OrderId:
          type: ["string", "null"]
        leg2OrderId:
          type: ["string", "null"]
        leg3OrderId:
          type: ["string", "null"]
        error:
          type: ["string", "null"]

    TriExecuteRequest:
      type: object
      required: [krakenKey, krakenSecret, loop]
      properties:
        krakenKey:
          type: string
        krakenSecret:
          type: string
        loop:
          type: string
          description: "USD→BTC→SOL→USD or USD→SOL→BTC→USD"
        tradeUsd:
          type: number
          description: "Override trade size in USD. Auto-sized when omitted."
        isDryRun:
          type: boolean
          default: false
        orderType:
          type: string
          enum: [market, limit]
          default: market
          description: "market = force/dry-run (taker); limit = auto-loop (post-only maker)"

    TriExecuteResult:
      type: object
      required: [success, isDryRun, estimatedProfitUsd]
      properties:
        success:
          type: boolean
        isDryRun:
          type: boolean
        estimatedProfitUsd:
          type: number
        leg1OrderId:
          type: ["string", "null"]
        leg2OrderId:
          type: ["string", "null"]
        leg3OrderId:
          type: ["string", "null"]
        error:
          type: ["string", "null"]
        priceSource:
          type: string
          enum: [direct, synthetic]
          description: >
            "direct" = live ETHSOL WS market was used for leg 2;
            "synthetic" = ETH/USD ÷ SOL/USD cross rate was used.
            Only present for ETH loops; absent for BTC loops.
        synthetic:
          type: boolean
          description: >
            True when the ETH/SOL leg used a synthetic cross rate instead of the
            direct ETHSOL order-book market. Live execution is blocked when true.

    TriangularOpportunity:
      type: object
      required: [exchange, loop, profitPct, solUsd, ethUsd, ethSol, timestamp]
      properties:
        exchange:
          type: string
          description: "Exchange where the loop was detected (e.g. Kraken)"
        loop:
          type: string
          description: "Loop direction, e.g. USD→SOL→ETH→USD"
        profitPct:
          type: number
          description: "Net profit percentage after fees"
        solUsd:
          type: number
          description: "SOL/USD mid price used"
        ethUsd:
          type: number
          description: "ETH/USD or BTC/USD mid price used (see variant)"
        ethSol:
          type: number
          description: "ETH/SOL or SOL/BTC mid price used (see variant)"
        variant:
          type: string
          description: "'eth' for ETH/SOL loops, 'btc' for BTC/SOL loops (v13)"
        timestamp:
          type: string

    TriangularScanResult:
      type: object
      required: [opportunities, prices, scannedAt]
      properties:
        opportunities:
          type: array
          items:
            $ref: "#/components/schemas/TriangularOpportunity"
        prices:
          type: object
          description: "Raw prices used in this scan"
          required: []
          additionalProperties: true
        priceSource:
          type: object
          description: "Price source per exchange: 'direct' if live ETH/SOL market data is available, 'synthetic' if cross-rate is used"
          additionalProperties:
            type: string
            enum: [direct, synthetic]
        scannedAt:
          type: string

    TradeSummary:
      type: object
      required: [totalTrades, liveTrades, dryRunTrades, totalProfitUsd, avgNetEdgePct, bestTradeProfitUsd, recentTrades]
      properties:
        totalTrades:
          type: integer
        liveTrades:
          type: integer
        dryRunTrades:
          type: integer
        totalProfitUsd:
          type: number
        avgNetEdgePct:
          type: number
        bestTradeProfitUsd:
          type: number
        verifiedTrades:
          type: integer
          description: Rows where every leg has confirmed exchange fill data + order IDs.
        failedTrades:
          type: integer
          description: Live attempts that did not complete (incl. unwinds).
        simulatedTrades:
          type: integer
          description: Dry runs, scanner estimates, and legacy rows without fill proof.
        realizedPnlUsd:
          type: number
          description: SUM of realizedProfitUsd over VERIFIED rows only — real money, never estimates.
        bestVerifiedProfitUsd:
          type: ["number", "null"]
        recentTrades:
          type: array
          items:
            $ref: "#/components/schemas/TradeRecord"
