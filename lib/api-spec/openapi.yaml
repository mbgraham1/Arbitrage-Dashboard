            properties:
              at: { type: string }
              kind: { type: string }
              detail: { type: string }
    DiscoveryRequest:
      type: object
      description: Optional Kraken/Coinbase credentials for real fees + inventory; optional Gemini credentials for detected Gemini fees + balance-verified (read-only) candidate status
      properties:
        krakenKey: { type: string }
        krakenSecret: { type: string }
        coinbaseKey: { type: string }
        coinbaseSecret: { type: string }
        geminiKey: { type: string }
        geminiSecret: { type: string }
    DiscoverySizeNet:
      type: object
      properties:
        sizeUsd: { type: number }
        grossEdgeUsd: { type: number, nullable: true }
        feesUsd: { type: number, nullable: true }
        slippageUsd: { type: number, nullable: true }
        basisHaircutUsd: { type: number, nullable: true }
        netUsd: { type: number, nullable: true }
    DiscoveryRow:
      type: object
      properties:
        asset: { type: string }
        buyVenue: { type: string }
        sellVenue: { type: string }
        quoteNote: { type: string }
        buyTakerPct: { type: number }
        sellTakerPct: { type: number }
        feeSource: { type: string, description: "detected | assumed | mixed" }
        nets:
          type: array
          items: { $ref: "#/components/schemas/DiscoverySizeNet" }
        net10: { type: number, nullable: true }
        structure: { type: string, description: "taker-taker | cb-maker-hedge | kraken-maker-hedge" }
        bestSizeUsd: { type: number, nullable: true, description: "size from the sweep where net peaks — projection only; live execution stays $10-capped" }
        bestNetUsd: { type: number, nullable: true }
        costsAtBest:
          type: object
          nullable: true
          properties:
            feesUsd: { type: number }
            slippageUsd: { type: number }
            basisHaircutUsd: { type: number }
            bufferUsd: { type: number }
        blockedBy: { type: string, description: "NONE | NO_EDGE | BLOCKED_BY_FEES | INSUFFICIENT_INVENTORY | NEEDS_KEYS | NEEDS_ACCOUNT | REGION_UNAVAILABLE" }
        regionUnavailable: { type: boolean, description: "a leg is on a venue unavailable in the user's region — market context only, never actionable" }
        entryTierMakerNet10: { type: number, nullable: true, description: "for candidate venues (Gemini/Crypto.com): $10 net IF candidate legs paid published entry-tier MAKER fees — assumption analysis, never executable" }
        geminiFunded: { type: boolean, nullable: true, description: "for Gemini routes with keys connected: the Gemini-side balance covers the $10 leg (read-only — still NOT executable from this app)" }
        category: { type: string, description: "executable_now | requires_setup | not_profitable" }
        requirement: { type: string }
