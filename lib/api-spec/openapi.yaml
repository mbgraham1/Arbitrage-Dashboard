      properties:
        asset: { type: string, description: "Asset symbol, e.g. BTC" }
        pair: { type: string, description: "Canonical pair, e.g. BTC/USD" }
        krakenBid: { type: number }
        krakenAsk: { type: number }
        coinbaseBid: { type: number }
        coinbaseAsk: { type: number }
        grossSpreadPct: { type: number, description: "Gross cross-exchange spread %" }
        netSpreadPct: { type: number, description: "Net spread after fees" }
        buyExchange: { type: string }
        sellExchange: { type: string }
        buyPrice: { type: number }
        sellPrice: { type: number }
        tradeSizeUsd: { type: number }
