    InventoryScanResult:
      type: object
      required: [opportunities, rebalanceAlerts, scannedAt]
      properties:
        opportunities:
          type: array
          items: { $ref: "#/components/schemas/InventoryOpportunity" }
        rebalanceAlerts:
          type: array
          items: { $ref: "#/components/schemas/InventoryRebalanceAlert" }
        scannedAt: { type: string }

    InventoryExecuteRequest:
      type: object
      required: [krakenKey, krakenSecret, coinbaseKey, coinbaseSecret]
      properties:
        krakenKey: { type: string }
        krakenSecret: { type: string }
        coinbaseKey: { type: string }
        coinbaseSecret: { type: string }
        asset: { type: string, description: "Asset to trade, e.g. BTC", default: "BTC" }
        tradeSizeUsd: { type: number, default: 10 }
        minProfitUsd: { type: number, default: 0.01 }
        krakenFeesPct: { type: number, default: 0.16 }
        coinbaseFeesPct: { type: number, default: 0.40 }
        isDryRun: { type: boolean, default: true }

    InventoryExecuteResult:
      type: object
      required: [success, isDryRun, executed, asset, pair, buyExchange, sellExchange, grossSpreadPct, netSpreadPct, estimatedNetProfitUsd]
      properties:
        success: { type: boolean }
        isDryRun: { type: boolean }
        executed: { type: boolean }
        asset: { type: string }
        pair: { type: string }
        buyExchange: { type: string }
        sellExchange: { type: string }
        volume: { type: number, nullable: true }
        buyPrice: { type: number }
        sellPrice: { type: number }
        grossSpreadPct: { type: number }
        netSpreadPct: { type: number }
        estimatedNetProfitUsd: { type: number }
        realizedProfitUsd: { type: number, nullable: true }
        buyOrderId: { type: string, nullable: true }
        sellOrderId: { type: string, nullable: true }
        error: { type: string, nullable: true }

    GraphExecuteRequest:
      type: object
      required: [krakenKey, krakenSecret]
      properties:
        krakenKey: { type: string }
        krakenSecret: { type: string }
        coinbaseKey: { type: string }
        coinbaseSecret: { type: string }
        routeDescription:
          type: string
          description: Exact route description to execute; omitted = fresh top route
        tradeSizeUsd: { type: number, default: 10 }
        krakenFeesPct: { type: number, default: 0.16 }
        coinbaseFeesPct: { type: number, default: 0.4 }
        minProfitUsd: { type: number, default: 0.02 }
        isDryRun: { type: boolean, default: true }
        executionStyle:
          type: string
          enum: [taker, maker, adaptive]
          default: taker
          description: >
            maker = post-only limits with gated taker fallback. taker = market/IOC
            on all 3 legs, gated by a fresh taker-priced pre-flight (actual taker
            fees + depth-walked slippage + safety buffer must leave net > floor).
            adaptive = choose per fire whichever path has the higher expected
            realized P&L (maker EV uses per-route historical fill probabilities).
        forceMode:
          type: boolean
          default: false
          description: >
            FORCE MODE — skip the fill-rate feedback gate, historical-shortfall
            penalty, and consecutive-failure blacklist entirely. Fresh pre-flight
            profit gates (net profit minus slippage buffer > minProfitUsd) still
            apply; this never authorizes a trade the live re-quote says is unprofitable.
            Requires valid Kraken credentials (operator proof, verified up front) —
            rejected with 403 otherwise.
        maxReprices:
          type: number
          default: 4
          description: >
            Max leg-1 maker reprices (cancel + re-place at the freshest
            aggressive maker price, pre-flight re-run each time) before the
            route is abandoned so execution falls through to the next-best one.
        makerTimeoutMs:
          type: number
          description: >
            Per-leg maker fill window in ms (clamped 1000–30000 server-side).
            Lower = faster taker fallback; default derives from maxReprices.
        leg1RestMs:
          type: number
          description: >
            Total leg-1 maker rest window in ms (server clamps to 5000–120000).
            Overrides the derived/makerTimeoutMs rest window for leg 1 only.
        edgeCheckMs:
          type: number
          description: >
            Leg-1 edge re-check / reprice interval in ms while the maker order
            rests (server clamps to 500–30000; default 2500).
        partialFillTolerancePct:
          type: number
          description: >
            Partial-fill acceptance in percent (server clamps to 50–100;
            default 99.9). A leg filled to at least this fraction counts as
            complete — the cycle proceeds sized to the actual fill and any
            residual inventory is swept back to USD at market instead of the
            whole cycle unwinding.
        alwaysTakerFallback:
          type: boolean
          default: false
          description: >
            Trader-directed — when the leg-1 maker order doesn't fill in its
            window, fire the taker fallback immediately WITHOUT the
            taker-priced profit-floor gate. A decayed edge will execute at the
            fresh taker price, possibly at a loss. Still requires a readable
            fresh order book.
        maxQuoteAgeMs:
          type: number
          default: 200
          description: >
            Micro-check freshness threshold (ms, clamped 50–5000): the cached
            in-memory book snapshot used for the adaptive pre-fire decision
            must be at most this old, otherwise the fire is SKIPPED (stale
            data never executes blind).

    VerifyLegacyTradesRequest:
      type: object
      required: [krakenKey, krakenSecret]
      properties:
        krakenKey:
          type: string
          description: Kraken API key — operator proof + order-history access
        krakenSecret:
          type: string
          description: Kraken API secret — operator proof + order-history access
        dryRun:
          type: boolean
          description: When true, report what would be verified without writing

    VerifyLegacyTradesResult:
      type: object
      required: [dryRun, scanned, candidates, verified, skipped, details]
      properties:
        dryRun: { type: boolean }
        scanned:
          type: integer
          description: Estimated live rows examined
        candidates:
          type: integer
          description: Rows with two Kraken order IDs eligible for proof
        verified:
          type: integer
          description: Rows upgraded to verified (or that would be, on dryRun)
        skipped:
          type: integer
          description: Rows left as estimated
        details:
          type: array
          items:
            type: object
            required: [id, outcome]
            properties:
              id: { type: integer }
              outcome: { type: string, enum: [verified, skipped] }
              reason: { type: string }
              realizedProfitUsd: { type: number }

    RouteHistoryClearRequest:
      type: object
      required: [krakenKey, krakenSecret]
      properties:
        krakenKey:
          type: string
          description: Kraken API key — operator proof of account ownership
        krakenSecret:
          type: string
          description: Kraken API secret — operator proof of account ownership

    RouteHistoryClearResult:
      type: object
      required: [clearedRoutes]
      properties:
        clearedRoutes:
          type: number
          description: Route streak/blacklist entries removed

    ExecLockClearRequest:
      type: object
      required: [krakenKey, krakenSecret]
      properties:
        krakenKey: { type: string }
        krakenSecret: { type: string }
        cancelOrders:
          type: boolean
          description: Also cancel ALL open Kraken orders (kill switch).

    ExecLockClearResult:
      type: object
      required: [cleared, wasHeld]
      properties:
        cleared: { type: boolean }
        wasHeld:
          type: boolean
          description: True when a live execution was actually holding the lock
        cancelledOrders:
          type: number
          description: Open Kraken orders cancelled (when cancelOrders was set)

    GraphExecuteResult:
      type: object
      required: [success, isDryRun, executed, route]
      properties:
        success: { type: boolean }
        isDryRun: { type: boolean }
        executed: { type: boolean }
        route: { type: string }
        preflightProfitUsd: { type: number, nullable: true }
        realizedProfitUsd:
          type: number
          nullable: true
          description: "Actual USD profit from confirmed fills (cost/fee accounting); null when unknown"
        orderIds:
          type: array
          items: { type: string }
          nullable: true
        error: { type: string, nullable: true }
        chosenMode:
          type: string
          nullable: true
          description: "Execution path actually used for this fire: maker or taker (set when executionStyle=adaptive or taker)"
        latency:
          type: object
          nullable: true
          description: "Execution pipeline latency breakdown (ms): market update → decision → order submitted → exchange acknowledgement"
          properties:
            quoteAgeMs: { type: number, nullable: true, description: "Age of the cached book snapshot when the decision was made" }
            marketToDecisionMs: { type: number, nullable: true, description: "Last relevant book update → all gates passed" }
            requestToDecisionMs: { type: number, nullable: true, description: "Execute request received → decision" }
            decisionToSubmitMs: { type: number, nullable: true, description: "Decision → first order request sent to Kraken" }
            submitToAckMs: { type: number, nullable: true, description: "Order sent → Kraken acknowledgement (accept or reject)" }
            totalMs: { type: number, nullable: true, description: "Market update → exchange acknowledgement" }

    ExecPreviewRequest:
      type: object
      required: [routeDescription]
      properties:
        routeDescription: { type: string, description: "Kraken triangle route, e.g. USD[K]→ETH[K]→BCH[K]→USD[K]" }
        tradeSizeUsd: { type: number, default: 10 }
        minProfitUsd: { type: number, default: 0, description: "Trader's profit floor — adaptiveChoice mirrors the live decision against this floor" }
        krakenKey: { type: string, description: "Optional — used only to fetch the account's real fee tiers" }
        krakenSecret: { type: string }
        executionStyle: { type: string, enum: [taker, maker, adaptive], default: adaptive }

    ExecPreviewResult:
      type: object
      required: [route, ok]
      properties:
        route: { type: string }
        ok: { type: boolean, description: "False when books couldn't be fetched or the route isn't a Kraken triangle" }
        rawEdgeUsd: { type: number, nullable: true, description: "Gross edge at top-of-book taker prices, before fees and slippage" }
        takerFeesUsd: { type: number, nullable: true, description: "Total taker fees across all 3 legs at the actual (or assumed) tier" }
        takerFeePct: { type: number, nullable: true, description: "Per-leg taker fee percent used" }
        slippageUsd: { type: number, nullable: true, description: "Depth-walk cost: top-of-book edge minus executable VWAP edge for this size" }
        safetyBufferUsd: { type: number, nullable: true, description: "Extra buffer subtracted before the floor comparison" }
        netEdgeUsd: { type: number, nullable: true, description: "Final executable net edge = raw − slippage − fees − buffer" }
        expectedProfitUsd: { type: number, nullable: true, description: "Expected dollar profit if fired as taker (net of fees+slippage, before buffer)" }
        makerNetUsd: { type: number, nullable: true, description: "Maker-priced net edge (post-only joins, maker fees, zero slippage)" }
        makerEvUsd: { type: number, nullable: true, description: "Maker expected realized P&L = maker net × historical full-cycle fill probability − expected unwind cost" }
        makerFillProbability: { type: number, nullable: true, description: "Historical full-cycle fill probability used in the maker EV (0-1); conservative default when history is thin" }
        adaptiveChoice: { type: string, nullable: true, description: "Which path adaptive mode would fire right now: taker (fresh taker net ≥ floor), maker (maker expected realized ≥ floor), or skip" }
        quoteAgeMs: { type: number, nullable: true, description: "Age (ms) of the streamed book snapshot this preview was computed from; null when REST books were used" }
        asOf: { type: string, nullable: true, description: "ISO timestamp of the snapshot used for this preview (scanner timestamp)" }
        error: { type: string, nullable: true }

    ObExecuteResult:
      type: object
      required: [success, isDryRun, executed, route]
      properties:
        success:
          type: boolean
        isDryRun:
          type: boolean
        executed:
          type: boolean
          description: "True when orders were placed (or dry-run recorded); false when pre-flight rejected"
        route:
          type: string
        preflightProfitUsd:
          type: ["number", "null"]
          description: "Fresh pre-flight net profit ($); null when books couldn't be fetched"
        leg1OrderId:
          type: ["string", "null"]
        leg2OrderId:
          type: ["string", "null"]
        leg3OrderId:
          type: ["string", "null"]
        leg4OrderId:
          type: ["string", "null"]
          description: "v21 — final-leg order id for 4-leg routes (null on triangles)"
        error:
          type: ["string", "null"]

    TriExecuteRequest:
      type: object
      required: [krakenKey, krakenSecret, loop]
      properties:
        krakenKey:
          type: string
        krakenSecret:
          type: string
        loop:
          type: string
          description: "USD→BTC→SOL→USD or USD→SOL→BTC→USD"
        tradeUsd:
          type: number
          description: "Override trade size in USD. Auto-sized when omitted."
        isDryRun:
          type: boolean
          default: false
        orderType:
          type: string
          enum: [market, limit]
          default: market
          description: "market = force/dry-run (taker); limit = auto-loop (post-only maker)"

    TriExecuteResult:
      type: object
      required: [success, isDryRun, estimatedProfitUsd]
      properties:
        success:
          type: boolean
        isDryRun:
          type: boolean
        estimatedProfitUsd:
          type: ["number", "null"]
          description: >
            Estimated (dry-run) or expected net profit in USD. Null when the
            request is rejected before an estimate is computed, e.g. live ETH
            loops blocked because the ETH/SOL rate is synthetic.
        tradeUsd:
          type: ["number", "null"]
          description: >
            Actual USD trade size used for the loop — $10 for dry/force runs,
            20% of USD balance capped at $50 for the auto-loop. Null when the
            request is rejected before the size is determined. Lets the client
            compute thin-edge warnings against the real executed size.
        leg1OrderId:
          type: ["string", "null"]
        leg2OrderId:
          type: ["string", "null"]
        leg3OrderId:
          type: ["string", "null"]
        error:
          type: ["string", "null"]
        priceSource:
          type: string
          enum: [direct, synthetic]
          description: >
            "direct" = live ETHSOL WS market was used for leg 2;
            "synthetic" = ETH/USD ÷ SOL/USD cross rate was used.
            Only present for ETH loops; absent for BTC loops.
        synthetic:
          type: boolean
          description: >
            True when the ETH/SOL leg used a synthetic cross rate instead of the
            direct ETHSOL order-book market. Live execution is blocked when true.

    TriangularOpportunity:
      type: object
      required: [exchange, loop, profitPct, solUsd, ethUsd, ethSol, timestamp]
      properties:
        exchange:
          type: string
          description: "Exchange where the loop was detected (e.g. Kraken)"
        loop:
          type: string
          description: "Loop direction, e.g. USD→SOL→ETH→USD"
        profitPct:
          type: number
          description: "Net profit percentage after fees"
        solUsd:
          type: number
          description: "SOL/USD mid price used"
        ethUsd:
          type: number
          description: "ETH/USD or BTC/USD mid price used (see variant)"
        ethSol:
          type: number
          description: "ETH/SOL or SOL/BTC mid price used (see variant)"
        variant:
          type: string
          description: "'eth' for ETH/SOL loops, 'btc' for BTC/SOL loops (v13)"
        timestamp:
          type: string

    TriangularScanResult:
      type: object
      required: [opportunities, prices, scannedAt]
      properties:
        opportunities:
          type: array
          items:
            $ref: "#/components/schemas/TriangularOpportunity"
        prices:
          type: object
          description: "Raw prices used in this scan"
          required: []
          additionalProperties: true
        priceSource:
          type: object
          description: "Price source per exchange: 'direct' if live ETH/SOL market data is available, 'synthetic' if cross-rate is used"
          additionalProperties:
            type: string
            enum: [direct, synthetic]
        btcTriStatus:
          type: object
          description: "Availability of Kraken BTC triangular loops. available=false only when the SOL/BTC (SOLXBT) market is confirmed unlisted on Kraken; reason carries the trader-facing explanation."
          required: [available]
          properties:
            available:
              type: boolean
            reason:
              type: string
              nullable: true
        ethSolCrossCheck:
          type: object
          nullable: true
          description: "Advisory ETH/SOL cross-rate sanity check. Present only when both Kraken and Coinbase tri prices are available: compares each venue's ETH/SOL mid (Kraken direct or synthetic; Coinbase synthetic). warning=true when deviation exceeds thresholdBps (25 bp) — a sign one venue's feed is stale or mid-flash-move and its triangular edges are unreliable. Never blocks execution."
          required: [deviationBps, warning, thresholdBps]
          properties:
            deviationBps:
              type: number
              description: "Absolute deviation between the two venues' ETH/SOL mids, in basis points of their average"
            warning:
              type: boolean
            thresholdBps:
              type: number
        scannedAt:
          type: string

    TradeSummary:
      type: object
      required: [totalTrades, liveTrades, dryRunTrades, totalProfitUsd, avgNetEdgePct, bestTradeProfitUsd, recentTrades]
      properties:
        totalTrades:
          type: integer
        liveTrades:
          type: integer
        dryRunTrades:
          type: integer
        totalProfitUsd:
          type: number
        avgNetEdgePct:
          type: number
        bestTradeProfitUsd:
          type: number
        verifiedTrades:
          type: integer
          description: Rows where every leg has confirmed exchange fill data + order IDs AND a non-null realized P&L (excludes indeterminate/partial rows).
        failedTrades:
          type: integer
          description: Live attempts that did not complete (incl. unwinds).
        simulatedTrades:
          type: integer
          description: Dry runs, scanner estimates, and legacy rows without fill proof.
        realizedPnlUsd:
          type: number
          description: SUM of realizedProfitUsd over VERIFIED rows with a non-null realized figure only — real money, never estimates/dry runs.
        liveCompletedCycles:
          type: integer
          description: Count of live (isDryRun=false), fully-completed, verified-fill cycles across ALL strategies (triangles, graph-cross, INV, MM2, XV, 2X/2XTEST).
        liveRealizedPnlUsd:
          type: number
          description: SUM of realizedProfitUsd over live verified fills only (isDryRun=false, status=verified, realized non-null).
        bestVerifiedProfitUsd:
          type: ["number", "null"]
        recentTrades:
          type: array
          items:
            $ref: "#/components/schemas/TradeRecord"
