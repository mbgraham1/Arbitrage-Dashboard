openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: CAT Arbitrage Dashboard API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: exchange
    description: Exchange price and balance operations
  - name: trades
    description: Trade execution and history
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /prices:
    post:
      operationId: fetchPrices
      tags: [exchange]
      summary: Fetch live prices from both exchanges
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeCredentials"
      responses:
        "200":
          description: Current prices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceData"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Exchange fetch error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /balances:
    post:
      operationId: fetchBalances
      tags: [exchange]
      summary: Fetch balances from both exchanges
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeCredentials"
      responses:
        "200":
          description: Current balances
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceData"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Exchange fetch error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /credentials/preloaded:
    get:
      operationId: getPreloadedCredentials
      tags: [exchange]
      summary: Read API credentials from server environment variables (Replit Secrets)
      responses:
        "200":
          description: Credentials loaded from env vars (empty string if not set)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreloadedCredentials"

  /test-kraken:
    post:
      operationId: testKraken
      tags: [exchange]
      summary: Test Kraken connection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KrakenCredentials"
      responses:
        "200":
          description: Connection test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionTestResult"
        "400":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /test-coinbase:
    post:
      operationId: testCoinbase
      tags: [exchange]
      summary: Test Coinbase connection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoinbaseCredentials"
      responses:
        "200":
          description: Connection test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionTestResult"
        "400":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /test-gemini:
    post:
      operationId: testGemini
      tags: [exchange]
      summary: Test Gemini connection (read-only — balances + detected fee tier; live Gemini trading is never enabled)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeminiCredentials"
      responses:
        "200":
          description: Connection test result with detected fee tier and balances
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiTestResult"
        "400":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /execute-trade:
    post:
      operationId: executeTrade
      tags: [trades]
      summary: Execute an arbitrage trade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradeRequest"
      responses:
        "200":
          description: Trade result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Trade execution error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /trades:
    get:
      operationId: listTrades
      tags: [trades]
      summary: Get trade history
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Trade history page with total row count (atomic with the page)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeListResult"

  /prices/all-pairs:
    get:
      operationId: getAllPairSnapshots
      tags: [exchange]
      summary: Return cached bid/ask for all 10 pairs without REST fallbacks
      description: >
        Reads the in-memory price cache for all 10 configured pairs and returns
        every pair — including those with stale or missing data. Kraken and
        Coinbase bid/ask fields are null when no fresh data is available (> 30 s
        old), allowing the UI to render a "—" placeholder. Sorted by gross spread
        descending; no-data pairs go last.
      parameters:
        - name: enabledPairs
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            items: { type: string }
          description: "Optional allow-list of pair symbols to include (comma-separated). Returns all pairs when omitted."
      responses:
        "200":
          description: Snapshot for all 10 pairs (some fields may be null when data is stale)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AllPairSnapshot"

  /arb/scan:
    get:
      operationId: scanAllPairs
      tags: [exchange]
      summary: Scan all 10 pairs and rank by cross-exchange gross spread
      description: >
        Port of Python scan_all_coins(). Fetches bid/ask for all 10 configured
        pairs from Kraken and Coinbase and returns them sorted by gross spread
        (best direction per pair) descending. Net edge = grossSpreadPct minus
        the client's fee + slippage settings.
      parameters:
        - name: enabledPairs
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            items: { type: string }
          description: "Optional allow-list of pair symbols to scan (comma-separated). Scans all pairs when omitted."
      responses:
        "200":
          description: All pairs ranked by gross spread descending
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PairScanEntry"
        "500":
          description: Price fetch error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /arb/cointegration:
    get:
      operationId: scanCointegrationArb
      tags: [exchange]
      summary: Run Kalman-filter cointegration scan and return mean-reversion signals
      description: >
        Fetches mid-prices for SOL, ETH, BTC, AVAX, and DOT from the in-memory
        cache, updates each pair's Kalman-filter spread history, and returns any
        pairs whose |z-score| ≥ 2.0. Returns an empty signals array when
        observations are insufficient or no pair is out-of-range.
      responses:
        "200":
          description: Cointegration scan result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CointegrationScanResult"
        "500":
          description: Scan error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /arb/triangular:
    get:
      operationId: scanTriangularArb
      tags: [exchange]
      summary: Scan for triangular arbitrage opportunities within each exchange
      description: >
        Checks USDT→SOL→ETH→USDT and USDT→ETH→SOL→USDT loops on Kraken and
        Coinbase using live bid/ask prices. Returns opportunities where the
        loop product after fees exceeds the 0.1% profit threshold.
      responses:
        "200":
          description: Triangular arbitrage scan results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriangularScanResult"
        "500":
          description: Price fetch error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /arb/ob-scan:
    get:
      operationId: getObScan
      tags: [arb]
      summary: Scan triangular cycles across 34 assets using L2 order book depth (v18 port)
      description: >
        Port of Python v18 "Scaling Analyzer" (v17 wide-net scan plus a scaling
        table — the top-ranked route is re-simulated at $10/$50/$100/$500/$1,000
        with VIABLE / HIGH_SLIPPAGE / REJECTED statuses; the min-profit threshold
        scales with size/10). Fetches Kraken Depth API for all
        required pairs in parallel, then walks the book for each A→B permutation
        of 34 assets (only routes with a real Kraken cross pair
        are simulatable) to compute realistic fill prices at the given trade size.
        An optional volatility filter restricts the scan to assets that moved more
        than 1.5% in 24h (falls back to all assets when fewer than 3 qualify).
        All simulatable cycles (top 15) are returned ranked by estimated net
        profit, each with total execution slippage, a liquidity confidence score,
        and a READY / HIGH_SLIPPAGE / LOW_PROFIT status classification.
      parameters:
        - name: tradeSizeUsd
          in: query
          description: Simulated trade size in USD (default 10)
          schema: {type: number, default: 10}
        - name: feesPct
          in: query
          description: Estimated total fees % (default 0.5 — 3 legs × 0.16% maker)
          schema: {type: number, default: 0.5}
        - name: minProfitUsd
          in: query
          description: Minimum net profit ($) required for READY status at $10 (default 0.02 — v18; scaled by size/10 in the scaling table)
          schema: {type: number, default: 0.02}
        - name: maxSlippagePct
          in: query
          description: Maximum tolerated total slippage (%) for READY status (default 0.5)
          schema: {type: number, default: 0.5}
        - name: volatilityFilter
          in: query
          description: v17 — scan only assets with |24h change| > 1.5% (default true; falls back to all assets when fewer than 3 qualify)
          schema: {type: boolean, default: true}
        - name: maxLegs
          in: query
          description: v20 — 3 scans triangles only; 4 (default) also simulates 4-leg routes through the BTC/ETH cross (USD→A→BTC→ETH→USD and USD→A→ETH→BTC→USD)
          schema: {type: number, enum: [3, 4], default: 4}
      responses:
        "200":
          description: Ranked cycle list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObScanResult"
        "500":
          description: Scan error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /arb/ob-pairs-refresh:
    get:
      operationId: obPairsRefresh
      tags: [arb]
      summary: Force-refresh the discovered Kraken cross-pair list
      description: >
        Invalidates the cached AssetPairs discovery result and re-queries
        Kraken immediately, so new listings appear in ob-scan without a server
        restart. When the refresh fails but a previous discovered set exists,
        that set is kept (refreshed=false only when running on the hardcoded
        fallback).
      responses:
        "200":
          description: Refresh result
          content:
            application/json:
              schema:
                type: object
                required: [refreshed, crossPairsDiscovered, cachedAt]
                properties:
                  refreshed:
                    type: boolean
                    description: True when a real discovered set is active (fresh or previous good cache)
                  crossPairsDiscovered:
                    type: integer
                    description: Number of crypto cross pairs in the active discovered set (0 = hardcoded fallback)
                  cachedAt:
                    type: string
                    format: date-time
                    nullable: true
                    description: When the active discovered set was cached (null on hardcoded fallback)
        "500":
          description: Refresh error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /arb/ob-execute:
    post:
      operationId: obExecute
      tags: [trades]
      summary: Manually execute the top Order Book Hunter route (v18 port)
      description: >
        Port of the Python v18 MANUAL EXECUTION BUTTON. Re-fetches fresh order
        books for the route (cache bypassed), re-simulates the cycle
        (pre-flight), and only places 3 sequential Kraken market orders when
        the fresh profit exceeds minProfitUsd × (size/10). Dry-run records a
        ledger row without placing orders. Legs are sized from the pre-flight
        simulation with orientation-aware cross-pair sides.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObExecuteRequest"
      responses:
        "200":
          description: Execution (or pre-flight rejection) result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObExecuteResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /arb/execution-quality:
    get:
      operationId: getExecutionQuality
      tags: [trades]
      summary: Per-route execution quality aggregates (fill rate, expected vs realized profit)
      responses:
        "200":
          description: Aggregated execution-quality records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionQualityResult"
  /arb/execution-status:
    get:
      operationId: getExecutionStatus
      tags: [trades]
      summary: Live per-leg status of the currently executing triangle
      description: >
        In-memory snapshot updated by the maker-leg fill machinery — current
        leg, order ID, elapsed time, filled percent, per-leg fill timer, and
        retry attempt. Idle (active=false) when nothing is executing.
      responses:
        "200":
          description: Current execution status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionStatusResult"
  /arb/account-pnl:
    post:
      operationId: getAccountPnl
      tags: [trades]
      summary: Ground-truth P&L from actual exchange balances
      description: >
        Values the Kraken account (plus Coinbase when creds provided) at live
        tickers, stores a snapshot, and decomposes the equity change into
        external cash flows (Kraken Ledgers), trading P&L (sum of per-trade
        realized fills), and unrealized drift. Never estimated from scanner profit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountPnlRequest"
      responses:
        "200":
          description: Account P&L computed from balance snapshots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountPnlResult"
  /arb/inventory-imbalance:
    get:
      operationId: getInventoryImbalance
      tags: [trades]
      summary: Per-asset inventory imbalance from live cross-exchange trades
      description: >
        Aggregates completed LIVE cross-exchange inventory trades into per-asset
        venue deltas (base units): buying on one venue and selling
        pre-positioned inventory on the other shifts holdings between
        exchanges. Bookkeeping for later rebalancing — not P&L.
      responses:
        "200":
          description: Per-asset venue deltas
          content:
            application/json:
              schema:
                type: object
                required: [assets, note]
                properties:
                  assets:
                    type: array
                    items:
                      type: object
                      required: [asset, krakenDelta, coinbaseDelta, trades]
                      properties:
                        asset: { type: string }
                        krakenDelta: { type: number, description: "Base units accumulated (+) or drawn down (−) on Kraken" }
                        coinbaseDelta: { type: number }
                        trades: { type: integer }
                        lastTradeAt: { type: string, nullable: true }
                  note: { type: string }
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /arb/cross-mm-execute:
    post:
      operationId: executeCrossMm
      tags: [trades]
      summary: Run one maker-post + taker-hedge cross-exchange cycle
      description: >
        Rests a POST-ONLY limit order on Kraken sized for the given USD
        exposure, only when a confirmed fill could be hedged profitably at
        market on Coinbase against pre-positioned inventory. The hedge is
        never placed before the maker fill is confirmed; the resting order is
        cancelled if it does not fill inside the window or if the projected
        hedged net drops below the profit floor. Dry run returns the full
        projection without placing anything.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrossMmExecuteRequest"
      responses:
        "200":
          description: Cycle outcome (projection, fills, hedge, realized P&L)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrossMmExecuteResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /arb/cross-mm-stats:
    get:
      operationId: getCrossMmStats
      tags: [trades]
      summary: Maker-post/taker-hedge strategy scoreboard (separate from triangles)
      responses:
        "200":
          description: Attempts, fills, hedge outcomes, and realized P&L for the cross-mm strategy only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrossMmStats"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /arb/two-exchange-test:
    post:
      operationId: runTwoExchangeTest
      tags: [trades]
      summary: One-shot two-exchange live test (Kraken market buy → Coinbase sell)
      description: >
        Standalone diagnostic, fully separate from the arbitrage strategies.
        Buys ~$10 of ETH at market on Kraken, then sells the CONFIRMED filled
        quantity on Coinbase from pre-positioned ETH. Refuses to place any
        order when balances or credentials are insufficient. Records exact
        fills, fees, timestamps, order ids, and realized P&L. Never loops,
        never scales size.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoExchangeTestRequest"
      responses:
        "200":
          description: Test outcome with per-leg fills, fees, timestamps, and realized P&L
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoExchangeTestResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /arb/2x-scan:
    get:
      operationId: get2xScan
      tags: [trades]
      summary: Profitability-gated two-exchange scanner (Kraken↔Coinbase, both directions)
      description: >
        Prices BOTH directions per asset (ETH, BTC, SOL) from live depth books:
        depth-walked VWAP for the intended size, per-venue taker fees, slippage
        vs top-of-book, safety buffer, freshness. Every route gets an explicit
        FIRE/SKIP decision with the exact reason. Never trades. Fees are
        assumed defaults unless krakenFeePct/coinbaseFeePct query params carry
        real detected tiers (feesAssumed flags this).
      parameters:
        - { name: sizeUsd, in: query, schema: { type: number } }
        - { name: krakenFeePct, in: query, schema: { type: number } }
        - { name: coinbaseFeePct, in: query, schema: { type: number } }
        - { name: minNetUsd, in: query, schema: { type: number } }
        - { name: bufferUsd, in: query, schema: { type: number } }
        - { name: maxQuoteAgeMs, in: query, schema: { type: number } }
      responses:
        "200":
          description: All routes with FIRE/SKIP decisions plus the best route
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoXScanResult"
  /arb/2x-execute:
    post:
      operationId: execute2x
      tags: [trades]
      summary: Execute ONE profitability-gated two-exchange cycle (hard $10 cap)
      description: >
        Re-projects the route on CURRENT books with REAL detected fee tiers on
        both venues (refuses to guess), re-checks freshness, inventory, floor
        and buffer, takes the SHARED live execution lock, then places the buy,
        waits for the CONFIRMED fill, and immediately sells exactly that
        quantity on the other venue from pre-positioned inventory. Full
        fills/fees/latency/realized P&L logged. Post-submit ambiguity latches
        live runs off until manually reconciled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoXExecuteRequest"
      responses:
        "200":
          description: Execution (or skip) report with per-leg detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoXExecuteResult"
  /arb/2x-stats:
    get:
      operationId: get2xStats
      tags: [trades]
      summary: Cumulative realized P&L for the two-exchange strategy (2X + 2XTEST rows)
      responses:
        "200":
          description: Trade counts and cumulative realized P&L — the only proof of profitability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoXStats"
  /arb/2x-fees:
    post:
      operationId: detect2xFees
      tags: [trades]
      summary: Detect the account's REAL fee tiers on Kraken and Coinbase
      description: >
        Queries both exchanges for the caller's actual maker/taker fee tiers so
        the scanner display, the executor, and P&L all use the SAME fee inputs.
        Fails explicitly rather than falling back to assumptions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoXFeesRequest"
      responses:
        "200":
          description: Real detected maker/taker fee percentages per venue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoXFeesResult"
  /arb/cb-mm-execute:
    post:
      operationId: executeCbMm
      tags: [trades]
      summary: Coinbase-maker / Kraken-taker-hedge cycle (post-only, $10 cap)
      description: >
        The inverted maker-hedge strategy. Posts a POST-ONLY maker limit on
        Coinbase (cheap maker fee, earns spread); while it rests, the Kraken
        hedge is re-projected continuously and the order is cancelled before
        fill if the projection drops below the floor + buffer. Only a CONFIRMED
        maker fill triggers the hedge: a bounded IOC on Kraken for exactly the
        filled quantity. Real detected fees only; configurable positive
        profit floor (default $0.01 net after all costs, never ≤ 0) plus a
        safety buffer enforced; realized P&L recorded only when fully hedged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CbMmExecuteRequest"
      responses:
        "200":
          description: Execution (or skip/cancel) report with per-leg detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CbMmExecuteResult"
  /arb/cb-mm-stats:
    get:
      operationId: getCbMmStats
      tags: [trades]
      summary: Cumulative realized P&L for the CB-maker/K-hedge strategy
      responses:
        "200":
          description: Full-history trade counts and realized P&L for MM2 rows only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoXStats"
  /arb/mm-scan:
    post:
      operationId: mmScan
      tags: [trades]
      summary: Inventory-aware maker-hedge scan across all liquid assets (never trades)
      description: >
        Projects the maker-hedge net for every liquid asset available on both
        venues, in both directions and BOTH structures (Coinbase-maker/Kraken-
        hedge and the reverse), using REAL detected fee tiers and the account's
        actual balances. A row reads RUN only when projected net clears the
        configurable floor + safety buffer, books are fresh, AND the hedge
        inventory exists. Read-only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MmScanRequest"
      responses:
        "200":
          description: Ranked projections with fee stack, inventory readiness, verdicts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MmScanResult"
        "502":
          description: Real fees or balances unavailable — refuses to guess
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /arb/mm-auto/start:
    post:
      operationId: mmAutoStart
      tags: [trades]
      summary: Start AUTO mode for the maker-hedge engine
      description: >
        Server-side watcher that scans every few seconds and fires ONE $10
        Coinbase-maker cycle at a time, only when a route clears the full gate
        (floor + buffer + freshness + inventory). Stops itself on any
        unhedged/indeterminate outcome. Trade size is never auto-scaled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MmAutoStartRequest"
      responses:
        "200":
          description: AUTO started
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "409":
          description: Already running or live runs latched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Real fee tiers unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /arb/mm-auto/stop:
    post:
      operationId: mmAutoStop
      tags: [trades]
      summary: Stop AUTO mode
      responses:
        "200":
          description: Stopped
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /arb/mm-auto/status:
    get:
      operationId: mmAutoStatus
      tags: [trades]
      summary: AUTO mode status, recent events, and last outcome
      responses:
        "200":
          description: Current AUTO state (never includes credentials)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MmAutoStatus"
  /arb/discovery:
    post:
      operationId: discoveryScan
      tags: [trades]
      summary: Read-only cross-venue arbitrage discovery scan (8 public exchanges + live venues)
      description: >
        Scans public order books on major liquid exchanges without trading
        credentials, plus the live Kraken/Coinbase books, and projects the
        executable net for every venue pair × asset at $10/$50/$100 after each
        venue's fees (real detected tiers when keys are provided; labeled
        entry-tier assumptions elsewhere), depth-walked slippage, a USDT basis
        haircut, and a safety buffer. Categorizes routes into executable_now /
        requires_setup / not_profitable. NEVER trades; the $10 live cap is
        unchanged.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscoveryRequest"
      responses:
        "200":
          description: Categorized, ranked cross-venue opportunities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryResult"
  /arb/xv-scan:
    post:
      operationId: xvScan
      tags: [trades]
      summary: Cross-venue scanner across Kraken · Coinbase · Gemini (never trades)
      description: >
        Prices every ordered venue pair × mutually supported USD asset from
        LIVE stream books (depth-walked VWAP, per-venue fees on notional,
        slippage vs top-of-book, per-leg quote ages) and runs a FEASIBLE size
        sweep bounded by real balances and exchange minimums when credentials
        are provided. Fees are DETECTED per-venue when that venue's keys are in
        the request; assumed (labeled) otherwise. A route can only be marked
        FIRE when BOTH legs' fees are DETECTED and balances cover the legs —
        assumptions never gate live decisions. NEVER trades.
      parameters:
        - { name: minNetUsd,      in: query, schema: { type: number },  description: "net-after-buffer floor a route must clear to FIRE (default 0.01)" }
        - { name: maxQuoteAgeMs,  in: query, schema: { type: number },  description: "max staleness of the oldest leg for a live decision (default 200)" }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/XvScanRequest"
      responses:
        "200":
          description: Ranked cross-venue routes with per-leg fee sources, feasibility, and near-miss breakdowns
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/XvScanResult"
  /arb/xv-execute:
    post:
      operationId: xvExecute
      tags: [trades]
      summary: Execute ONE cross-venue cycle ($10 hard cap, detected fees only)
      description: >
        Re-projects the requested route on CURRENT books with DETECTED fees,
        200ms freshness, and a shared live lock; the first leg is confirmed by
        ACTUAL fill quantity and the second leg placed for exactly the confirmed
        quantity. "completed" only on a full terminal second-leg fill; any
        ambiguity latches live runs off pending manual reconciliation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/XvExecuteRequest"
      responses:
        "200":
          description: Execution outcome (or a skip) with confirmed leg fills and realized P&L
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/XvExecuteResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /arb/xv-stats:
    get:
      operationId: xvStats
      tags: [trades]
      summary: "Cross-venue executor ledger stats (XV: prefix, live runs only)"
      responses:
        "200":
          description: Trade counts and cumulative realized P&L from confirmed fills
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/XvStats"
  /arb/xv-auto/start:
    post:
      operationId: xvAutoStart
      tags: [trades]
      summary: Arm the event-driven cross-venue Auto-Execute engine
      description: >
        Arms an event-driven engine that re-evaluates the affected asset on
        every WebSocket book tick and fires the shared execution core ONLY when
        every hard guard passes on that same fresh snapshot — identical guards
        to the manual Execute path (this is not an override). Requires at least
        TWO venues with verified keys, DETECTED fee tiers, and verified
        balances. Freshness can only be tightened, never loosened past the
        200ms hard gate. Auto never transfers assets between exchanges. Keys are
        held in memory only and wiped on stop or server restart.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/XvAutoStartRequest"
      responses:
        "200":
          description: Auto-execute armed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/XvAutoStartResult"
        "400":
          description: Fewer than two verified venues — per-venue reasons returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/XvAutoStartError"
        "409":
          description: Already armed, or live runs locked pending manual reconciliation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /arb/xv-auto/stop:
    post:
      operationId: xvAutoStop
      tags: [trades]
      summary: Disarm the cross-venue Auto-Execute engine (wipes in-memory keys)
      responses:
        "200":
          description: Auto-execute disarmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/XvAutoStopResult"
  /arb/xv-auto/status:
    get:
      operationId: xvAutoStatus
      tags: [trades]
      summary: Cross-venue Auto-Execute engine status + decision log
      responses:
        "200":
          description: Armed state, verified venues, counters, pause/lock reasons, and the recent decision log (newest first, ≤100)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/XvAutoStatus"
  /arb/xv-plan:
    post:
      operationId: xvPlan
      tags: [trades]
      summary: Cross-venue inventory / pre-positioning planner (never trades)
      description: >
        For every positive-net route on CURRENT books, computes exactly what
        must sit WHERE before execution — no assets are ever transferred during
        a trade. Buy side needs notional + taker fee + 1% margin; sell side
        needs base qty + 2% margin (the same margins the executor enforces).
        Requirements are compared against VERIFIED live balances only: READY,
        SHORT by an exact amount, or UNVERIFIED (never treated as $0 or as
        sufficient). Planning uses a relaxed 60s book-age window so funding
        advice doesn't flap; execution still requires ≤200ms freshness. NEVER
        trades.
      parameters:
        - { name: minNetUsd, in: query, schema: { type: number }, description: "net-after-buffer floor a route must clear to be planned (default 0.01)" }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/XvScanRequest"
      responses:
        "200":
          description: Per-route funding requirements and a consolidated "what to fund where" summary per venue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/XvPlan"
  /rebalance/caps:
    post:
      operationId: rebalanceCaps
      tags: [trades]
      summary: Probe each venue's rebalance capabilities (local buy / withdraw)
      description: >
        Fail-closed capability probe: a venue can only participate in an action
        kind this proves it supports. Missing permissions are reported verbatim
        with the EXACT setting to change — never silently skipped.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/XvScanRequest"
      responses:
        "200":
          description: Per-venue capabilities, whitelisted withdrawal keys, and verbatim missing-permission guidance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RebalanceCaps"
  /rebalance/plan:
    post:
      operationId: rebalancePlan
      tags: [trades]
      summary: Plan pre-positioning actions for the best positive-net routes (never fires)
      description: >
        For the top positive-net cross-venue routes, plans the cheapest funding
        action to make each executable — LOCAL_BUY (buy the base asset on the
        venue that needs it, using USD already there) or TRANSFER (Kraken →
        elsewhere via a whitelisted named key). An action is only BENEFICIAL for
        routes with DETECTED fees on BOTH legs and VERIFIED balances, when the
        route's projected net still exceeds the action's full overhead; it is
        revalidated on ≤2s-fresh books immediately before a BOUNDED IOC limit
        order (never an unbounded market order). Transfers are planned with real
        withdrawal fees but NEVER auto-executed in v1. The daily cap is a
        rolling 24h ledger that survives restarts. Projections, not guarantees.
        NEVER trades.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/XvScanRequest"
      responses:
        "200":
          description: Planned actions with overhead math, benefit decision, and verbatim reasons/risks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RebalancePlan"
  /rebalance/arm:
    post:
      operationId: rebalanceArm
      tags: [trades]
      summary: Arm the Auto Rebalance funding engine (executes LOCAL BUYS only)
      description: >
        Arms an engine that, once per 30s tick, executes the single best
        BENEFICIAL LOCAL_BUY within the per-action cap, rolling 24h daily cap,
        and per-venue USD reserves — as a BOUNDED IOC limit order (never an
        unbounded market order) after a ≤2s-fresh revalidation of fees, depth,
        and net edge. Transfers are never fired automatically. Keys are held in
        memory only and wiped on stop. Refuses to act on assumed fees or
        unverified balances, or while the reconciliation latch is set (409).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RebalanceArmRequest"
      responses:
        "200":
          description: Engine armed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RebalanceArmed"
        "400":
          description: Bad config or no API keys provided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Already armed, or reconciliation latch set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /rebalance/stop:
    post:
      operationId: rebalanceStop
      tags: [trades]
      summary: EMERGENCY STOP — disarm the rebalance engine and wipe in-memory keys
      responses:
        "200":
          description: Engine disarmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RebalanceArmed"
  /rebalance/clear-latch:
    post:
      operationId: rebalanceClearLatch
      tags: [trades]
      summary: Clear the durable reconciliation latch (only after checking the exchange)
      description: >
        Clears the durable reconciliation latch that was set when an earlier
        order's outcome could not be confirmed terminal. ONLY clear this AFTER
        checking the venue's order history to verify what actually happened —
        clearing lets the engine arm and act again. Requires an explicit
        `{ "confirm": true }` body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RebalanceClearLatchRequest"
      responses:
        "200":
          description: Latch cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RebalanceClearLatchResult"
        "400":
          description: Missing explicit confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /rebalance/status:
    get:
      operationId: rebalanceStatus
      tags: [trades]
      summary: Auto Rebalance engine status + activity log
      responses:
        "200":
          description: Armed state, pause reason, latch, config, rolling-24h usage, counters, and the recent activity log (newest first, ≤100)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RebalanceStatus"
  /arb/hunter/start:
    post:
      operationId: hunterStart
      tags: [trades]
      summary: Start the 24-hour Profit Hunter evidence collector (read-only, never trades)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscoveryRequest"
      responses:
        "200":
          description: Hunter started
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "409":
          description: Already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /arb/hunter/stop:
    post:
      operationId: hunterStop
      tags: [trades]
      summary: Stop Profit Hunter (evidence is kept)
      responses:
        "200":
          description: Stopped
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /arb/hunter/reset:
    post:
      operationId: hunterReset
      tags: [trades]
      summary: Clear collected Profit Hunter evidence
      responses:
        "200":
          description: Cleared
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /arb/hunter/report:
    get:
      operationId: hunterReport
      tags: [trades]
      summary: Profit Hunter ranked evidence report
      responses:
        "200":
          description: Ranked opportunities with frequency, survivability, and executability evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HunterReport"
  /arb/fee-tier:
    post:
      operationId: getFeeTier
      tags: [trades]
      summary: Look up the account's actual Kraken taker fee tier
      description: >
        Queries Kraken /0/private/TradeVolume for the caller's real taker fee
        on major pairs (max across pairs). Returns null when the query fails
        (bad keys, network) so callers can fall back to their configured
        assumption.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeeTierRequest"
      responses:
        "200":
          description: Actual taker fee (percent per leg) or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeeTierResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /arb/graph-scan:
    get:
      operationId: getGraphScan
      tags: [trades]
      summary: Multi-exchange graph opportunity scan
      description: >
        Builds a directed graph over Kraken (34 assets + verified cross pairs)
        and Coinbase (shared assets), DFS-searches all USD→…→USD cycles up to
        maxHops, and ranks routes by net profit after per-leg fees.
      parameters:
        - { name: tradeSizeUsd,    in: query, schema: { type: number, default: 10 } }
        - { name: krakenFeesPct,   in: query, schema: { type: number, default: 0.16 } }
        - { name: coinbaseFeesPct, in: query, schema: { type: number, default: 0.4 } }
        - { name: maxHops,         in: query, schema: { type: integer, default: 4 } }
        - { name: executionStyle,  in: query, schema: { type: string, enum: [taker, maker], default: taker } }
        - { name: accountId,       in: query, schema: { type: string }, description: "Optional non-reversible account scope (sha256-prefix of held keys) so fill-rate ranking only uses THIS account's execution history. Omitted → neutral prior for all routes." }
      responses:
        "200":
          description: Ranked routes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphScanResult"
        "500":
          description: Scan error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /arb/graph-execute:
    post:
      operationId: graphExecute
      tags: [trades]
      summary: Manually execute an Opportunity Engine route
      description: >
        Re-runs a fresh graph scan (pre-flight), locates the requested route
        (or the top route), and gates on fresh net profit > minProfitUsd.
        Kraken-only triangles reuse the ob-execute 3-leg post-only limit
        machinery (fill confirm + unwind); 2-leg cross-exchange inventory
        routes place both market orders in parallel (requires inventory on
        both venues). Other shapes execute as dry-run only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GraphExecuteRequest"
      responses:
        "200":
          description: Execution (or pre-flight rejection) result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphExecuteResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: forceMode requested without valid operator proof (Kraken credential check failed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /arb/route-history/clear:
    post:
      operationId: clearRouteHistory
      tags: [trades]
      summary: Clear the route blacklist and consecutive-failure streaks
      description: >
        Instantly resets all in-memory route failure streaks, removes every
        route from the blacklist, and clears probe cool-downs. Requires valid
        Kraken credentials (operator proof) — wiping the blacklist loosens
        money-safety behavior, so an anonymous caller must not be able to
        trigger it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteHistoryClearRequest"
      responses:
        "200":
          description: History cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteHistoryClearResult"
        "400":
          description: Missing Kraken credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Credential check failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /arb/trades/verify-legacy:
    post:
      operationId: verifyLegacyTrades
      tags: [trades]
      summary: Verify legacy estimated live trades against Kraken order history
      description: >
        One-time backfill: walks live trades with status "estimated" whose buy
        and sell order IDs are both Kraken txids, fetches actual fills via
        Kraken's private QueryOrders API, and upgrades provable rows to
        "verified" with a fee-inclusive realizedProfitUsd and per-leg fills.
        Rows that cannot be proven stay "estimated". Requires valid Kraken
        credentials (operator proof). Idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyLegacyTradesRequest"
      responses:
        "200":
          description: Backfill result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyLegacyTradesResult"
        "400":
          description: Missing Kraken credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Credential check failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /arb/exec-preview:
    post:
      operationId: execPreview
      tags: [trades]
      summary: Pre-fire execution breakdown for a Kraken triangle route
      description: >
        Fresh order-book breakdown of what a taker fire would look like right
        now — raw top-of-book edge, taker fees at the account's real tier,
        depth-walked slippage for this size, safety buffer, final executable
        net edge, and expected dollar profit — plus the maker-priced net and
        risk-adjusted maker EV, and which path adaptive mode would choose.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecPreviewRequest"
      responses:
        "200":
          description: Breakdown (ok=false when books unavailable or route unsupported)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecPreviewResult"

  /arb/exec-lock/clear:
    post:
      operationId: clearExecLock
      tags: [trades]
      summary: HARD RESET — force-release the live execution lock
      description: >
        Manually clears the shared live-execution lock (e.g. when a dead route
        appears to be holding it). Invalidates the current holder's generation
        token so a zombie execution can never release a newer run's lock.
        Use with care — if an execution is genuinely mid-order, clearing the
        lock allows a second execution to run concurrently. Requires valid
        Kraken credentials: the caller must prove account ownership before
        a concurrency control can be disabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecLockClearRequest"
      responses:
        "200":
          description: Lock cleared (or was already free)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecLockClearResult"

  /arb/execute-triangular:
    post:
      operationId: executeTriangular
      tags: [trades]
      summary: Execute a BTC/SOL/USD triangular loop on Kraken
      description: >
        Port of Python v13 FORCE TRIANGULAR. Places 3 sequential market orders on Kraken
        for either the USD→BTC→SOL→USD or USD→SOL→BTC→USD loop. In dry-run mode only
        computes the estimated profit without placing orders. Trade size defaults to 10 USD
        (dry/force) or 20% of USD balance capped at $50 (auto-loop).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriExecuteRequest"
      responses:
        "200":
          description: Execution result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriExecuteResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Execution error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /arb/inventory-scan:
    get:
      operationId: getInventoryScan
      tags: [trades]
      summary: Scan live bid/ask across Kraken and Coinbase for inventory arb opportunities
      description: >
        Fetches live best-bid/best-ask for each requested asset from both venues,
        computes gross and net spread (after per-leg fees), and flags any asset
        whose net spread exceeds 2× total fees. When credentials are supplied the
        response also includes rebalance alerts when one-side inventory drops
        below 20% of the target allocation.
      parameters:
        - { name: assets,          in: query, schema: { type: string, default: "BTC,ETH,SOL" }, description: "Comma-separated asset symbols" }
        - { name: krakenFeesPct,   in: query, schema: { type: number, default: 0.16 } }
        - { name: coinbaseFeesPct, in: query, schema: { type: number, default: 0.4 } }
        - { name: tradeSizeUsd,    in: query, schema: { type: number, default: 10 } }
        - { name: targetPct,       in: query, schema: { type: number, default: 50 }, description: "Target % of asset to hold on each exchange (0–100)" }
      responses:
        "200":
          description: Inventory scan result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryScanResult"
        "500":
          description: Scan error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /arb/inventory-execute:
    post:
      operationId: inventoryExecute
      tags: [trades]
      summary: Execute an inventory arb — buy on cheap venue, sell on expensive venue
      description: >
        Re-fetches live prices (pre-flight), confirms the spread still exceeds the
        minimum profit threshold, then places a buy on the cheaper exchange and a
        sell on the more expensive one using existing inventory. Acquires the
        process-wide live execution lock so it cannot run concurrently with graph
        or OB execute. Records the result to the trade ledger.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryExecuteRequest"
      responses:
        "200":
          description: Execution result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryExecuteResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Execution error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /trades/summary:
    get:
      operationId: getTradeSummary
      tags: [trades]
      summary: Get P&L summary and statistics
      responses:
        "200":
          description: P&L summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeSummary"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    GeminiCredentials:
      type: object
      required: [geminiKey, geminiSecret]
      properties:
        geminiKey: { type: string }
        geminiSecret: { type: string }
    GeminiTestResult:
      type: object
      required: [ok, message]
      properties:
        ok: { type: boolean }
        message: { type: string }
        makerPct: { type: number, nullable: true, description: "DETECTED maker fee tier, percent" }
        takerPct: { type: number, nullable: true, description: "DETECTED taker fee tier, percent" }
        usdBalance: { type: number, nullable: true, description: "Available USD in the trading scope — NULL when balances are unverified (scopeIssue set); never render as a real $0.00" }
        balances:
          type: object
          additionalProperties: { type: number }
        balancesVerified: { type: boolean, description: "true only when Gemini returned a clean balance read for the key's trading scope (scopeIssue == null)" }
        scopeIssue: { type: string, nullable: true, description: "EXACT scope/permission diagnostic to show VERBATIM when balances could not be verified (e.g. funds in a different account, or missing balances permission); null when balances are verified clean" }
        keyScope: { type: string, nullable: true, description: "master | account — master keys can enumerate accounts" }
        balanceDetail:
          type: array
          description: "Per-currency detail for the key's trading scope"
          items: { $ref: "#/components/schemas/GeminiBalanceRow" }
        accountScopes:
          type: array
          description: "All account scopes visible to the key (master keys: every account; account keys: just the default)"
          items: { $ref: "#/components/schemas/GeminiAccountScope" }
        note: { type: string, nullable: true }
    GeminiBalanceRow:
      type: object
      required: [currency, total, available, held]
      properties:
        currency: { type: string }
        total: { type: number, description: "Total amount in the account (includes held/reserved)" }
        available: { type: number, description: "Available/tradable now" }
        held: { type: number, description: "Held / reserved (open orders etc.) = total − available" }
    GeminiAccountScope:
      type: object
      required: [account, balances, error]
      properties:
        account: { type: string, nullable: true, description: "Gemini account name/label this row set came from (null = key's default scope)" }
        balances:
          type: array
          items: { $ref: "#/components/schemas/GeminiBalanceRow" }
        error: { type: string, nullable: true, description: "per-account fetch failure (exact Gemini reason)" }
    KrakenCredentials:
      type: object
      required: [krakenKey, krakenSecret]
      properties:
        krakenKey:
          type: string
        krakenSecret:
          type: string

    CoinbaseCredentials:
      type: object
      required: [coinbaseKey, coinbaseSecret]
      properties:
        coinbaseKey:
          type: string
        coinbaseSecret:
          type: string

    ExchangeCredentials:
      type: object
      required: [krakenKey, krakenSecret, coinbaseKey, coinbaseSecret]
      properties:
        krakenKey:
          type: string
        krakenSecret:
          type: string
        coinbaseKey:
          type: string
        coinbaseSecret:
          type: string
        geminiKey:
          type: string
        geminiSecret:
          type: string
        enabledPairs:
          type: array
          items:
            type: string
          description: "Optional allow-list of pair symbols to scan (e.g. ['SOL/USD', 'BTC/USD']). Scans all pairs when omitted."
        pair:
          type: string
          description: "Active trading pair (e.g. BTC/USD). When provided, base-asset balances for that pair are included in the response."

    WsStatus:
      type: object
      required: [kraken, coinbase]
      properties:
        kraken:
          type: boolean
        coinbase:
          type: boolean

    PriceData:
      type: object
      required: [krakenPrice, krakenBid, krakenAsk, coinbasePrice, coinbaseBid, coinbaseAsk, grossSpreadPct, route, timestamp, bestBuyExchange, bestSellExchange, buyPrice, sellPrice, executable, wsStatus]
      properties:
        pair:
          type: string
          description: "Canonical pair symbol with the best spread (e.g. SOL/USD, BTC/USD)"
        krakenPrice:
          type: number
        krakenBid:
          type: number
        krakenAsk:
          type: number
        coinbasePrice:
          type: number
        coinbaseBid:
          type: number
        coinbaseAsk:
          type: number
        binancePrice:
          type: number
          nullable: true
        kuCoinPrice:
          type: number
          nullable: true
        grossSpreadPct:
          type: number
          description: "Gross top-of-book spread, BEFORE fees/slippage. Net edge is computed client-side as gross − (totalFees + slippage) so it always matches the execution gate."
        route:
          type: string
        buyExchange:
          type: string
        sellExchange:
          type: string
        bestBuyExchange:
          type: string
        bestSellExchange:
          type: string
        buyPrice:
          type: number
        sellPrice:
          type: number
        executable:
          type: boolean
        wsStatus:
          $ref: "#/components/schemas/WsStatus"
        timestamp:
          type: string

    BalanceEntry:
      type: object
      required: [currency, amount]
      properties:
        currency:
          type: string
        amount:
          type: number

    BalanceData:
      type: object
      required: [kraken, coinbase]
      properties:
        kraken:
          type: array
          items:
            $ref: "#/components/schemas/BalanceEntry"
        coinbase:
          type: array
          items:
            $ref: "#/components/schemas/BalanceEntry"
        solOnKraken:
          type: number
        solOnCoinbase:
          type: number
        usdOnCoinbase:
          type: number
        suggestedVolume:
          type: number
        baseAsset:
          type: string
          description: "Base asset of the requested pair (e.g. BTC); SOL when no pair given"
        baseAssetOnKraken:
          type: number
        baseAssetOnCoinbase:
          type: number

    PreloadedCredentials:
      type: object
      required: [krakenKey, krakenSecret, coinbaseKey, coinbaseSecret, anyLoaded]
      properties:
        krakenKey:
          type: string
        krakenSecret:
          type: string
        coinbaseKey:
          type: string
        coinbaseSecret:
          type: string
        anyLoaded:
          type: boolean

    ConnectionTestResult:
      type: object
      required: [ok, message]
      properties:
        ok:
          type: boolean
        message:
          type: string
        balances:
          type: array
          items:
            $ref: "#/components/schemas/BalanceEntry"

    TradeRequest:
      type: object
      required: [krakenKey, krakenSecret, coinbaseKey, coinbaseSecret, buyExchange, sellExchange, volume, krakenPrice, coinbasePrice, liveMode]
      properties:
        krakenKey:
          type: string
        krakenSecret:
          type: string
        coinbaseKey:
          type: string
        coinbaseSecret:
          type: string
        buyExchange:
          type: string
        sellExchange:
          type: string
        volume:
          type: number
        krakenPrice:
          type: number
        coinbasePrice:
          type: number
        liveMode:
          type: boolean
        netEdgePct:
          type: number
        orderType:
          type: string
          enum: [market, limit]
          default: market
        pair:
          type: string
          description: "Trading pair symbol (e.g. SOL/USD, BTC/USD). Defaults to SOL/USD."

    TradeResult:
      type: object
      required: [success, isDryRun, estimatedProfitUsd, tradeNumber]
      properties:
        success:
          type: boolean
        isDryRun:
          type: boolean
        skipped:
          type: boolean
          description: "True when the trade was skipped (e.g. insufficient balance) rather than executed or failed"
        estimatedProfitUsd:
          type: number
        tradeNumber:
          type: integer
        buyOrderId:
          type: ["string", "null"]
        sellOrderId:
          type: ["string", "null"]
        error:
          type: ["string", "null"]

    TradeListResult:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TradeRecord"
        total:
          type: integer
          description: Total trade rows in the ledger, counted in the same request as the page

    TradeRecord:
      type: object
      required: [id, createdAt, buyExchange, sellExchange, volume, estimatedProfitUsd, netEdgePct, isDryRun, krakenPrice, coinbasePrice]
      properties:
        id:
          type: integer
        createdAt:
          type: string
        pair:
          type: ["string", "null"]
          description: "Trading pair symbol (e.g. SOL/USD, BTC/USD). Null for records before multi-pair support."
        buyExchange:
          type: string
        sellExchange:
          type: string
        volume:
          type: number
        estimatedProfitUsd:
          type: number
        netEdgePct:
          type: number
        isDryRun:
          type: boolean
        krakenPrice:
          type: number
        coinbasePrice:
          type: number
        buyOrderId:
          type: ["string", "null"]
        sellOrderId:
          type: ["string", "null"]
        status:
          type: ["string", "null"]
          description: >
            Ledger classification: verified (every leg has confirmed exchange
            fill data + order IDs; realizedProfitUsd is real), failed (live
            attempt that did not complete, incl. unwinds), simulated (dry
            runs / scanner estimates), estimated (legacy live rows without
            per-leg fill proof). Null on very old rows.
        realizedProfitUsd:
          type: ["number", "null"]
          description: Realized P&L from ACTUAL confirmed fills, fee-inclusive. Only on verified rows.
        legFills:
          type: ["array", "null"]
          description: Per-leg confirmed fill evidence (actual price, volume, fee, exchange order ID).
          items:
            type: object
            properties:
              leg: { type: integer }
              label: { type: string }
              pair: { type: string }
              side: { type: string }
              price: { type: ["number", "null"] }
              volume: { type: number }
              costUsd: { type: number }
              fee: { type: number }
              txid: { type: ["string", "null"] }
              taker: { type: boolean }
              unwind: { type: boolean }

    AllPairSnapshot:
      type: object
      required: [pair, coin, grossSpreadPct, buyExchange, krakenBid, krakenAsk, coinbaseBid, coinbaseAsk]
      properties:
        pair:
          type: string
          description: "Canonical pair, e.g. BTC/USD"
        coin:
          type: string
          description: "Short coin symbol, e.g. BTC"
        krakenBid:
          type: ["number", "null"]
          description: "Kraken best bid; null when cache data is stale (> 30 s)"
        krakenAsk:
          type: ["number", "null"]
          description: "Kraken best ask; null when cache data is stale (> 30 s)"
        coinbaseBid:
          type: ["number", "null"]
          description: "Coinbase best bid; null when cache data is stale (> 30 s)"
        coinbaseAsk:
          type: ["number", "null"]
          description: "Coinbase best ask; null when cache data is stale (> 30 s)"
        grossSpreadPct:
          type: ["number", "null"]
          description: "Gross cross-exchange spread % (best direction); null when either side is missing"
        buyExchange:
          type: ["string", "null"]
          description: "Exchange to buy on for best spread; null when spread cannot be computed"

    PairScanEntry:
      type: object
      required: [coin, pair, krakenPrice, coinbasePrice, krakenBid, krakenAsk, coinbaseBid, coinbaseAsk, grossSpreadPct, buyExchange, sellExchange, scannedAt]
      properties:
        coin:
          type: string
          description: "Short coin symbol, e.g. BTC, ETH, SOL"
        pair:
          type: string
          description: "Canonical pair, e.g. BTC/USD"
        krakenPrice:
          type: number
        coinbasePrice:
          type: number
        krakenBid:
          type: number
        krakenAsk:
          type: number
        coinbaseBid:
          type: number
        coinbaseAsk:
          type: number
        grossSpreadPct:
          type: number
          description: "Gross cross-exchange spread % using bid/ask (best direction)"
        buyExchange:
          type: string
        sellExchange:
          type: string
        scannedAt:
          type: string

    ObCycleEntry:
      type: object
      required: [route, assetA, assetB, estimatedProfitUsd, profitPct, grossProfitUsd, feeUsd, avgPriceA, avgCrossRate, avgPriceB, volumeA, slippagePct, status, confidencePct, legs]
      properties:
        route: {type: string, description: "e.g. USD→SOL→ETH→USD"}
        assetA: {type: string}
        assetB: {type: string}
        estimatedProfitUsd: {type: number}
        grossProfitUsd: {type: number, description: "raw triangle edge ($) before fees, slippage included"}
        feeUsd: {type: number, description: "total 3-leg fee drag ($) at the scan's per-leg fee rate"}
        profitPct: {type: number, description: "profit as % of tradeSizeUsd"}
        avgPriceA: {type: number, description: "average USD fill price for leg 1"}
        avgCrossRate: {type: number, description: "average B-per-A cross rate"}
        avgPriceB: {type: number, description: "average USD fill price for leg 3"}
        volumeA: {type: number, description: "amount of A acquired in leg 1"}
        slippagePct: {type: number, description: "total execution slippage across 3 legs (%)"}
        status:
          type: string
          enum: [READY, HIGH_SLIPPAGE, LOW_PROFIT]
          description: "v15 conservative classification"
        confidencePct: {type: number, description: "v17 liquidity confidence 0-100 — avg top-of-book coverage across all legs"}
        legs: {type: number, description: "v20 — number of legs in the route: 3 (USD→A→B→USD) or 4 (USD→A→M→B→USD via the BTC/ETH cross)"}
        path:
          type: array
          items: {type: string}
          description: "v21 — full asset chain between the USD legs (e.g. [A, B] or [A, M1, M2]); pass to ob-execute so 4-leg routes execute all hops"

    ObScalingRow:
      type: object
      required: [sizeUsd, profitUsd, slippagePct, confidencePct, status]
      properties:
        sizeUsd: {type: number}
        profitUsd: {type: number}
        slippagePct: {type: number}
        confidencePct: {type: number}
        status:
          type: string
          enum: [VIABLE, HIGH_SLIPPAGE, REJECTED]
          description: "v18 — VIABLE when profit > minProfitUsd×(size/10) and slippage within limit"

    ObScanResult:
      type: object
      required: [cycles, tradeSizeUsd, feesPct, minProfitUsd, maxSlippagePct, readyCount, pairsScanned, pairsRequested, volatilityFilter, activeAssets, scalingRoute, scaling, scannedAt, crossPairsDiscovered]
      properties:
        cycles:
          type: array
          items:
            $ref: "#/components/schemas/ObCycleEntry"
        tradeSizeUsd: {type: number}
        feesPct: {type: number}
        minProfitUsd: {type: number, description: "min net profit ($) for READY status"}
        maxSlippagePct: {type: number, description: "max tolerated total slippage (%) for READY status"}
        readyCount: {type: number, description: "number of READY cycles"}
        pairsScanned: {type: number, description: "pairs whose order book fetch succeeded"}
        pairsRequested: {type: number, description: "pairs the scan attempted to fetch"}
        volatilityFilter: {type: boolean, description: "v17 — whether the volatility filter was requested"}
        activeAssets:
          type: array
          items: {type: string}
          description: "v17 — assets actually scanned after the volatility filter"
        scalingRoute:
          type: string
          nullable: true
          description: "v18 — route of the top-ranked cycle the scaling table covers (null when no cycles)"
        scaling:
          type: array
          items:
            $ref: "#/components/schemas/ObScalingRow"
          description: "v18 — top route re-simulated at $10/$50/$100/$500/$1,000; unabsorbable sizes omitted"
        scannedAt: {type: string}
        crossPairsDiscovered: {type: number, description: "v19 — cross pairs discovered dynamically via Kraken AssetPairs (0 when using the hardcoded fallback)"}

    CointegrationSignal:
      type: object
      required: [pair, asset1, asset2, price1, price2, hedgeRatio, spread, zScore, direction, edgePct, observations, timestamp]
      properties:
        pair:
          type: string
          description: "Display label, e.g. SOL/ETH"
        asset1:
          type: string
          description: "Short symbol for asset 1, e.g. SOL"
        asset2:
          type: string
          description: "Short symbol for asset 2, e.g. ETH"
        price1:
          type: number
        price2:
          type: number
        hedgeRatio:
          type: number
          description: "Kalman-filter beta (hedge ratio)"
        spread:
          type: number
          description: "Latest Kalman spread value"
        zScore:
          type: number
          description: "Normalised z-score of the current spread"
        direction:
          type: string
          enum: [long_asset1, short_asset1]
        edgePct:
          type: number
          description: "Conservative edge estimate as a fraction (not %)"
        observations:
          type: integer
          description: "Number of spread observations in the Kalman history"
        timestamp:
          type: string

    CointegrationScanResult:
      type: object
      required: [signals, scannedAt]
      properties:
        signals:
          type: array
          items:
            $ref: "#/components/schemas/CointegrationSignal"
        scannedAt:
          type: string

    ObExecuteRequest:
      type: object
      required: [krakenKey, krakenSecret, assetA, assetB]
      properties:
        krakenKey:
          type: string
        krakenSecret:
          type: string
        assetA:
          type: string
          description: "Asset A of the displayed top route (server re-verifies via fresh pre-flight)"
        assetB:
          type: string
        path:
          type: array
          items: {type: string}
          description: >
            v21 — full asset chain between the USD legs (e.g. [SOL, BTC, ETH]
            for USD→SOL→BTC→ETH→USD). When present (length ≥ 2) it overrides
            assetA/assetB and the executor places one order per hop (4 orders
            for a 4-leg route). Omitted → classic [assetA, assetB] triangle.
        tradeSizeUsd:
          type: number
          default: 10
        feesPct:
          type: number
          default: 0.5
        minProfitUsd:
          type: number
          default: 0.02
          description: "Min net profit ($) at $10; pre-flight gate scales it by size/10"
        isDryRun:
          type: boolean
          default: true
        leg1RestMs:
          type: number
          description: >
            Total leg-1 maker rest window in ms (server clamps to 5000–120000).
            The post-only order may rest up to this long while the edge-recheck
            loop can cancel it early.
        edgeCheckMs:
          type: number
          description: >
            Leg-1 edge re-check / reprice interval in ms while the maker order
            rests (server clamps to 500–30000; default 2500).
        maxReprices:
          type: number
          default: 4
          description: >
            Max leg-1 chases (cancel + re-join at the fresh maker price) within
            the rest window (server clamps to 1–10).

    CrossMmExecuteRequest:
      type: object
      required: [krakenKey, krakenSecret, coinbaseKey, coinbaseSecret, asset]
      properties:
        krakenKey: { type: string }
        krakenSecret: { type: string }
        coinbaseKey: { type: string }
        coinbaseSecret: { type: string }
        asset:
          type: string
          description: Base asset traded on both venues (e.g. ETH, BTC, SOL)
        tradeSizeUsd:
          type: number
          default: 10
          maximum: 10
          description: USD exposure of the maker order. Hard-capped at $10 until the strategy proves positive realized P&L.
        minProfitUsd:
          type: number
          default: 0.01
          description: Profit floor the projected hedged net must clear (clamped >= 0 for live runs)
        maxQuoteAgeMs:
          type: number
          default: 200
          description: Freshness window for both venues' books at placement and hedge time
        restWindowMs:
          type: number
          default: 30000
          maximum: 120000
          description: How long the post-only order may rest before cancel
        direction:
          type: string
          enum: [auto, buy, sell]
          default: auto
          description: Side of the Kraken maker order; auto picks the better projected direction
        coinbaseFeesPct:
          type: number
          default: 0.4
          description: Coinbase taker fee assumption (percent) for the hedge leg
        isDryRun:
          type: boolean
          default: true
    CrossMmProjection:
      type: object
      required: [direction, makerPrice, makerQty, projectedNetUsd, makerFeeUsd, hedgeFeeUsd, hedgeVwapPx, quoteAgeMs]
      properties:
        direction: { type: string, enum: [buy, sell] }
        makerPrice: { type: number }
        makerQty: { type: number }
        projectedNetUsd: { type: number }
        makerFeeUsd: { type: number }
        hedgeFeeUsd: { type: number }
        hedgeVwapPx: { type: number }
        hedgeTopPx: { type: number }
        hedgeSlippageUsd: { type: number }
        quoteAgeMs: { type: number }
        legAges: { type: string, description: "Human-readable per-leg book ages" }
    CrossMmExecuteResult:
      type: object
      required: [success, isDryRun, executed, outcome]
      properties:
        success: { type: boolean }
        isDryRun: { type: boolean }
        executed: { type: boolean, description: "True when a maker fill occurred (money moved)" }
        outcome:
          type: string
          description: >
            projection_only | gate_blocked | inventory_blocked | post_rejected |
            no_fill_cancel | gate_cancel | hedged | unhedged | indeterminate
        asset: { type: string }
        projection:
          allOf: [{ $ref: "#/components/schemas/CrossMmProjection" }]
          nullable: true
        makerOrderId: { type: string, nullable: true }
        makerFilledQty: { type: number, nullable: true }
        makerAvgPrice: { type: number, nullable: true }
        hedgeOrderId: { type: string, nullable: true }
        hedgeFilledUsd: { type: number, nullable: true }
        realizedProfitUsd:
          type: number
          nullable: true
          description: Fee-inclusive realized P&L from ACTUAL fills on both legs; null when nothing filled
        latency:
          type: object
          nullable: true
          additionalProperties: { type: number }
          description: Millisecond marks (decide→place→fill→hedge)
        error: { type: string, nullable: true }
    CrossMmStats:
      type: object
      required: [attempts, makerFills, hedged, unhedged, realizedTotalUsd]
      properties:
        attempts: { type: integer }
        postRejected: { type: integer }
        gateCancels: { type: integer }
        noFillCancels: { type: integer }
        makerFills: { type: integer }
        hedged: { type: integer }
        unhedged: { type: integer }
        realizedTotalUsd: { type: number }
        avgRealizedUsd: { type: number, nullable: true }
        fillRatePct: { type: number, nullable: true }
        recent:
          type: array
          items:
            type: object
            properties:
              route: { type: string }
              filled: { type: boolean }
              expectedProfitUsd: { type: number, nullable: true }
              realizedProfitUsd: { type: number, nullable: true }
              note: { type: string, nullable: true }
              createdAt: { type: string, nullable: true }
    TwoExchangeTestRequest:
      type: object
      required: [krakenKey, krakenSecret, coinbaseKey, coinbaseSecret]
      properties:
        krakenKey: { type: string }
        krakenSecret: { type: string }
        coinbaseKey: { type: string }
        coinbaseSecret: { type: string }
        sizeUsd:
          type: number
          default: 10
          maximum: 10
          description: USD size of the Kraken buy. Hard-capped at $10 — this is a diagnostic, not a strategy.
        isDryRun:
          type: boolean
          default: true
          description: When true, verifies balances and prices but places no orders.
        direction:
          type: string
          enum: [coinbase_to_kraken, kraken_to_coinbase]
          default: coinbase_to_kraken
          description: >
            coinbase_to_kraken (default): buy ETH on Coinbase with USD, sell the
            confirmed fill on Kraken from pre-positioned tradable ETH — works
            when Coinbase ETH is staked. kraken_to_coinbase: original direction,
            needs tradable ETH on Coinbase.
    TwoExchangeTestLeg:
      type: object
      properties:
        exchange: { type: string }
        side: { type: string }
        orderId: { type: string, nullable: true }
        status: { type: string, nullable: true }
        filledQty: { type: number, nullable: true }
        avgPrice: { type: number, nullable: true }
        notionalUsd: { type: number, nullable: true }
        feeUsd: { type: number, nullable: true }
        placedAt: { type: string, nullable: true }
        terminalAt: { type: string, nullable: true }
        error: { type: string, nullable: true }
    TwoExchangeTestResult:
      type: object
      required: [success, isDryRun, outcome]
      properties:
        success: { type: boolean }
        isDryRun: { type: boolean }
        direction: { type: string, nullable: true, description: "Which direction ran: coinbase_to_kraken or kraken_to_coinbase" }
        outcome:
          type: string
          description: dry_run_ok | blocked | buy_failed | sell_failed | partial_sell | completed | indeterminate
        blockReason: { type: string, nullable: true }
        balances:
          type: object
          nullable: true
          description: Balances actually read from the exchanges during the check
          properties:
            krakenUsd: { type: number }
            coinbaseEth: { type: number, description: "Tradable (available) ETH — the only ETH the sell leg can use" }
            coinbaseEthStaked: { type: number, description: "Staked ETH — NOT tradable until unstaked" }
            coinbaseEthHold: { type: number, description: "ETH locked by open orders / pending activity" }
