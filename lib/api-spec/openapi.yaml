          allOf: [{ $ref: "#/components/schemas/CbMmLeg" }]
          nullable: true
        realizedProfitUsd: { type: number, nullable: true }
        makerVenue: { type: string, description: "kraken | coinbase | gemini — present on venue-generic executions" }
        hedgeVenue: { type: string, description: "kraken | coinbase | gemini — present on venue-generic executions" }
        structure: { type: string, description: "human-readable structure label, e.g. 'gemini(maker)→kraken(hedge)' — present on venue-generic executions" }
        projection:
          type: object
          nullable: true
          additionalProperties: true
    MmScanRequest:
      type: object
      required: [krakenKey, krakenSecret, coinbaseKey, coinbaseSecret]
