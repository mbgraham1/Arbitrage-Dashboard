        maxQuoteAgeMs: { type: number }
        restWindowSec: { type: number }
    CbMmLeg:
      type: object
      properties:
        venue: { type: string }
        side: { type: string }
        orderId: { type: string, nullable: true }
        status: { type: string }
        filledQty: { type: number }
        avgPrice: { type: number, nullable: true }
        notionalUsd: { type: number, nullable: true }
