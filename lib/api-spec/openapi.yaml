    XvAutoStartError:
      type: object
      required: [error, venues]
      properties:
        error: { type: string }
        venues:
          type: array
          items: { $ref: "#/components/schemas/XvAutoVenueVerify" }
    XvAutoStopResult:
      type: object
      required: [armed, note]
      properties:
        armed: { type: boolean }
        note: { type: string }
    XvAutoLogEntry:
      type: object
      required: [at, asset, buyVenue, sellVenue, sizeUsd, buyAgeMs, sellAgeMs, feeSourceBuy, feeSourceSell, depthOk, scannerNetUsd, executableNetUsd, floorUsd, decision, reason]
      properties:
        at: { type: string }
        asset: { type: string }
        buyVenue: { type: string }
        sellVenue: { type: string }
        sizeUsd: { type: number }
        buyAgeMs: { type: number }
        sellAgeMs: { type: number }
        feeSourceBuy: { type: string, description: "detected | assumed" }
        feeSourceSell: { type: string, description: "detected | assumed" }
        balancesOk: { type: boolean, nullable: true }
        depthOk: { type: boolean }
        scannerNetUsd: { type: number, description: "net profit before buffer (what the scanner ranks by)" }
        executableNetUsd: { type: number, description: "net after buffer — must clear the floor to fire" }
        floorUsd: { type: number }
        decision: { type: string, description: "FIRE | SKIP" }
        reason: { type: string, description: "verbatim decision reason" }
        outcome: { type: string, nullable: true, description: "execution outcome once a FIRE resolves (null for SKIPs)" }
        realizedUsd: { type: number, nullable: true, description: "realized P&L from confirmed fills only (null otherwise)" }
    XvAutoStatus:
      type: object
      required: [armed, liveNeedsReconcile, verifiedVenues, evals, fires, log]
      properties:
        armed: { type: boolean }
        startedAt: { type: string, nullable: true }
        pausedReason: { type: string, nullable: true, description: "engine paused itself (e.g. after an unhedged/indeterminate outcome) — shown as a loud alert" }
        liveNeedsReconcile: { type: string, nullable: true, description: "live runs locked pending manual reconciliation" }
        verifiedVenues:
          type: array
          items: { type: string }
        minNetUsd: { type: number, nullable: true }
        maxQuoteAgeMs: { type: number, nullable: true }
        evals: { type: integer }
        fires: { type: integer }
        lastFireAt: { type: string, nullable: true }
        log:
          type: array
          description: "recent decision log, newest first (≤100)"
          items: { $ref: "#/components/schemas/XvAutoLogEntry" }
    XvPlanRequirement:
      type: object
      required: [venue, kind, asset, requiredAmount, requiredUsdValue, status]
      properties:
        venue: { type: string, description: "kraken | coinbase | gemini" }
        kind: { type: string, description: "quote (USD needed to buy) | base (asset qty needed to sell)" }
        asset: { type: string, description: "USD for quote-side, the base asset for base-side" }
        requiredAmount: { type: number, description: "USD for quote-side, base qty for base-side" }
        requiredUsdValue: { type: number, description: "approximate USD value of the requirement" }
        haveAmount: { type: number, nullable: true, description: "verified balance in the same unit; null = UNVERIFIED (never assumed $0 or sufficient)" }
        status: { type: string, description: "READY | SHORT | UNVERIFIED" }
        shortBy: { type: number, nullable: true, description: "exact missing amount (same unit as requiredAmount) when SHORT; null otherwise" }
    XvPlanRoute:
      type: object
      required: [asset, buyVenue, sellVenue, sizeUsd, netAfterBufferUsd, quoteAgeMs, feeSourceBuy, feeSourceSell, requirements, executableNow, blocker]
      properties:
        asset: { type: string }
        buyVenue: { type: string, description: "kraken | coinbase | gemini" }
        sellVenue: { type: string, description: "kraken | coinbase | gemini" }
        sizeUsd: { type: number }
        netAfterBufferUsd: { type: number }
        quoteAgeMs: { type: number }
        feeSourceBuy: { type: string, description: "detected | assumed" }
        feeSourceSell: { type: string, description: "detected | assumed" }
        minNotionalUsd: { type: number, nullable: true }
        requirements:
          type: array
          items: { $ref: "#/components/schemas/XvPlanRequirement" }
        executableNow: { type: boolean, description: "both requirements READY and fees detected on both legs" }
        blocker: { type: string, description: "plain-English first current blocker or READY label" }
    XvPlanFundingAsset:
      type: object
      required: [asset, qtyNeeded, usdValue, status]
      properties:
        asset: { type: string }
        qtyNeeded: { type: number }
        usdValue: { type: number }
        have: { type: number, nullable: true, description: "verified balance; null = UNVERIFIED" }
        status: { type: string, description: "READY | SHORT | UNVERIFIED" }
        shortBy: { type: number, nullable: true }
    XvPlanFundingVenue:
      type: object
      required: [usdNeeded, assets]
      properties:
        usdNeeded: { type: number, description: "max quote USD needed across positive routes buying on this venue" }
        usdHave: { type: number, nullable: true, description: "verified spendable USD; null = UNVERIFIED" }
        assets:
          type: array
          items: { $ref: "#/components/schemas/XvPlanFundingAsset" }
    XvPlanFunding:
      type: object
      required: [kraken, coinbase, gemini]
      properties:
        kraken: { $ref: "#/components/schemas/XvPlanFundingVenue" }
        coinbase: { $ref: "#/components/schemas/XvPlanFundingVenue" }
        gemini: { $ref: "#/components/schemas/XvPlanFundingVenue" }
    XvPlanVenue:
      type: object
      required: [id, feeSource, takerPct, balancesVerified]
      properties:
        id: { type: string, description: "kraken | coinbase | gemini" }
        feeSource: { type: string, description: "detected | assumed" }
        takerPct: { type: number }
        usd: { type: number, nullable: true }
        balancesVerified: { type: boolean }
        error: { type: string, nullable: true }
    XvPlan:
      type: object
      required: [plannedAt, minNetUsd, note, venues, routes, funding]
      properties:
        plannedAt: { type: string }
        minNetUsd: { type: number }
        note: { type: string, description: "verbatim planning note — must be shown as-is" }
        venues:
          type: array
          items: { $ref: "#/components/schemas/XvPlanVenue" }
        routes:
          type: array
          description: "positive-net routes, highest net first (≤12)"
          items: { $ref: "#/components/schemas/XvPlanRoute" }
        funding: { $ref: "#/components/schemas/XvPlanFunding" }
    RebalanceWhitelistKey:
      type: object
      required: [asset, key]
      properties:
        asset: { type: string }
        key: { type: string, description: "the named Kraken withdrawal key" }
        method: { type: string, nullable: true }
    RebalanceVenueCaps:
      type: object
      required: [venue, localBuy, withdraw, whitelist]
      properties:
        venue: { type: string, description: "kraken | coinbase | gemini" }
        localBuy: { type: boolean, description: "can place orders on this venue (trade permission)" }
        withdraw: { type: boolean }
        whitelist:
          type: array
          description: "Kraken named withdrawal keys"
          items: { $ref: "#/components/schemas/RebalanceWhitelistKey" }
        missing: { type: string, nullable: true, description: "verbatim exact permission/setup that is missing — must be shown as-is; null when nothing is missing" }
    RebalanceCaps:
      type: object
      required: [venues]
      properties:
        venues:
          type: array
          items: { $ref: "#/components/schemas/RebalanceVenueCaps" }
    RebalanceAction:
      type: object
      required: [kind, asset, venue, qty, estNotionalUsd, overheadUsd, routeNetUsd, netAfterOverheadUsd, beneficial, reason]
      properties:
        kind: { type: string, description: "LOCAL_BUY | TRANSFER" }
        asset: { type: string }
        venue: { type: string, description: "where the inventory must END UP" }
        sourceVenue: { type: string, nullable: true, description: "transfer source (null for LOCAL_BUY)" }
        qty: { type: number }
        estNotionalUsd: { type: number }
        overheadUsd: { type: number, description: "full estimated cost of the action (fees + slippage + withdrawal fee)" }
        routeNetUsd: { type: number, description: "the route this action unlocks" }
        netAfterOverheadUsd: { type: number, description: "routeNet − overhead, first-cycle basis" }
        beneficial: { type: boolean, description: "true only when net positive after overhead, detected fees, within caps/reserves (transfers are always false in v1)" }
        reason: { type: string, description: "verbatim exact math or exact refusal — must be shown as-is" }
        transferRisk: { type: string, nullable: true, description: "verbatim transfer-delay risk note (null for LOCAL_BUY)" }
        withdrawKey: { type: string, nullable: true, description: "the Kraken whitelist name used for a transfer" }
    RebalancePlan:
      type: object
      required: [plannedAt, routesConsidered, caps, actions, note]
      properties:
        plannedAt: { type: string }
        routesConsidered: { type: integer }
        caps:
          type: array
          items: { $ref: "#/components/schemas/RebalanceVenueCaps" }
        actions:
          type: array
          items: { $ref: "#/components/schemas/RebalanceAction" }
        latch: { type: string, nullable: true, description: "durable reconciliation latch — an earlier order's outcome is unverified; the engine refuses to arm/act until cleared. null when unset. Shown verbatim." }
        rolling24hSpendUsd: { type: number, description: "USD spent in the trailing rolling 24h (survives restarts)" }
        note: { type: string, description: "verbatim planning note — must be shown as-is" }
    RebalanceReserves:
      type: object
      properties:
        kraken: { type: number, minimum: 0, default: 0 }
        coinbase: { type: number, minimum: 0, default: 0 }
        gemini: { type: number, minimum: 0, default: 0 }
    RebalanceArmRequest:
      type: object
      description: Optional per-venue credentials plus engine safety limits.
      properties:
        krakenKey: { type: string }
        krakenSecret: { type: string }
        coinbaseKey: { type: string }
        coinbaseSecret: { type: string }
        geminiKey: { type: string }
        geminiSecret: { type: string }
        perActionCapUsd: { type: number, default: 15, maximum: 25, description: "max USD notional per action (hard ceiling 25)" }
        dailyCapUsd: { type: number, default: 30, maximum: 100, description: "rolling daily USD cap" }
        reservesUsd: { $ref: "#/components/schemas/RebalanceReserves" }
    RebalanceArmed:
      type: object
      required: [armed]
      properties:
        armed: { type: boolean }
    RebalanceClearLatchRequest:
      type: object
      required: [confirm]
      properties:
        confirm: { type: boolean, enum: [true], description: "must be true — explicit acknowledgement you checked the exchange first" }
    RebalanceClearLatchResult:
      type: object
      required: [cleared]
      properties:
        cleared: { type: boolean }
    RebalanceConfig:
      type: object
      required: [perActionCapUsd, dailyCapUsd, reservesUsd]
      properties:
        perActionCapUsd: { type: number }
        dailyCapUsd: { type: number }
        reservesUsd: { $ref: "#/components/schemas/RebalanceReserves" }
    RebalanceLogEntry:
      type: object
      required: [at, kind, asset, toVenue, qty, status, detail]
      properties:
        at: { type: string }
        kind: { type: string, description: "LOCAL_BUY | TRANSFER | ARM | STOP | CLEAR_LATCH" }
        asset: { type: string }
        fromVenue: { type: string, nullable: true }
        toVenue: { type: string }
        qty: { type: number }
        notionalUsd: { type: number, nullable: true }
        feeUsd: { type: number, nullable: true }
        status: { type: string, description: "done | partial | failed | skipped | refused" }
        detail: { type: string }
        orderId: { type: string, nullable: true }
    RebalanceStatus:
      type: object
      required: [armed, dailyUsedUsd, ticks, actionsDone, log]
      properties:
        armed: { type: boolean }
        pausedReason: { type: string, nullable: true, description: "engine paused itself (e.g. after a failed action) — shown as a loud alert" }
        latch: { type: string, nullable: true, description: "durable reconciliation latch — an earlier order's outcome is unverified; the engine refuses to arm/act until cleared. null when unset. Shown verbatim." }
        cfg:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/RebalanceConfig" }]
        dailyUsedUsd: { type: number, description: "USD spent in the trailing rolling 24h (survives restarts), NOT calendar-day" }
        ticks: { type: integer }
        actionsDone: { type: integer }
        log:
          type: array
          description: "recent activity log, newest first (≤100)"
          items: { $ref: "#/components/schemas/RebalanceLogEntry" }
    HunterOpp:
      type: object
      properties:
        key: { type: string }
        strategy: { type: string, description: "spot-cross | maker-hedge | stablecoin | perp-funding" }
        asset: { type: string }
        venues: { type: string }
        description: { type: string }
        requirement: { type: string }
        category: { type: string, description: "EXECUTABLE_NOW | NEEDS_ACCOUNT_OR_INVENTORY | NOT_PROFITABLE" }
        executableKnown: { type: boolean }
        appearances: { type: integer }
        sampledTicks: { type: integer }
        frequencyPct: { type: number }
        longestSurvivalSec: { type: number }
        best10: { type: number, nullable: true }
        worst10: { type: number, nullable: true }
        avg10: { type: number, nullable: true }
        last10: { type: number, nullable: true }
        last50: { type: number, nullable: true }
        last100: { type: number, nullable: true }
        executableNowTicks: { type: integer }
        firstSeenAt: { type: string }
        lastSeenAt: { type: string }
        score: { type: number }
    HunterReport:
      type: object
      properties:
        running: { type: boolean }
        startedAt: { type: string, nullable: true }
        endsAt: { type: string, nullable: true }
        lastTickAt: { type: string, nullable: true }
        ticks: { type: integer }
        lastTickMs: { type: integer }
        feeSource: { type: string }
        stopReason: { type: string, nullable: true }
        tracked: { type: integer }
        errors:
          type: array
          items: { type: string }
        verdict: { type: string }
        strategyBest:
          type: array
          items: { $ref: "#/components/schemas/HunterOpp" }
        top:
          type: array
          items: { $ref: "#/components/schemas/HunterOpp" }
    FeeTierRequest:
      type: object
      required: [krakenKey, krakenSecret]
      properties:
        krakenKey: { type: string }
        krakenSecret: { type: string }

    AccountPnlRequest:
      type: object
      required: [krakenKey, krakenSecret]
      properties:
        krakenKey: { type: string }
        krakenSecret: { type: string }
        coinbaseKey: { type: string }
        coinbaseSecret: { type: string }
    AccountPnlResult:
      type: object
      required: [startingValueUsd, startedAt, currentValueUsd, usdBalance, unrealizedHoldingsUsd, realizedTodayUsd, lifetimePnlUsd, cashFlowAdjusted, netCashFlowTodayUsd, equityChangeUsd, netCashFlowUsd, tradingPnlUsd, tradedFillCount, unrealizedPnlUsd, cashFlowNote, krakenValueUsd, coinbaseValueUsd, includesCoinbase, snapshotCount, unpricedAssets]
      properties:
        startingValueUsd: { type: number }
        startedAt: { type: string }
        currentValueUsd: { type: number }
        usdBalance: { type: number }
        unrealizedHoldingsUsd: { type: number }
        realizedTodayUsd:
          type: number
          description: "Equity change since today's baseline, minus external deposits/withdrawals when the ledger was fetchable (see cashFlowAdjusted)"
        lifetimePnlUsd:
          type: number
          description: "Equity change since the first baseline, minus external deposits/withdrawals when the ledger was fetchable (see cashFlowAdjusted)"
        cashFlowAdjusted:
          type: boolean
          description: "True when realizedTodayUsd and lifetimePnlUsd exclude external deposits/withdrawals; false when the ledger couldn't be verified and the numbers are raw equity changes"
        netCashFlowTodayUsd:
          type: number
          nullable: true
          description: "External deposits − withdrawals since today's baseline; null when unknowable"
        equityChangeUsd:
          type: number
          description: "Total change in everything owned since baseline (current − starting)"
        netCashFlowUsd:
          type: number
          nullable: true
          description: "External deposits − withdrawals since baseline (Kraken Ledgers); null when unknowable (ledger unavailable/incomplete, or Coinbase included) — attribution withheld"
        tradingPnlUsd:
          type: number
          description: "Sum of per-trade realized profits from live filled executions"
        tradedFillCount: { type: integer }
        unrealizedPnlUsd:
          type: number
          nullable: true
          description: "Residual: equityChange − cashFlow − tradingPnl ≈ price drift on held coins; null when cash flows are unknowable"
        cashFlowNote: { type: string, nullable: true }
        krakenValueUsd:
          type: number
          description: "Kraken portion of currentValueUsd (cash + holdings at live tickers)"
        coinbaseValueUsd:
          type: number
          nullable: true
          description: "Coinbase portion of currentValueUsd; null when Coinbase credentials were not provided"
        includesCoinbase: { type: boolean }
        snapshotCount: { type: integer }
        unpricedAssets:
          type: array
          items: { type: string }
    ExecutionQualityRoute:
      type: object
      required: [route, style, attempts, liveAttempts, liveFillRate, avgExpectedProfitUsd, avgRealizedProfitUsd, avgShortfallUsd, avgSlippagePct, totalRealizedProfitUsd, lastAttemptAt]
      properties:
        route: { type: string }
        style: { type: string, enum: [taker, maker] }
        attempts: { type: integer }
        liveAttempts: { type: integer }
        liveFillRate: { type: number, nullable: true }
        avgExpectedProfitUsd: { type: number, nullable: true }
        avgRealizedProfitUsd: { type: number, nullable: true }
        avgShortfallUsd: { type: number, nullable: true }
        avgSlippagePct: { type: number, nullable: true }
        totalRealizedProfitUsd: { type: number, nullable: true }
        lastAttemptAt: { type: string }
        legsTracked: { type: integer, description: "Live attempts with per-leg diagnostics recorded (denominator for the leg fill rates)." }
        leg1FillRate: { type: number, nullable: true, description: "Share of tracked live attempts where leg 1 confirmed filled; null when no per-leg data yet." }
        leg2FillRate: { type: number, nullable: true, description: "Share of tracked live attempts where legs 1–2 confirmed filled." }
        leg3FillRate: { type: number, nullable: true, description: "Share of tracked live attempts where the FULL 3-leg cycle confirmed filled." }
    ExecutionQualityResult:
      type: object
      required: [routes, totalRecords]
      properties:
        routes:
          type: array
          items: { $ref: "#/components/schemas/ExecutionQualityRoute" }
        totalRecords: { type: integer }
    ExecutionStatusResult:
      type: object
      required: [active, route, leg, legLabel, pair, orderId, attempt, maxAttempts, startedAtMs, timeoutMs, filledPct, phase, elapsedMs, updatedAtMs]
      properties:
        active: { type: boolean }
        route: { type: string, nullable: true }
        leg: { type: integer, nullable: true }
        legLabel: { type: string, nullable: true }
        pair: { type: string, nullable: true }
        orderId: { type: string, nullable: true }
        attempt: { type: integer, nullable: true }
        maxAttempts: { type: integer, nullable: true }
        startedAtMs: { type: number, nullable: true }
        timeoutMs: { type: number, nullable: true }
        filledPct: { type: number, nullable: true }
        phase: { type: string, nullable: true }
        orderPrice: { type: number, nullable: true }
        bestBid: { type: number, nullable: true }
        bestAsk: { type: number, nullable: true }
        queueAheadVol: { type: number, nullable: true }
        reprices: { type: integer, nullable: true }
        elapsedMs: { type: number, nullable: true }
        updatedAtMs: { type: number }
        nonceHealth: { $ref: "#/components/schemas/KrakenNonceHealth" }
    KrakenNonceHealth:
      type: object
      description: >
        Kraken API-key nonce health for THIS server process. Repeated
        "EAPI:Invalid nonce" errors mean another process (e.g. the published
        app and the dev workspace) is using the same Kraken API key — the two
        interleave nonces and share one rate budget. Run the bot from one
        environment at a time or use a separate key per environment.
      required: [concurrentUseSuspected, recentNonceErrors, totalNonceErrors, lastNonceErrorAtMs, hint]
      properties:
        concurrentUseSuspected: { type: boolean }
        recentNonceErrors: { type: integer }
        totalNonceErrors: { type: integer }
        lastNonceErrorAtMs: { type: number, nullable: true }
        hint: { type: string, nullable: true }
    FeeTierResult:
      type: object
      required: [takerFeePct, makerFeePct, source]
      properties:
        takerFeePct: { type: number, nullable: true }
        makerFeePct: { type: number, nullable: true }
        source: { type: string, enum: [account, unavailable] }

    GraphRouteHop:
      type: object
      required: [from, to, exchange, pair, side, amountIn, amountOut, feePct, limitPrice]
      properties:
        from: { type: string }
        to: { type: string }
        exchange: { type: string, enum: [kraken, coinbase, gemini, bridge] }
        pair: { type: string }
        side: { type: string, enum: [buy, sell, bridge] }
        amountIn: { type: number }
        amountOut: { type: number }
        feePct: { type: number }
        limitPrice: { type: number }
        streamed: { type: boolean, description: "true = leg priced from a LIVE stream book; false = REST fallback" }

    GraphRoute:
      type: object
      required: [hops, description, startUsd, grossProfitUsd, feeUsd, netProfitUsd, profitPct, slippagePct, status, executable]
      properties:
        hops:
          type: array
          items: { $ref: "#/components/schemas/GraphRouteHop" }
        description: { type: string }
        startUsd: { type: number }
        grossProfitUsd: { type: number }
        feeUsd: { type: number }
        netProfitUsd: { type: number }
        profitPct: { type: number }
        slippagePct: { type: number }
        status: { type: string, enum: [VIABLE, REJECTED, "PRICING CONSISTENCY ERROR"] }
        executable:
          type: boolean
          description: "True when the live executor supports this route shape (Kraken triangle or 2-leg cross-exchange). Unsupported shapes are dry-run only."
        histLiveAttempts:
          type: integer
          description: "Recent live execution attempts recorded for this route+style (max 20 considered)."
        histFillRate:
          type: number
          nullable: true
          description: "Historical live fill rate 0..1; null until the route has ≥10 live attempts (insufficient history to judge)."
        quoteAgeMs:
          type: number
          nullable: true
          description: "Age (ms) of the streamed book snapshot this route's netProfitUsd was priced from; null when stream pricing was unavailable"
        pricedFrom:
          type: string
          nullable: true
          description: "Pricing source for netProfitUsd: 'stream' = executor-grade simulator on live streamed books (matches the pre-fire math exactly); 'graph' = graph engine estimate (stream unavailable)"
        effectiveScoreUsd:
          type: number
          description: "Ranking score: net profit × historical fill rate (0.7 neutral prior when history is insufficient). Approximates expected realized profit."
        researchReason:
          type: string
          nullable: true
          description: "Non-null when NOT executable — an honest reason the route is research-only (e.g. Gemini scan-only, unsupported shape, REST-priced, fees assumed). Shown verbatim."
        hasGeminiLeg:
          type: boolean
          description: "true when the route contains at least one Gemini hop. Such routes are ALWAYS research-only (executable:false) — the graph executor has no Gemini wiring. Additive; K/CB routes leave it false."
        geminiFeesDetected:
          type: boolean
          nullable: true
          description: "whether Gemini fees on this route were DETECTED (keys present) or ASSUMED. null when the route has no Gemini hop."
        geminiBookAgeMs:
          type: number
          nullable: true
          description: "age (ms) of the OLDEST Gemini leg's live l2 book, measured from LOCAL ARRIVAL (Gemini l2 carries no exchange timestamp). null when no Gemini hop."
        geminiBookAgeCaveat:
          type: string
          nullable: true
          description: "honest freshness caveat for the Gemini book age. null when no Gemini hop. Shown verbatim in the route tooltip."

    GraphScanResult:
      type: object
      required: [routes, tradeSizeUsd, krakenFeesPct, coinbaseFeesPct, executionStyle, assetsScanned, routesEvaluated, scannedAt]
      properties:
