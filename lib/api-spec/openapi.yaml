          nullable: true
          allOf: [{ $ref: "#/components/schemas/DiscoveryRow" }]
        bestNearMiss:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/DiscoveryRow" }]
        sizes:
          type: array
          items: { type: number }
        executionCapUsd: { type: number }
        feesNote: { type: string }
        credNote: { type: string, nullable: true }
        venues:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              quote: { type: string }
              assumedTakerPct: { type: number }
              assumedMakerPct: { type: number }
              regionOk: { type: boolean }
              candidate: { type: boolean }
              accessNote: { type: string, nullable: true }
              status: { type: string }
              assetsCovered: { type: integer }
        coinbaseFeeDrag: { type: integer }
        summary: { type: string }
        gemini:
          type: object
          nullable: true
          description: "Gemini account status when keys are provided — read-only; live Gemini trading is never enabled"
          properties:
            connected: { type: boolean }
            makerPct: { type: number, nullable: true }
            takerPct: { type: number, nullable: true }
            usdBalance: { type: number, nullable: true }
            note: { type: string, nullable: true }
        candidateRoutes:
          type: array
          description: "routes touching PR-accessible candidate venues (Gemini, Crypto.com) — public-data discovery with entry-tier maker analysis; never executable until API access is connected + verified"
          items: { $ref: "#/components/schemas/DiscoveryRow" }
        executableNow:
          type: array
          items: { $ref: "#/components/schemas/DiscoveryRow" }
        requiresSetup:
          type: array
          items: { $ref: "#/components/schemas/DiscoveryRow" }
        notProfitable:
          type: array
          items: { $ref: "#/components/schemas/DiscoveryRow" }
    XvScanRequest:
      type: object
      description: >
        Optional per-venue credentials. Providing a venue's keys upgrades its
        fees from ASSUMED (labeled) to DETECTED and verifies its balances.
        A route only ever FIREs when both legs' fees are DETECTED.
      properties:
        krakenKey: { type: string }
        krakenSecret: { type: string }
        coinbaseKey: { type: string }
        coinbaseSecret: { type: string }
        geminiKey: { type: string }
        geminiSecret: { type: string }
    XvProjection:
      type: object
      description: One priced size candidate for a route (buffer is shown separately, not folded into netProfitUsd).
      required:
        - sizeUsd
        - grossSpreadUsd
        - feesUsd
        - slippageUsd
        - bufferUsd
        - netProfitUsd
        - netAfterBufferUsd
        - baseQty
        - quoteAgeMs
        - buyAgeMs
        - sellAgeMs
        - feasible
      properties:
        sizeUsd: { type: number }
        grossSpreadUsd: { type: number, description: "raw edge at top-of-book for this size" }
        feesUsd: { type: number }
        slippageUsd: { type: number }
        bufferUsd: { type: number }
        netProfitUsd: { type: number, description: "after fees + slippage (buffer NOT subtracted)" }
        netAfterBufferUsd: { type: number, description: "the number that must clear the floor" }
        baseQty: { type: number }
        quoteAgeMs: { type: number, description: "age of the oldest leg" }
        buyAgeMs: { type: number }
        sellAgeMs: { type: number, description: "for a Gemini leg this is measured from local arrival (no exchange timestamp)" }
        feasible: { type: boolean, description: "balances + exchange minimums allow this size" }
        infeasibleWhy: { type: string, nullable: true, description: "verbatim reason this size is not feasible (null when feasible)" }
    XvVenueStatus:
      type: object
      required: [id, feeSource, takerPct, streaming]
      properties:
        id: { type: string, description: "kraken | coinbase | gemini" }
        feeSource: { type: string, description: "detected | assumed" }
        takerPct: { type: number, description: "per-leg taker fee percent (DETECTED tier, or a labeled ASSUMED default)" }
        usd: { type: number, nullable: true, description: "spendable USD balance (null = unknown, keys not provided)" }
        error: { type: string, nullable: true, description: "fee/balance detection failure — never silently downgraded for live decisions" }
        streaming: { type: boolean, description: "live book stream connected (Gemini reflects its own WS state)" }
    XvRoute:
      type: object
      required:
        - asset
        - buyVenue
        - sellVenue
        - usdRoute
        - stable
        - decision
        - reason
        - feeSourceBuy
        - feeSourceSell
        - buyTakerPct
        - sellTakerPct
        - projections
      properties:
        asset: { type: string }
        buyVenue: { type: string, description: "kraken | coinbase | gemini" }
        sellVenue: { type: string, description: "kraken | coinbase | gemini" }
        usdRoute: { type: boolean, description: "all-USD quotes — no basis haircut" }
        stable: { type: boolean, description: "USDC stablecoin rotation route" }
        decision: { type: string, description: "FIRE | SKIP — FIRE requires detected fees on both legs, fresh books, positive net, and verified feasible balances" }
        reason: { type: string, description: "verbatim decision reason — SKIP reasons must be shown as-is" }
        feeSourceBuy: { type: string, description: "detected | assumed" }
        feeSourceSell: { type: string, description: "detected | assumed" }
        buyTakerPct: { type: number }
        sellTakerPct: { type: number }
        best:
          nullable: true
          description: best net across all candidate sizes (may be infeasible)
          allOf: [{ $ref: "#/components/schemas/XvProjection" }]
        bestFeasible:
          nullable: true
          description: best net across only the sizes balances/minimums allow (null when none feasible)
          allOf: [{ $ref: "#/components/schemas/XvProjection" }]
        projections:
          type: array
          items: { $ref: "#/components/schemas/XvProjection" }
        requiredBalances:
          type: object
          nullable: true
          properties:
            buyUsd: { type: number }
            sellAssetQty: { type: number }
        balancesOk: { type: boolean, nullable: true, description: "null = unknown (keys missing)" }
        minNotionalUsd: { type: number, nullable: true, description: "exchange-minimum notional for this pair when known (Gemini legs)" }
        blocker: { type: string, description: "plain-English FIRST current blocker or READY label, e.g. 'STALE KRAKEN BOOK 2572ms', 'NEED 4.08M BONK ON KRAKEN', 'GEMINI BALANCE UNVERIFIED', 'KRAKEN FEES ASSUMED — CONNECT KEYS', 'NET NEGATIVE AFTER COSTS', 'READY TO FIRE', 'READY TO AUTO-FIRE'" }
    XvScanResult:
      type: object
      required: [scannedAt, params, venues, fireCount, routes, note]
      properties:
        scannedAt: { type: string }
        params:
          type: object
          properties:
            minNetUsd: { type: number }
            maxQuoteAgeMs: { type: number }
            execCapUsd: { type: number }
            candidateSizes:
              type: array
              items: { type: number }
        venues:
          type: array
          items: { $ref: "#/components/schemas/XvVenueStatus" }
        fireCount: { type: integer }
        routes:
          type: array
          items: { $ref: "#/components/schemas/XvRoute" }
        note: { type: string }
    XvExecuteRequest:
      type: object
      required: [asset, buyVenue, sellVenue]
      description: Route to execute plus the credentials for BOTH venues (detected fees are mandatory for a live run).
      properties:
        krakenKey: { type: string }
        krakenSecret: { type: string }
        coinbaseKey: { type: string }
        coinbaseSecret: { type: string }
        geminiKey: { type: string }
        geminiSecret: { type: string }
        asset: { type: string }
        buyVenue: { type: string, enum: [kraken, coinbase, gemini] }
        sellVenue: { type: string, enum: [kraken, coinbase, gemini] }
        sizeUsd: { type: number, description: "clamped to [1, 10] — the $10 hard cap is enforced server-side" }
        minNetUsd: { type: number }
        maxQuoteAgeMs: { type: number }
    XvLegResult:
      type: object
      required: [venue, status, filledQty, latencyMs]
      properties:
        venue: { type: string, description: "kraken | coinbase | gemini" }
        orderId: { type: string, nullable: true }
        status: { type: string }
        filledQty: { type: number, description: "CONFIRMED fill quantity — the only source of truth" }
        avgPrice: { type: number, nullable: true }
