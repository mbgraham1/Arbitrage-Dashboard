      properties:
        krakenKey: { type: string }
        krakenSecret: { type: string }
        coinbaseKey: { type: string }
        coinbaseSecret: { type: string }
        geminiKey: { type: string }
        geminiSecret: { type: string }
        minNetUsd: { type: number, description: "net-after-buffer floor a route must clear to auto-fire" }
        maxQuoteAgeMs: { type: number, description: "tighten-only; clamped to the 200ms hard gate" }
    XvAutoStartResult:
      type: object
