openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: CAT Arbitrage Dashboard API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: exchange
    description: Exchange price and balance operations
  - name: trades
    description: Trade execution and history
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /prices:
    post:
      operationId: fetchPrices
      tags: [exchange]
      summary: Fetch live prices from both exchanges
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeCredentials"
      responses:
        "200":
          description: Current prices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceData"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Exchange fetch error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /balances:
    post:
      operationId: fetchBalances
      tags: [exchange]
      summary: Fetch balances from both exchanges
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeCredentials"
      responses:
        "200":
          description: Current balances
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceData"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Exchange fetch error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /credentials/preloaded:
    get:
      operationId: getPreloadedCredentials
      tags: [exchange]
      summary: Read API credentials from server environment variables (Replit Secrets)
      responses:
        "200":
          description: Credentials loaded from env vars (empty string if not set)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreloadedCredentials"

  /test-kraken:
    post:
      operationId: testKraken
      tags: [exchange]
      summary: Test Kraken connection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KrakenCredentials"
      responses:
        "200":
          description: Connection test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionTestResult"
        "400":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /test-coinbase:
    post:
      operationId: testCoinbase
      tags: [exchange]
      summary: Test Coinbase connection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoinbaseCredentials"
      responses:
        "200":
          description: Connection test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionTestResult"
        "400":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /execute-trade:
    post:
      operationId: executeTrade
      tags: [trades]
      summary: Execute an arbitrage trade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradeRequest"
      responses:
        "200":
          description: Trade result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Trade execution error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /trades:
    get:
      operationId: listTrades
      tags: [trades]
      summary: Get trade history
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Trade history list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TradeRecord"

  /prices/all-pairs:
    get:
      operationId: getAllPairSnapshots
      tags: [exchange]
      summary: Return cached bid/ask for all 10 pairs without REST fallbacks
      description: >
        Reads the in-memory price cache for all 10 configured pairs and returns
        every pair — including those with stale or missing data. Kraken and
        Coinbase bid/ask fields are null when no fresh data is available (> 30 s
        old), allowing the UI to render a "—" placeholder. Sorted by gross spread
        descending; no-data pairs go last.
      responses:
        "200":
          description: Snapshot for all 10 pairs (some fields may be null when data is stale)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AllPairSnapshot"

  /arb/scan:
    get:
      operationId: scanAllPairs
      tags: [exchange]
      summary: Scan all 10 pairs and rank by cross-exchange gross spread
      description: >
        Port of Python scan_all_coins(). Fetches bid/ask for all 10 configured
        pairs from Kraken and Coinbase and returns them sorted by gross spread
        (best direction per pair) descending. Net edge = grossSpreadPct minus
        the client's fee + slippage settings.
      responses:
        "200":
          description: All pairs ranked by gross spread descending
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PairScanEntry"
        "500":
          description: Price fetch error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /arb/cointegration:
    get:
      operationId: scanCointegrationArb
      tags: [exchange]
      summary: Run Kalman-filter cointegration scan and return mean-reversion signals
      description: >
        Fetches mid-prices for SOL, ETH, BTC, AVAX, and DOT from the in-memory
        cache, updates each pair's Kalman-filter spread history, and returns any
        pairs whose |z-score| ≥ 2.0. Returns an empty signals array when
        observations are insufficient or no pair is out-of-range.
      responses:
        "200":
          description: Cointegration scan result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CointegrationScanResult"
        "500":
          description: Scan error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /arb/triangular:
    get:
      operationId: scanTriangularArb
      tags: [exchange]
      summary: Scan for triangular arbitrage opportunities within each exchange
      description: >
        Checks USDT→SOL→ETH→USDT and USDT→ETH→SOL→USDT loops on Kraken and
        Coinbase using live bid/ask prices. Returns opportunities where the
        loop product after fees exceeds the 0.1% profit threshold.
      responses:
        "200":
          description: Triangular arbitrage scan results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriangularScanResult"
        "500":
          description: Price fetch error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /arb/ob-scan:
    get:
      operationId: getObScan
      tags: [arb]
      summary: Scan triangular cycles across 34 assets using L2 order book depth (v18 port)
      description: >
        Port of Python v18 "Scaling Analyzer" (v17 wide-net scan plus a scaling
        table — the top-ranked route is re-simulated at $10/$50/$100/$500/$1,000
        with VIABLE / HIGH_SLIPPAGE / REJECTED statuses; the min-profit threshold
        scales with size/10). Fetches Kraken Depth API for all
        required pairs in parallel, then walks the book for each A→B permutation
        of 34 assets (only routes with a real Kraken cross pair
        are simulatable) to compute realistic fill prices at the given trade size.
        An optional volatility filter restricts the scan to assets that moved more
        than 1.5% in 24h (falls back to all assets when fewer than 3 qualify).
        All simulatable cycles (top 15) are returned ranked by estimated net
        profit, each with total execution slippage, a liquidity confidence score,
        and a READY / HIGH_SLIPPAGE / LOW_PROFIT status classification.
      parameters:
        - name: tradeSizeUsd
          in: query
          description: Simulated trade size in USD (default 10)
          schema: {type: number, default: 10}
        - name: feesPct
          in: query
          description: Estimated total fees % (default 0.5 — 3 legs × 0.16% maker)
          schema: {type: number, default: 0.5}
        - name: minProfitUsd
          in: query
          description: Minimum net profit ($) required for READY status at $10 (default 0.02 — v18; scaled by size/10 in the scaling table)
          schema: {type: number, default: 0.02}
        - name: maxSlippagePct
          in: query
          description: Maximum tolerated total slippage (%) for READY status (default 0.5)
          schema: {type: number, default: 0.5}
        - name: volatilityFilter
          in: query
          description: v17 — scan only assets with |24h change| > 1.5% (default true; falls back to all assets when fewer than 3 qualify)
          schema: {type: boolean, default: true}
      responses:
        "200":
          description: Ranked cycle list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObScanResult"
        "500":
          description: Scan error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /arb/ob-execute:
    post:
      operationId: obExecute
      tags: [trades]
      summary: Manually execute the top Order Book Hunter route (v18 port)
      description: >
        Port of the Python v18 MANUAL EXECUTION BUTTON. Re-fetches fresh order
        books for the route (cache bypassed), re-simulates the cycle
        (pre-flight), and only places 3 sequential Kraken market orders when
        the fresh profit exceeds minProfitUsd × (size/10). Dry-run records a
        ledger row without placing orders. Legs are sized from the pre-flight
        simulation with orientation-aware cross-pair sides.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObExecuteRequest"
      responses:
        "200":
          description: Execution (or pre-flight rejection) result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObExecuteResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /arb/execution-quality:
    get:
      operationId: getExecutionQuality
      tags: [trades]
      summary: Per-route execution quality aggregates (fill rate, expected vs realized profit)
      responses:
        "200":
          description: Aggregated execution-quality records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionQualityResult"
  /arb/fee-tier:
    post:
      operationId: getFeeTier
      tags: [trades]
      summary: Look up the account's actual Kraken taker fee tier
      description: >
        Queries Kraken /0/private/TradeVolume for the caller's real taker fee
        on major pairs (max across pairs). Returns null when the query fails
        (bad keys, network) so callers can fall back to their configured
        assumption.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeeTierRequest"
      responses:
        "200":
          description: Actual taker fee (percent per leg) or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeeTierResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /arb/graph-scan:
    get:
      operationId: getGraphScan
      tags: [trades]
      summary: Multi-exchange graph opportunity scan
      description: >
        Builds a directed graph over Kraken (34 assets + verified cross pairs)
        and Coinbase (shared assets), DFS-searches all USD→…→USD cycles up to
        maxHops, and ranks routes by net profit after per-leg fees.
      parameters:
        - { name: tradeSizeUsd,    in: query, schema: { type: number, default: 10 } }
        - { name: krakenFeesPct,   in: query, schema: { type: number, default: 0.16 } }
        - { name: coinbaseFeesPct, in: query, schema: { type: number, default: 0.4 } }
        - { name: maxHops,         in: query, schema: { type: integer, default: 4 } }
        - { name: executionStyle,  in: query, schema: { type: string, enum: [taker, maker], default: taker } }
      responses:
        "200":
          description: Ranked routes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphScanResult"
        "500":
          description: Scan error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /arb/graph-execute:
    post:
      operationId: graphExecute
      tags: [trades]
      summary: Manually execute an Opportunity Engine route
      description: >
        Re-runs a fresh graph scan (pre-flight), locates the requested route
        (or the top route), and gates on fresh net profit > minProfitUsd.
        Kraken-only triangles reuse the ob-execute 3-leg post-only limit
        machinery (fill confirm + unwind); 2-leg cross-exchange inventory
        routes place both market orders in parallel (requires inventory on
        both venues). Other shapes execute as dry-run only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GraphExecuteRequest"
      responses:
        "200":
          description: Execution (or pre-flight rejection) result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphExecuteResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /arb/execute-triangular:
    post:
      operationId: executeTriangular
      tags: [trades]
      summary: Execute a BTC/SOL/USD triangular loop on Kraken
      description: >
        Port of Python v13 FORCE TRIANGULAR. Places 3 sequential market orders on Kraken
        for either the USD→BTC→SOL→USD or USD→SOL→BTC→USD loop. In dry-run mode only
        computes the estimated profit without placing orders. Trade size defaults to 10 USD
        (dry/force) or 20% of USD balance capped at $50 (auto-loop).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriExecuteRequest"
      responses:
        "200":
          description: Execution result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriExecuteResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Execution error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /trades/summary:
    get:
      operationId: getTradeSummary
      tags: [trades]
      summary: Get P&L summary and statistics
      responses:
        "200":
          description: P&L summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeSummary"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    KrakenCredentials:
      type: object
      required: [krakenKey, krakenSecret]
      properties:
        krakenKey:
          type: string
        krakenSecret:
          type: string

    CoinbaseCredentials:
      type: object
      required: [coinbaseKey, coinbaseSecret]
      properties:
        coinbaseKey:
          type: string
        coinbaseSecret:
          type: string

    ExchangeCredentials:
      type: object
      required: [krakenKey, krakenSecret, coinbaseKey, coinbaseSecret]
      properties:
        krakenKey:
          type: string
        krakenSecret:
          type: string
        coinbaseKey:
          type: string
        coinbaseSecret:
          type: string
        enabledPairs:
          type: array
          items:
            type: string
          description: "Optional allow-list of pair symbols to scan (e.g. ['SOL/USD', 'BTC/USD']). Scans all pairs when omitted."

    WsStatus:
      type: object
      required: [kraken, coinbase]
      properties:
        kraken:
          type: boolean
        coinbase:
          type: boolean

    PriceData:
      type: object
      required: [krakenPrice, krakenBid, krakenAsk, coinbasePrice, coinbaseBid, coinbaseAsk, grossSpreadPct, netEdgePct, route, timestamp, bestBuyExchange, bestSellExchange, buyPrice, sellPrice, executable, wsStatus]
      properties:
        pair:
          type: string
          description: "Canonical pair symbol with the best spread (e.g. SOL/USD, BTC/USD)"
        krakenPrice:
          type: number
        krakenBid:
          type: number
        krakenAsk:
          type: number
        coinbasePrice:
          type: number
        coinbaseBid:
          type: number
        coinbaseAsk:
          type: number
        binancePrice:
          type: number
          nullable: true
        kuCoinPrice:
          type: number
          nullable: true
        grossSpreadPct:
          type: number
        netEdgePct:
          type: number
        route:
          type: string
        buyExchange:
          type: string
        sellExchange:
          type: string
        bestBuyExchange:
          type: string
        bestSellExchange:
          type: string
        buyPrice:
          type: number
        sellPrice:
          type: number
        executable:
          type: boolean
        wsStatus:
          $ref: "#/components/schemas/WsStatus"
        timestamp:
          type: string

    BalanceEntry:
      type: object
      required: [currency, amount]
      properties:
        currency:
          type: string
        amount:
          type: number

    BalanceData:
      type: object
      required: [kraken, coinbase]
      properties:
        kraken:
          type: array
          items:
            $ref: "#/components/schemas/BalanceEntry"
        coinbase:
          type: array
          items:
            $ref: "#/components/schemas/BalanceEntry"
        solOnKraken:
          type: number
        solOnCoinbase:
          type: number
        usdOnCoinbase:
          type: number
        suggestedVolume:
          type: number

    PreloadedCredentials:
      type: object
      required: [krakenKey, krakenSecret, coinbaseKey, coinbaseSecret, anyLoaded]
      properties:
        krakenKey:
          type: string
        krakenSecret:
          type: string
        coinbaseKey:
          type: string
        coinbaseSecret:
          type: string
        anyLoaded:
          type: boolean

    ConnectionTestResult:
      type: object
      required: [ok, message]
      properties:
        ok:
          type: boolean
        message:
          type: string
        balances:
          type: array
          items:
            $ref: "#/components/schemas/BalanceEntry"

    TradeRequest:
      type: object
      required: [krakenKey, krakenSecret, coinbaseKey, coinbaseSecret, buyExchange, sellExchange, volume, krakenPrice, coinbasePrice, liveMode]
      properties:
        krakenKey:
          type: string
        krakenSecret:
          type: string
        coinbaseKey:
          type: string
        coinbaseSecret:
          type: string
        buyExchange:
          type: string
        sellExchange:
          type: string
        volume:
          type: number
        krakenPrice:
          type: number
        coinbasePrice:
          type: number
        liveMode:
          type: boolean
        netEdgePct:
          type: number
        orderType:
          type: string
          enum: [market, limit]
          default: market
        pair:
          type: string
          description: "Trading pair symbol (e.g. SOL/USD, BTC/USD). Defaults to SOL/USD."

    TradeResult:
      type: object
      required: [success, isDryRun, estimatedProfitUsd, tradeNumber]
      properties:
        success:
          type: boolean
        isDryRun:
          type: boolean
        skipped:
          type: boolean
          description: "True when the trade was skipped (e.g. insufficient balance) rather than executed or failed"
        estimatedProfitUsd:
          type: number
        tradeNumber:
          type: integer
        buyOrderId:
          type: ["string", "null"]
        sellOrderId:
          type: ["string", "null"]
        error:
          type: ["string", "null"]

    TradeRecord:
      type: object
      required: [id, createdAt, buyExchange, sellExchange, volumeSol, estimatedProfitUsd, netEdgePct, isDryRun, krakenPrice, coinbasePrice]
      properties:
        id:
          type: integer
        createdAt:
          type: string
        pair:
          type: ["string", "null"]
          description: "Trading pair symbol (e.g. SOL/USD, BTC/USD). Null for records before multi-pair support."
        buyExchange:
          type: string
        sellExchange:
          type: string
        volumeSol:
          type: number
        estimatedProfitUsd:
          type: number
        netEdgePct:
          type: number
        isDryRun:
          type: boolean
        krakenPrice:
          type: number
        coinbasePrice:
          type: number
        buyOrderId:
          type: ["string", "null"]
        sellOrderId:
          type: ["string", "null"]

    AllPairSnapshot:
      type: object
      required: [pair, coin, grossSpreadPct, buyExchange, krakenBid, krakenAsk, coinbaseBid, coinbaseAsk]
      properties:
        pair:
          type: string
          description: "Canonical pair, e.g. BTC/USD"
        coin:
          type: string
          description: "Short coin symbol, e.g. BTC"
        krakenBid:
          type: ["number", "null"]
          description: "Kraken best bid; null when cache data is stale (> 30 s)"
        krakenAsk:
          type: ["number", "null"]
          description: "Kraken best ask; null when cache data is stale (> 30 s)"
        coinbaseBid:
          type: ["number", "null"]
          description: "Coinbase best bid; null when cache data is stale (> 30 s)"
        coinbaseAsk:
          type: ["number", "null"]
          description: "Coinbase best ask; null when cache data is stale (> 30 s)"
        grossSpreadPct:
          type: ["number", "null"]
          description: "Gross cross-exchange spread % (best direction); null when either side is missing"
        buyExchange:
          type: ["string", "null"]
          description: "Exchange to buy on for best spread; null when spread cannot be computed"

    PairScanEntry:
      type: object
      required: [coin, pair, krakenPrice, coinbasePrice, krakenBid, krakenAsk, coinbaseBid, coinbaseAsk, grossSpreadPct, buyExchange, sellExchange, scannedAt]
      properties:
        coin:
          type: string
          description: "Short coin symbol, e.g. BTC, ETH, SOL"
        pair:
          type: string
          description: "Canonical pair, e.g. BTC/USD"
        krakenPrice:
          type: number
        coinbasePrice:
          type: number
        krakenBid:
          type: number
        krakenAsk:
          type: number
        coinbaseBid:
          type: number
        coinbaseAsk:
          type: number
        grossSpreadPct:
          type: number
          description: "Gross cross-exchange spread % using bid/ask (best direction)"
        buyExchange:
          type: string
        sellExchange:
          type: string
        scannedAt:
          type: string

    ObCycleEntry:
      type: object
      required: [route, assetA, assetB, estimatedProfitUsd, profitPct, grossProfitUsd, feeUsd, avgPriceA, avgCrossRate, avgPriceB, volumeA, slippagePct, status, confidencePct]
      properties:
        route: {type: string, description: "e.g. USD→SOL→ETH→USD"}
        assetA: {type: string}
        assetB: {type: string}
        estimatedProfitUsd: {type: number}
        grossProfitUsd: {type: number, description: "raw triangle edge ($) before fees, slippage included"}
        feeUsd: {type: number, description: "total 3-leg fee drag ($) at the scan's per-leg fee rate"}
        profitPct: {type: number, description: "profit as % of tradeSizeUsd"}
        avgPriceA: {type: number, description: "average USD fill price for leg 1"}
        avgCrossRate: {type: number, description: "average B-per-A cross rate"}
        avgPriceB: {type: number, description: "average USD fill price for leg 3"}
        volumeA: {type: number, description: "amount of A acquired in leg 1"}
        slippagePct: {type: number, description: "total execution slippage across 3 legs (%)"}
        status:
          type: string
          enum: [READY, HIGH_SLIPPAGE, LOW_PROFIT]
          description: "v15 conservative classification"
        confidencePct: {type: number, description: "v17 liquidity confidence 0-100 — avg top-of-book coverage across the 3 legs"}

    ObScalingRow:
      type: object
      required: [sizeUsd, profitUsd, slippagePct, confidencePct, status]
      properties:
        sizeUsd: {type: number}
        profitUsd: {type: number}
        slippagePct: {type: number}
        confidencePct: {type: number}
        status:
          type: string
          enum: [VIABLE, HIGH_SLIPPAGE, REJECTED]
          description: "v18 — VIABLE when profit > minProfitUsd×(size/10) and slippage within limit"

    ObScanResult:
      type: object
      required: [cycles, tradeSizeUsd, feesPct, minProfitUsd, maxSlippagePct, readyCount, pairsScanned, pairsRequested, volatilityFilter, activeAssets, scalingRoute, scaling, scannedAt]
      properties:
        cycles:
          type: array
          items:
            $ref: "#/components/schemas/ObCycleEntry"
        tradeSizeUsd: {type: number}
        feesPct: {type: number}
        minProfitUsd: {type: number, description: "min net profit ($) for READY status"}
        maxSlippagePct: {type: number, description: "max tolerated total slippage (%) for READY status"}
        readyCount: {type: number, description: "number of READY cycles"}
        pairsScanned: {type: number, description: "pairs whose order book fetch succeeded"}
        pairsRequested: {type: number, description: "pairs the scan attempted to fetch"}
        volatilityFilter: {type: boolean, description: "v17 — whether the volatility filter was requested"}
        activeAssets:
          type: array
          items: {type: string}
          description: "v17 — assets actually scanned after the volatility filter"
        scalingRoute:
          type: string
          nullable: true
          description: "v18 — route of the top-ranked cycle the scaling table covers (null when no cycles)"
        scaling:
          type: array
          items:
            $ref: "#/components/schemas/ObScalingRow"
          description: "v18 — top route re-simulated at $10/$50/$100/$500/$1,000; unabsorbable sizes omitted"
        scannedAt: {type: string}

    CointegrationSignal:
      type: object
      required: [pair, asset1, asset2, price1, price2, hedgeRatio, spread, zScore, direction, edgePct, observations, timestamp]
      properties:
        pair:
          type: string
          description: "Display label, e.g. SOL/ETH"
        asset1:
          type: string
          description: "Short symbol for asset 1, e.g. SOL"
        asset2:
          type: string
          description: "Short symbol for asset 2, e.g. ETH"
        price1:
          type: number
        price2:
          type: number
        hedgeRatio:
          type: number
          description: "Kalman-filter beta (hedge ratio)"
        spread:
          type: number
          description: "Latest Kalman spread value"
        zScore:
          type: number
          description: "Normalised z-score of the current spread"
        direction:
          type: string
          enum: [long_asset1, short_asset1]
        edgePct:
          type: number
          description: "Conservative edge estimate as a fraction (not %)"
        observations:
          type: integer
          description: "Number of spread observations in the Kalman history"
        timestamp:
          type: string

    CointegrationScanResult:
      type: object
      required: [signals, scannedAt]
      properties:
        signals:
          type: array
          items:
            $ref: "#/components/schemas/CointegrationSignal"
        scannedAt:
          type: string

    ObExecuteRequest:
      type: object
      required: [krakenKey, krakenSecret, assetA, assetB]
      properties:
        krakenKey:
          type: string
        krakenSecret:
          type: string
        assetA:
          type: string
          description: "Asset A of the displayed top route (server re-verifies via fresh pre-flight)"
        assetB:
          type: string
        tradeSizeUsd:
          type: number
          default: 10
        feesPct:
          type: number
          default: 0.5
        minProfitUsd:
          type: number
          default: 0.02
          description: "Min net profit ($) at $10; pre-flight gate scales it by size/10"
        isDryRun:
          type: boolean
          default: true

    FeeTierRequest:
      type: object
      required: [krakenKey, krakenSecret]
      properties:
        krakenKey: { type: string }
        krakenSecret: { type: string }

    ExecutionQualityRoute:
      type: object
      required: [route, style, attempts, liveAttempts, liveFillRate, avgExpectedProfitUsd, avgRealizedProfitUsd, avgShortfallUsd, avgSlippagePct, totalRealizedProfitUsd, lastAttemptAt]
      properties:
        route: { type: string }
        style: { type: string, enum: [taker, maker] }
        attempts: { type: integer }
        liveAttempts: { type: integer }
        liveFillRate: { type: number, nullable: true }
        avgExpectedProfitUsd: { type: number, nullable: true }
        avgRealizedProfitUsd: { type: number, nullable: true }
        avgShortfallUsd: { type: number, nullable: true }
        avgSlippagePct: { type: number, nullable: true }
        totalRealizedProfitUsd: { type: number, nullable: true }
        lastAttemptAt: { type: string }
    ExecutionQualityResult:
      type: object
      required: [routes, totalRecords]
      properties:
        routes:
          type: array
          items: { $ref: "#/components/schemas/ExecutionQualityRoute" }
        totalRecords: { type: integer }
    FeeTierResult:
      type: object
      required: [takerFeePct, makerFeePct, source]
      properties:
        takerFeePct: { type: number, nullable: true }
        makerFeePct: { type: number, nullable: true }
        source: { type: string, enum: [account, unavailable] }

    GraphRouteHop:
      type: object
      required: [from, to, exchange, pair, side, amountIn, amountOut, feePct, limitPrice]
      properties:
        from: { type: string }
        to: { type: string }
        exchange: { type: string, enum: [kraken, coinbase, bridge] }
        pair: { type: string }
        side: { type: string, enum: [buy, sell, bridge] }
        amountIn: { type: number }
        amountOut: { type: number }
        feePct: { type: number }
        limitPrice: { type: number }

    GraphRoute:
      type: object
      required: [hops, description, startUsd, grossProfitUsd, feeUsd, netProfitUsd, profitPct, slippagePct, status]
      properties:
        hops:
          type: array
          items: { $ref: "#/components/schemas/GraphRouteHop" }
        description: { type: string }
        startUsd: { type: number }
        grossProfitUsd: { type: number }
        feeUsd: { type: number }
        netProfitUsd: { type: number }
        profitPct: { type: number }
        slippagePct: { type: number }
        status: { type: string, enum: [VIABLE, REJECTED] }

    GraphScanResult:
      type: object
      required: [routes, tradeSizeUsd, krakenFeesPct, coinbaseFeesPct, executionStyle, assetsScanned, routesEvaluated, scannedAt]
      properties:
        executionStyle: { type: string, enum: [taker, maker] }
        routes:
          type: array
          items: { $ref: "#/components/schemas/GraphRoute" }
        tradeSizeUsd: { type: number }
        krakenFeesPct: { type: number }
        coinbaseFeesPct: { type: number }
        assetsScanned: { type: integer }
        routesEvaluated: { type: integer }
        scannedAt: { type: string, format: date-time }

    GraphExecuteRequest:
      type: object
      required: [krakenKey, krakenSecret]
      properties:
        krakenKey: { type: string }
        krakenSecret: { type: string }
        coinbaseKey: { type: string }
        coinbaseSecret: { type: string }
        routeDescription:
          type: string
          description: Exact route description to execute; omitted = fresh top route
        tradeSizeUsd: { type: number, default: 10 }
        krakenFeesPct: { type: number, default: 0.16 }
        coinbaseFeesPct: { type: number, default: 0.4 }
        minProfitUsd: { type: number, default: 0.02 }
        isDryRun: { type: boolean, default: true }
        executionStyle: { type: string, enum: [taker, maker], default: taker }

    GraphExecuteResult:
      type: object
      required: [success, isDryRun, executed, route]
      properties:
        success: { type: boolean }
        isDryRun: { type: boolean }
        executed: { type: boolean }
        route: { type: string }
        preflightProfitUsd: { type: number, nullable: true }
        realizedProfitUsd:
          type: number
          nullable: true
          description: "Actual USD profit from confirmed fills (cost/fee accounting); null when unknown"
        orderIds:
          type: array
          items: { type: string }
          nullable: true
        error: { type: string, nullable: true }

    ObExecuteResult:
      type: object
      required: [success, isDryRun, executed, route]
      properties:
        success:
          type: boolean
        isDryRun:
          type: boolean
        executed:
          type: boolean
          description: "True when orders were placed (or dry-run recorded); false when pre-flight rejected"
        route:
          type: string
        preflightProfitUsd:
          type: ["number", "null"]
          description: "Fresh pre-flight net profit ($); null when books couldn't be fetched"
        leg1OrderId:
          type: ["string", "null"]
        leg2OrderId:
          type: ["string", "null"]
        leg3OrderId:
          type: ["string", "null"]
        error:
          type: ["string", "null"]

    TriExecuteRequest:
      type: object
      required: [krakenKey, krakenSecret, loop]
      properties:
        krakenKey:
          type: string
        krakenSecret:
          type: string
        loop:
          type: string
          description: "USD→BTC→SOL→USD or USD→SOL→BTC→USD"
        tradeUsd:
          type: number
          description: "Override trade size in USD. Auto-sized when omitted."
        isDryRun:
          type: boolean
          default: false
        orderType:
          type: string
          enum: [market, limit]
          default: market
          description: "market = force/dry-run (taker); limit = auto-loop (post-only maker)"

    TriExecuteResult:
      type: object
      required: [success, isDryRun, estimatedProfitUsd]
      properties:
        success:
          type: boolean
        isDryRun:
          type: boolean
        estimatedProfitUsd:
          type: number
        leg1OrderId:
          type: ["string", "null"]
        leg2OrderId:
          type: ["string", "null"]
        leg3OrderId:
          type: ["string", "null"]
        error:
          type: ["string", "null"]
        priceSource:
          type: string
          enum: [direct, synthetic]
          description: >
            "direct" = live ETHSOL WS market was used for leg 2;
            "synthetic" = ETH/USD ÷ SOL/USD cross rate was used.
            Only present for ETH loops; absent for BTC loops.
        synthetic:
          type: boolean
          description: >
            True when the ETH/SOL leg used a synthetic cross rate instead of the
            direct ETHSOL order-book market. Live execution is blocked when true.

    TriangularOpportunity:
      type: object
      required: [exchange, loop, profitPct, solUsd, ethUsd, ethSol, timestamp]
      properties:
        exchange:
          type: string
          description: "Exchange where the loop was detected (e.g. Kraken)"
        loop:
          type: string
          description: "Loop direction, e.g. USD→SOL→ETH→USD"
        profitPct:
          type: number
          description: "Net profit percentage after fees"
        solUsd:
          type: number
          description: "SOL/USD mid price used"
        ethUsd:
          type: number
          description: "ETH/USD or BTC/USD mid price used (see variant)"
        ethSol:
          type: number
          description: "ETH/SOL or SOL/BTC mid price used (see variant)"
        variant:
          type: string
          description: "'eth' for ETH/SOL loops, 'btc' for BTC/SOL loops (v13)"
        timestamp:
          type: string

    TriangularScanResult:
      type: object
      required: [opportunities, prices, scannedAt]
      properties:
        opportunities:
          type: array
          items:
            $ref: "#/components/schemas/TriangularOpportunity"
        prices:
          type: object
          description: "Raw prices used in this scan"
          required: []
          additionalProperties: true
        priceSource:
          type: object
          description: "Price source per exchange: 'direct' if live ETH/SOL market data is available, 'synthetic' if cross-rate is used"
          additionalProperties:
            type: string
            enum: [direct, synthetic]
        scannedAt:
          type: string

    TradeSummary:
      type: object
      required: [totalTrades, liveTrades, dryRunTrades, totalProfitUsd, avgNetEdgePct, bestTradeProfitUsd, recentTrades]
      properties:
        totalTrades:
          type: integer
        liveTrades:
          type: integer
        dryRunTrades:
          type: integer
        totalProfitUsd:
          type: number
        avgNetEdgePct:
          type: number
        bestTradeProfitUsd:
          type: number
        recentTrades:
          type: array
          items:
            $ref: "#/components/schemas/TradeRecord"
