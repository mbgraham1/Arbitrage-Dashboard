        running: { type: boolean }
        startedAt: { type: string, nullable: true }
        lastTickAt: { type: string, nullable: true }
        ticks: { type: integer }
        fires: { type: integer }
        completed: { type: integer }
        realizedUsd: { type: number }
        stopReason: { type: string, nullable: true }
        config:
          type: object
          properties:
            minNetUsd: { type: number }
            bufferUsd: { type: number }
            restWindowSec: { type: number }
        sizeUsd: { type: number }
        reconcileLatch: { type: string, nullable: true }
        lastBest:
          allOf: [{ $ref: "#/components/schemas/MmScanRow" }]
          nullable: true
        lastOutcome:
          type: object
          nullable: true
