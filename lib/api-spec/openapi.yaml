        balances:
          type: object
          properties:
            krakenUsd: { type: number }
            coinbaseUsd: { type: number }
            fetchedAt: { type: string }
        at: { type: string }
        best:
          allOf: [{ $ref: "#/components/schemas/MmScanRow" }]
          nullable: true
        rows:
          type: array
          items: { $ref: "#/components/schemas/MmScanRow" }
        runnable: { type: integer }
    MmAutoStartRequest:
      type: object
      required: [krakenKey, krakenSecret, coinbaseKey, coinbaseSecret]
      properties:
        krakenKey: { type: string }
        krakenSecret: { type: string }
        coinbaseKey: { type: string }
        coinbaseSecret: { type: string }
        minNetUsd: { type: number, nullable: true }
        bufferUsd: { type: number, nullable: true }
        restWindowSec: { type: number, nullable: true }
    MmAutoStatus:
      type: object
